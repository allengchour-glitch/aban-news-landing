<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="aban Arcade">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1c2550"/>
      <stop offset="0.62" stop-color="#0d1030"/>
      <stop offset="1" stop-color="#06070f"/>
    </radialGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fffe6"/>
      <stop offset="1" stop-color="#2ec7ff"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98bff"/>
      <stop offset="1" stop-color="#7a4fd0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- full-bleed background (maskable-safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- content kept within central safe zone ~ 96..416 -->
  <g filter="url(#glow)">
    <!-- base -->
    <ellipse cx="256" cy="386" rx="118" ry="34" fill="#151a3c"/>
    <ellipse cx="256" cy="380" rx="118" ry="34" fill="#20285a" stroke="#5ef2ff" stroke-width="4"/>
    <!-- stick -->
    <rect x="240" y="238" width="32" height="120" rx="16" fill="url(#stick)"/>
    <!-- knob -->
    <circle cx="256" cy="214" r="58" fill="url(#ball)"/>
    <circle cx="256" cy="214" r="58" fill="none" stroke="#eafffb" stroke-width="4" opacity="0.7"/>
    <ellipse cx="238" cy="196" rx="18" ry="12" fill="#ffffff" opacity="0.55"/>
    <!-- buttons -->
    <circle cx="360" cy="360" r="26" fill="#ff5c9a"/>
    <circle cx="360" cy="360" r="26" fill="none" stroke="#ffd0e4" stroke-width="3" opacity="0.7"/>
    <circle cx="152" cy="360" r="22" fill="#ffcf3a"/>
    <circle cx="152" cy="360" r="22" fill="none" stroke="#fff0c0" stroke-width="3" opacity="0.7"/>
  </g>
</svg>
