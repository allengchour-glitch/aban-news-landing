<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Danke — dein KI-Starter-Kit | aban news</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1f2937;background:#fffbf5;line-height:1.6;max-width:640px;margin:0 auto;padding:2rem 1.25rem;text-align:center}
    .btn{display:inline-block;background:#b45309;color:#fff;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:14px;font-size:1.05rem;margin:1rem 0}
    .btn[hidden]{display:none}
    .muted{color:#6b7280;font-size:.9rem}
    .box{background:#fff;border:1px solid #ece3d4;border-radius:14px;padding:1.6rem;margin:1.4rem 0}
  </style>
</head>
<body>
  <p style="color:#9a3412;font-weight:700">☕ aban news</p>
  <h1>Dein Kit-Download</h1>
  <div class="box" id="box" role="status" aria-live="polite"><p>Zahlung wird geprüft …</p></div>
  <button class="btn" id="erneut" type="button" hidden>Zahlung erneut prüfen</button>
  <p class="muted">Problem mit dem Download? Schreib mir: <a href="mailto:hallo@abannews.com" style="color:#b45309">hallo@abannews.com</a></p>
  <p class="muted"><a href="/" style="color:#6b7280">← zur Startseite</a> · <a href="/shop.html" style="color:#6b7280">weitere Kits</a></p>
<script>
  (function(){
    var box=document.getElementById('box');
    var erneut=document.getElementById('erneut');
    var sid=new URLSearchParams(location.search).get('session_id');
    if(!sid||!/^cs_[A-Za-z0-9_]+$/.test(sid)){box.textContent='Die Bestellkennung fehlt oder ist ungültig. Öffne den ursprünglichen Rückkehr-Link nach deiner Zahlung erneut oder kontaktiere den Support unten. Falls du bereits bezahlt hast: bitte nicht nochmals kaufen.';return;}
    function pruefen(){
    erneut.hidden=true;erneut.disabled=true;
    box.textContent='Zahlung wird geprüft …';
    var controller=new AbortController();
    var timer;
    var deadline=new Promise(function(resolve,reject){
      timer=setTimeout(function(){controller.abort();reject(new Error('Zeitgrenze'));},15000);
    });
    Promise.race([
      fetch('/api/kit-download?session_id='+encodeURIComponent(sid),{cache:'no-store',referrerPolicy:'no-referrer',signal:controller.signal})
        .then(function(r){return r.json();}),
      deadline
    ])
      .then(function(d){
        if(d&&d.ok&&/^\/downloads\/kits\/[a-f0-9]{24}\.zip$/.test(d.url)){
          box.innerHTML='<p>Dein Kit ist bereit:</p><a class="btn" href="'+d.url+'">📦 Kit herunterladen</a>'+
                        '<p class="muted">Link gilt für dich — bitte nicht öffentlich teilen.</p>';
        } else {
          box.textContent=((d&&d.error)||'Konnte den Download nicht freischalten.')+' Falls du gerade gezahlt hast: kurz warten und erneut prüfen. Bitte nicht nochmals kaufen.';
          erneut.hidden=false;
        }
      })
      .catch(function(){box.textContent='Die Prüfung wurde unterbrochen oder dauert zu lange. Bitte erneut prüfen oder den Support kontaktieren. Bitte nicht nochmals kaufen.';erneut.hidden=false;})
      .finally(function(){clearTimeout(timer);erneut.disabled=false;});
    }
    erneut.addEventListener('click',pruefen);
    pruefen();
  })();
</script>
<script defer src="/js/announce.js"></script>
</body>
</html>
