<style>

    <radialGradient id="wolkeG" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".98"/><stop offset="1" stop-color="#ffd9c9" stop-opacity=".85"/></radialGradient>
    <linearGradient id="hang1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c9a0"/><stop offset="1" stop-color="#8fb78a"/></linearGradient>
    <linearGradient id="hang2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8dbb7a"/><stop offset="1" stop-color="#6f9f62"/></linearGradient>

    <linearGradient id="dunst" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3dc" stop-opacity="0"/><stop offset=".5" stop-color="#fff3dc" stop-opacity=".55"/><stop offset="1" stop-color="#fff3dc" stop-opacity="0"/></linearGradient>
    <linearGradient id="strahl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6c9" stop-opacity=".28"/><stop offset="1" stop-color="#fff6c9" stop-opacity="0"/></linearGradient>
    <linearGradient id="krone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79b46a"/><stop offset="1" stop-color="#4c8a50"/></linearGradient>

<script>
(function () {
  const M = Motion, E = M.EASE, Z = window.__ZEITEN, T = Z.gesamt;
  const SZ = Z.szenen; // [{id,t0,t1,zeilen:[{start,dauer,text,titel}]}]
  const s = document.getElementById('s');
  const g = (p, a) => M.svg('g', a || {}, p);
  const kf = (pairs) => pairs.map(p => ({ offset: p[0] / T, ...p[1] }));
  const TINTE = '#2b2118', STRICH = '#1d1d22', GY = 1560;   // GY = Bodenlinie
  const rr = M.rnd(11);
  const aussenInnen = (parent, x, y) => g(g(parent, { transform: `translate(${x},${y})` }));   // aussen Position, innen Animation (sonst überschreibt CSS-transform das Attribut)
  const unten = (e, ox, oy) => { e.style.transformBox = 'fill-box'; e.style.transformOrigin = `${ox || '50%'} ${oy || '100%'}`; };
  const t0s = SZ.map(z => z.t0), t1s = SZ.map(z => z.t1);

  /* ============ Stimmung: Morgen → trübe (Szene 3) → Abendrot (Szene 4) → zurück (Loop) ============ */
  M.at('#truebe', kf([[0, { opacity: 0 }], [t0s[2] - .2, { opacity: 0 }], [t0s[2] + .6, { opacity: 1 }], [t1s[2] - .2, { opacity: 1 }], [t1s[2] + .6, { opacity: 0 }], [T, { opacity: 0 }]]), { t: 0, d: T, ease: E.linear });
  M.at('#abend', kf([[0, { opacity: 0 }], [t0s[3], { opacity: 0 }], [t0s[3] + 2.2, { opacity: 1 }], [T - 1.5, { opacity: 1 }], [T - .15, { opacity: 0 }], [T, { opacity: 0 }]]), { t: 0, d: T, ease: E.linear });

  /* ============ Welt (Bilderbuch-Hintergrund, über die ganze Zeit) ============ */
  const welt = g(s);
  // Sterne (nur im Abendhimmel)
  const sterne = g(welt);
  for (let i = 0; i < 16; i++) { const st = M.svg('circle', { cx: (40 + rr() * 1000).toFixed(0), cy: (60 + rr() * 560).toFixed(0), r: (2 + rr() * 3).toFixed(1), fill: '#fff' }, sterne);
    M.loop(st, [{ opacity: .35 }, { opacity: 1 }, { opacity: .35 }], { t: rr() * 2, d: 1.6 + rr(), n: Math.ceil(T / 1.6) }); }
  M.at(sterne, kf([[0, { opacity: 0 }], [t0s[3] + 1, { opacity: 0 }], [t0s[3] + 3, { opacity: 1 }], [T - 1.5, { opacity: 1 }], [T - .15, { opacity: 0 }], [T, { opacity: 0 }]]), { t: 0, d: T, ease: E.linear });
  // Sonne: steigt (Szene 1), steht (2, 3), sinkt zum Horizont (4), dann unsichtbar
  const sonne = g(welt), sonneIn = g(sonne);
  const strahlen = g(sonneIn);
  for (let i = 0; i < 12; i++) M.svg('path', { d: 'M0 0 L1100 -70 L1100 70Z', fill: 'url(#strahl)', transform: `rotate(${i * 30})` }, strahlen);
  M.at(strahlen, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(30deg)' }], { t: 0, d: T, ease: E.linear });
  M.svg('circle', { r: 210, fill: 'url(#glut)' }, sonneIn);
  M.svg('circle', { r: 74, fill: '#ffd166', stroke: '#e8a53a', 'stroke-width': 5 }, sonneIn);
  M.at(sonne, kf([[0, { transform: 'translate(900px,1180px)', opacity: 0 }], [.3, { transform: 'translate(900px,1180px)', opacity: 1 }], [t1s[0], { transform: 'translate(900px,700px)', opacity: 1 }],
    [t1s[2], { transform: 'translate(880px,740px)', opacity: 1 }], [t0s[3] + 5, { transform: 'translate(720px,1210px)', opacity: 1 }], [T - 1.5, { transform: 'translate(720px,1260px)', opacity: 1 }], [T - .15, { transform: 'translate(720px,1300px)', opacity: 0 }], [T, { transform: 'translate(900px,1180px)', opacity: 0 }]]), { t: 0, d: T, ease: E.inOut });
  // Wolken (weich, rosig), ziehen langsam, unsichtbar an den Enden
  function wolke(x, y, sc, dx) {
    const o = g(welt, { transform: `translate(${x},${y}) scale(${sc})` }), w = g(o);
    [[0, 0, 80, 34], [-70, 10, 62, 28], [64, 12, 66, 26], [20, -22, 56, 30]].forEach(([cx, cy, rx, ry]) => M.svg('ellipse', { cx: cx, cy: cy, rx: rx, ry: ry, fill: 'url(#wolkeG)' }, w));
    M.at(w, kf([[0, { transform: 'translateX(0)', opacity: 0 }], [2, { transform: `translateX(${dx * 2 / T}px)`, opacity: 1 }], [T - 2, { transform: `translateX(${dx * (T - 2) / T}px)`, opacity: 1 }], [T, { transform: `translateX(${dx}px)`, opacity: 0 }]]), { t: 0, d: T, ease: E.linear });
  }
  wolke(200, 800, 1.2, 240); wolke(760, 900, .95, -200); wolke(130, 1040, .75, 200);
  // ferne blaue Berge (Tiefe)
  M.svg('path', { d: 'M-60 1330 L120 1190 L230 1270 L380 1130 L520 1260 L640 1200 L790 1300 L930 1160 L1160 1300 V1500 H-60Z', fill: '#b9cde0', opacity: .75, stroke: 'rgba(43,33,24,.25)', 'stroke-width': 3, 'stroke-linejoin': 'round' }, welt);
  M.svg('path', { d: 'M380 1130 L338 1198 L372 1186 L398 1214 L420 1180 L452 1198Z M930 1160 L890 1222 L922 1210 L944 1236 L966 1204 L996 1220Z', fill: '#fff', opacity: .85 }, welt);
  // ferne Hügel + Tannenwald
  M.svg('path', { d: 'M-60 1400 C100 1290 260 1280 420 1340 S720 1380 900 1300 S1090 1290 1160 1330 V1920 H-60Z', fill: 'url(#hang1)', stroke: 'rgba(43,33,24,.45)', 'stroke-width': 3 }, welt);
  for (let i = 0; i < 14; i++) {   // Tannen auf dem fernen Hügel
    const x = 30 + i * 78 + rr() * 30, y = 1342 + Math.sin(i * .9) * 22, h = 70 + rr() * 40, w = g(g(welt, { transform: `translate(${x.toFixed(0)},${y.toFixed(0)})` }));
    M.svg('path', { d: `M0 0 L-${(h * .32).toFixed(0)} ${(h * .42).toFixed(0)} h${(h * .16).toFixed(0)} L-${(h * .4).toFixed(0)} ${(h * .8).toFixed(0)} h${(h * .3).toFixed(0)} V${(h * 1.0).toFixed(0)} h${(h * .2).toFixed(0)} V${(h * .8).toFixed(0)} h${(h * .3).toFixed(0)} L${(h * .24).toFixed(0)} ${(h * .42).toFixed(0)} h${(h * .16).toFixed(0)} Z`, transform: `translate(0,${-h})`, fill: '#5f9a7a', stroke: 'rgba(43,33,24,.5)', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, w);
  }
  M.svg('path', { d: 'M-60 1490 C200 1410 420 1420 600 1462 S900 1490 1160 1420 V1920 H-60Z', fill: 'url(#hang2)', stroke: 'rgba(43,33,24,.5)', 'stroke-width': 3.5 }, welt);
  M.svg('rect', { x: -40, y: 1330, width: 1160, height: 160, fill: 'url(#dunst)' }, welt);   // Dunst zwischen den Ebenen
  // Vordergrund: Wiese
  M.svg('rect', { x: -40, y: GY - 40, width: 1160, height: 520, fill: 'url(#boden)' }, welt);
  // Pinselstriche im Boden
  for (let i = 0; i < 40; i++) { const x = rr() * 1100, y = GY + 20 + rr() * 330, l = 30 + rr() * 60;
    M.svg('path', { d: `M${x.toFixed(0)} ${y.toFixed(0)} q${(l / 2).toFixed(0)} -8 ${l.toFixed(0)} 0`, stroke: rr() > .5 ? 'rgba(255,255,255,.22)' : 'rgba(43,33,24,.14)', 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none' }, welt); }
  // Weizen: goldene Halme links und rechts im Vordergrund (nie vor Pia, damit die Füsse frei bleiben)
  function halm(parent, x, y, h) {
    const p = M.svg('path', { d: `M${x} ${y} Q${x + 6} ${y - h * .5} ${x + 2} ${y - h}`, stroke: '#b58a38', 'stroke-width': 4.5, 'stroke-linecap': 'round', fill: 'none' }, parent);
    let d = ''; for (let k = 0; k < 4; k++) d += `M${x + 2} ${y - h + k * 11} q-13 -9 -15 -24 q14 4 15 24 M${x + 2} ${y - h + k * 11} q13 -9 15 -24 q-14 4 -15 24 `;
    M.svg('path', { d: d, fill: '#e6bf52', stroke: '#9c7430', 'stroke-width': 1.8 }, parent);
    return p;
  }
  function weizenBueschel(x, y, n, hoehe) {
    const w = g(g(welt, { transform: 'translate(0,0)' }));
    for (let i = 0; i < n; i++) halm(w, x + (i - n / 2) * 22 + rr() * 8, y + rr() * 14, hoehe * (.75 + rr() * .5));
    unten(w, `${x}px`, `${y}px`);
    w.style.transformBox = 'view-box'; w.style.transformOrigin = `${x}px ${y}px`;
    M.loop(w, [{ transform: 'rotate(-2.2deg)' }, { transform: 'rotate(2.2deg)' }, { transform: 'rotate(-2.2deg)' }], { t: rr() * 2, d: 2.6, n: Math.ceil(T / 2.6) });
  }
  [[40, GY + 70], [150, GY + 150], [60, GY + 260], [960, GY + 80], [1040, GY + 170], [900, GY + 270], [1000, GY + 320]].forEach(([x, y]) => weizenBueschel(x, y, 5, 130 + (y - GY) * .35));
  // Blumen in der Wiese
  const bl = ['#ffffff', '#ffe066', '#ff8fa3', '#c8a2ff'];
  for (let i = 0; i < 22; i++) {
    const x = 30 + rr() * 1020, y = GY + 50 + rr() * 330, f = bl[i % 4], w = g(g(welt, { transform: `translate(${x.toFixed(0)},${y.toFixed(0)})` }));
    M.svg('path', { d: 'M0 0 q-3 -20 0 -40', stroke: '#4f8a45', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, w);
    for (let k = 0; k < 5; k++) M.svg('circle', { cx: (Math.cos(k * 1.2566) * 8).toFixed(1), cy: (-44 + Math.sin(k * 1.2566) * 8).toFixed(1), r: 6.5, fill: f, stroke: 'rgba(43,33,24,.55)', 'stroke-width': 1.6 }, w);
    M.svg('circle', { cx: 0, cy: -44, r: 4.5, fill: '#f2a93b' }, w);
    unten(w, '50%', '100%');
    M.loop(w, [{ transform: 'rotate(-4deg)' }, { transform: 'rotate(4deg)' }, { transform: 'rotate(-4deg)' }], { t: rr() * 2, d: 2.4, n: Math.ceil(T / 2.4) });
  }
  // dunkle Grasspitzen am unteren Bildrand (rahmen das Bild)
  let gd = 'M-20 1930'; for (let x = -20; x <= 1100; x += 34) gd += ` L${x} ${1880 - Math.round(rr() * 46)} L${x + 17} 1930`; gd += ' Z';
  M.svg('path', { d: gd, fill: '#476f38', stroke: 'rgba(0,0,0,.25)', 'stroke-width': 3 }, welt);
  // Vignette (dunkelt die Bildränder leicht ab, lenkt den Blick in die Mitte)
  M.svg('rect', { x: -40, y: -40, width: 1160, height: 2000, fill: 'url(#vignette)' }, welt);
  welt.setAttribute('filter', 'url(#wackel)');

  /* ============ Helfer ============ */
  function herz(parent, x, y, t, farbe) {
    const h = aussenInnen(parent, x, y);
    M.svg('path', { d: 'M0 26 C-60 -16 -40 -60 0 -30 C40 -60 60 -16 0 26Z', fill: farbe || '#ef476f', stroke: STRICH, 'stroke-width': 6, 'stroke-linejoin': 'round' }, h);
    M.svg('path', { d: 'M-24 -24 q-8 6 -8 16', stroke: '#fff', 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none', opacity: .8 }, h);
    unten(h, '50%', '70%');
    M.at(h, [{ opacity: 0, transform: 'scale(0)' }, { opacity: 1, transform: 'scale(1.15)' }, { opacity: 1, transform: 'scale(1)' }], { t: t, d: .6, ease: E.out });
    M.at(h, [{ opacity: 1, transform: 'translateY(0) scale(1)' }, { opacity: 0, transform: 'translateY(-50px) scale(1.1)' }], { t: t + 1.7, d: 1.0, ease: E.out, fill: 'forwards' });
  }
  function funkeln(parent, x, y, t) {   // kleiner vierzackiger Stern
    const o = aussenInnen(parent, x, y);
    M.svg('path', { d: 'M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18Z', fill: '#ffd166', stroke: STRICH, 'stroke-width': 4, 'stroke-linejoin': 'round' }, o);
    unten(o, '50%', '50%');
    M.at(o, [{ opacity: 0, transform: 'scale(0) rotate(0deg)' }, { opacity: 1, transform: 'scale(1) rotate(90deg)' }, { opacity: 0, transform: 'scale(.2) rotate(180deg)' }], { t: t, d: 1.2, ease: E.out });
  }
  // Szene: Wisch-Übergang (von rechts herein, nach links hinaus), leichte Kamerafahrt, Wackel-Filter
  function szene(i) {
    const t0 = SZ[i].t0, t1 = i === SZ.length - 1 ? SZ[i].t1 - .15 : SZ[i].t1, d = t1 - t0, f = Math.min(.6, d / 4) / d;
    const aussen = g(s), cam = g(aussen);
    aussen.setAttribute('filter', 'url(#wackel)');
    M.at(aussen, [{ opacity: 0, transform: 'translateX(90px)', offset: 0 }, { opacity: 1, transform: 'translateX(0)', offset: f }, { opacity: 1, transform: 'translateX(0)', offset: 1 - f }, { opacity: 0, transform: 'translateX(-90px)', offset: 1 }], { t: t0, d: d, ease: E.out });
    cam.style.transformOrigin = '540px ' + GY + 'px';
    M.at(cam, [{ transform: 'scale(1)' }, { transform: 'scale(1.04)' }], { t: t0, d: d, ease: E.linear });
    return cam;
  }
  const L = (i, k) => SZ[i].zeilen[k];
  function baum(parent, x, y, sc) {   // Laubbaum mit dickem Stamm und dreitonigem Blattwerk
    const o = g(parent, { transform: `translate(${x},${y}) scale(${sc})` }), w = g(o);
    M.svg('path', { d: 'M-22 0 Q-16 -120 -30 -190 L30 -190 Q16 -120 22 0Z', fill: '#8a5f3a', stroke: STRICH, 'stroke-width': 5, 'stroke-linejoin': 'round' }, w);
    M.svg('path', { d: 'M-8 -20 q4 -60 -2 -110', stroke: 'rgba(43,33,24,.35)', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, w);
    [[0, -300, 130, '#4c8a50'], [-92, -240, 96, '#4c8a50'], [96, -240, 96, '#4c8a50'], [-30, -330, 100, '#79b46a'], [60, -300, 92, '#79b46a'], [-70, -270, 70, '#9bd079']].forEach(([cx, cy, r, f]) =>
      M.svg('circle', { cx: cx, cy: cy, r: r, fill: f, stroke: STRICH, 'stroke-width': 4.5 }, w));
    w.style.transformBox = 'fill-box'; w.style.transformOrigin = '50% 100%';
    M.loop(w, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(1.3deg)' }, { transform: 'rotate(0deg)' }], { t: 0, d: 3.6, n: Math.ceil(T / 3.6) });
    return o;
  }
  function tisch(parent, x, breite, hoehe) {   // Holztisch mit Tischdecke
    const t = g(parent), oben = GY - hoehe;
    M.svg('ellipse', { cx: x + breite / 2, cy: GY + 4, rx: breite / 2 + 10, ry: 13, fill: 'rgba(30,30,40,.18)' }, t);
    M.svg('line', { x1: x + 34, y1: oben, x2: x + 34, y2: GY, stroke: STRICH, 'stroke-width': 12, 'stroke-linecap': 'round' }, t);
    M.svg('line', { x1: x + breite - 34, y1: oben, x2: x + breite - 34, y2: GY, stroke: STRICH, 'stroke-width': 12, 'stroke-linecap': 'round' }, t);
    M.svg('rect', { x: x, y: oben - 10, width: breite, height: 28, rx: 10, fill: '#d9a458', stroke: STRICH, 'stroke-width': 6 }, t);
    M.svg('path', { d: `M${x + 18} ${oben + 18} v22 l14 -10 l14 10 l14 -10 l14 10 l14 -10 v-12`, fill: '#fff', stroke: STRICH, 'stroke-width': 5, 'stroke-linejoin': 'round' }, t);
    return oben - 10;
  }
