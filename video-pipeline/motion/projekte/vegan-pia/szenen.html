<!doctype html>
<meta charset="utf-8">
<title>Pia und die Frage nach dem Essen — Strichmännchen-Short, ca. 28 s</title>
<style>
  @property --v { syntax: "<integer>"; initial-value: 0; inherits: false; }
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#eaf5ef;font-family:Inter,"DejaVu Sans",sans-serif}
  .bg{position:absolute;inset:0}
  /* Papierkorn: fertig gerechnete Kachel unter dem Himmel (ein SVG-Rauschfilter kostete über 2/3 der Renderzeit, eine Deckschicht über der Szene noch 40 %) */
  #bg{background:url(korn.png),linear-gradient(180deg,#cfeaf5 0%,#e9f6ef 42%,#fbf6e4 100%)}
  #gold{background:url(korn.png),linear-gradient(180deg,#f8c98b 0%,#fde1ae 45%,#fff0cf 100%);opacity:0}
  svg,#ui{position:absolute;inset:0}
  #ui{width:1080px;height:1920px}
  /* Aufkleber-Stil: weisse Karte, dunkle Kontur, harter Schatten — gilt für Titel, Infografiken */
  .karte{background:#fff;border:5px solid #22303c;border-radius:36px;box-shadow:0 11px 0 rgba(34,48,60,.20)}
  .cap{position:absolute;left:180px;width:720px;top:215px;box-sizing:border-box;padding:26px 38px;
       color:#22303c;text-align:center;font-weight:800;line-height:1.14;opacity:0;font-size:62px}
  .cap .w{display:inline-block;margin:0 .13em}
  .t{position:absolute;color:#22303c;font-weight:800}
  .quelle{position:absolute;left:270px;width:630px;text-align:center;font-size:27px;font-weight:700;color:#4f5d68;opacity:0}
  #zaehler{counter-reset:v var(--v)}
  #zaehler::after{content:counter(v)}
  .szui{position:absolute;inset:0;opacity:0}
  .spur{position:absolute;height:58px;border:4px solid #22303c;border-radius:29px;background:#ece6d8;overflow:hidden}
  .fuell{position:absolute;left:0;top:0;height:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#d49a62,#b9763f)}
</style>
<div class="bg" id="bg"></div>
<div class="bg" id="gold"></div>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <!-- leichtes Wackeln der Linien (statisch): wirkt wie von Hand gezeichnet -->
    <filter id="wackel" filterUnits="userSpaceOnUse" x="-80" y="-80" width="1240" height="2080">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="glut"><stop offset="0" stop-color="#fff3bf" stop-opacity=".95"/><stop offset="1" stop-color="#fff3bf" stop-opacity="0"/></radialGradient>
  </defs>
</svg>
<div id="ui">
  <!-- Szene 2: Fläche gegen Kalorien -->
  <div class="szui" id="ui2">
    <div class="karte" style="position:absolute;left:270px;top:560px;width:630px;height:480px"></div>
    <div class="t" style="left:305px;top:588px;font-size:36px">Agrarfläche für Tiere</div>
    <div class="spur" style="left:305px;top:644px;width:560px"><div class="fuell" id="b1" style="width:75%"></div></div>
    <div class="t" id="w1" style="left:305px;top:712px;font-size:58px;color:#a8642f;opacity:0">etwa ¾</div>
    <div class="t" style="left:305px;top:812px;font-size:36px">Kalorien aus Tierprodukten</div>
    <div class="spur" style="left:305px;top:868px;width:560px"><div class="fuell" id="b2" style="width:18%"></div></div>
    <div class="t" id="w2" style="left:305px;top:936px;font-size:58px;color:#a8642f;opacity:0">etwa 18 %</div>
    <div class="quelle" id="q2" style="top:1060px">Quelle: Our World in Data (FAO; Poore &amp; Nemecek 2018)</div>
  </div>
  <!-- Szene 3: Zähler und Punkte -->
  <div class="szui" id="ui3">
    <div class="karte" style="position:absolute;left:270px;top:560px;width:630px;height:490px"></div>
    <div class="t" id="zaehler" style="left:270px;width:630px;text-align:center;top:575px;font-size:170px;font-weight:900"></div>
    <div class="t" style="left:270px;width:630px;text-align:center;top:770px;font-size:33px">Milliarden Landtiere im Jahr 2022</div>
    <div id="dots" style="position:absolute;left:304px;top:838px;width:565px;height:175px"></div>
    <div class="quelle" id="q3" style="top:1066px">Quelle: Our World in Data (FAO)</div>
  </div>
</div>
<script src="../../motion.js"></script>
<script src="../../stickman.js"></script>
<script src="zeiten.js"></script>
<script>
(function () {
  const M = Motion, E = M.EASE, Z = window.__ZEITEN, T = Z.gesamt;
  const SZ = Z.szenen; // [{id,t0,t1,zeilen:[{start,dauer,text,titel}]}]
  const s = document.getElementById('s');
  const g = (p, a) => M.svg('g', a || {}, p);
  const kf = (pairs) => pairs.map(p => ({ offset: p[0] / T, ...p[1] }));
  const BOGEN = '#e76f51', STRICH = '#22303c', GY = 1560;   // GY = Bodenlinie
  const rr = M.rnd(11);

  /* ============ Welt (Hintergrund, über die ganze Zeit) ============ */
  M.at('#gold', kf([[0, { opacity: 0 }], [SZ[3].t0, { opacity: 0 }], [SZ[3].t0 + 2, { opacity: 1 }], [T - 1.5, { opacity: 1 }], [T - .15, { opacity: 0 }], [T, { opacity: 0 }]]), { t: 0, d: T, ease: E.linear });
  const welt = g(s);
  // Sonne mit Glut und langsam drehenden Strahlen (eine Umdrehung = Videolänge, Loop-sicher)
  const sonne = g(welt, { transform: 'translate(930,600)' }), sonneAnim = g(sonne);
  M.svg('circle', { r: 190, fill: 'url(#glut)' }, sonneAnim);
  const strahlen = g(sonneAnim);
  for (let i = 0; i < 12; i++) M.svg('path', { d: 'M-9 -86 L0 -128 L9 -86Z', fill: '#ffd166', transform: `rotate(${i * 30})` }, strahlen);
  M.at(strahlen, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { t: 0, d: T, ease: E.linear });
  M.svg('circle', { r: 66, fill: '#ffd166', stroke: STRICH, 'stroke-width': 6 }, sonneAnim);
  M.at(sonneAnim, kf([[0, { opacity: 0 }], [.3, { opacity: 0 }], [1.8, { opacity: 1 }], [T - 1.5, { opacity: 1 }], [T - .15, { opacity: 0 }], [T, { opacity: 0 }]]), { t: 0, d: T, ease: E.linear });
  // Wolken ziehen (unsichtbar an den Enden)
  function wolke(x, y, sc, dx) {
    const o = g(welt, { transform: `translate(${x},${y}) scale(${sc})` }), w = g(o);
    M.svg('path', { d: 'M-100 20 q-30 0 -30 -26 q0 -26 30 -26 q8 -30 42 -30 q30 0 40 24 q40 -8 48 24 q4 34 -34 34Z', fill: '#fff', stroke: STRICH, 'stroke-width': 5, 'stroke-linejoin': 'round' }, w);
    M.at(w, kf([[0, { transform: 'translateX(0)', opacity: 0 }], [2, { transform: `translateX(${dx * 2 / T}px)`, opacity: .95 }], [T - 2, { transform: `translateX(${dx * (T - 2) / T}px)`, opacity: .95 }], [T, { transform: `translateX(${dx}px)`, opacity: 0 }]]), { t: 0, d: T, ease: E.linear });
  }
  wolke(210, 790, 1.15, 240); wolke(740, 910, .9, -200); wolke(120, 1030, .7, 200);
  // Hügel in drei Ebenen
  M.svg('path', { d: 'M-60 1420 C120 1300 300 1290 470 1360 S760 1420 930 1330 S1090 1300 1160 1350 V1920 H-60Z', fill: '#bfe3cf' }, welt);
  // Bäume auf den fernen Hügeln
  [[90, 1352, .8], [200, 1330, 1], [770, 1385, .9], [980, 1322, 1.05], [930, 1330, .7]].forEach(([x, y, sc], i) => {
    const o = g(welt, { transform: `translate(${x},${y}) scale(${sc})` }), w = g(o);
    M.svg('rect', { x: -7, y: -6, width: 14, height: 40, rx: 5, fill: '#8a6b4f' }, w);
    M.svg('circle', { cx: 0, cy: -36, r: 38, fill: '#8fcf9b' }, w); M.svg('circle', { cx: -26, cy: -14, r: 26, fill: '#8fcf9b' }, w); M.svg('circle', { cx: 26, cy: -14, r: 26, fill: '#8fcf9b' }, w);
    w.style.transformBox = 'fill-box'; w.style.transformOrigin = '50% 100%';
    M.loop(w, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(1.8deg)' }, { transform: 'rotate(0deg)' }], { t: i * .4, d: 3.5, n: Math.floor(T / 3.5) });
  });
  M.svg('path', { d: 'M-60 1500 C200 1420 420 1430 600 1470 S900 1500 1160 1430 V1920 H-60Z', fill: '#a6d9b4' }, welt);
  // Vordergrund-Boden mit Linie
  M.svg('rect', { x: -40, y: GY, width: 1160, height: 480, fill: '#d6ebc4' }, welt);
  M.svg('path', { d: `M-40 ${GY} H1120`, stroke: STRICH, 'stroke-width': 7, 'stroke-linecap': 'round' }, welt);
  // Grashalme (wiegen leicht)
  for (let i = 0; i < 16; i++) {
    const x = 20 + rr() * 1040, y = GY + 40 + rr() * 300, w = g(g(welt, { transform: `translate(${x.toFixed(0)},${y.toFixed(0)})` }));
    M.svg('path', { d: 'M0 0 l-8 -22 M0 0 l0 -28 M0 0 l8 -22', stroke: '#7bb868', 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none' }, w);
    w.style.transformBox = 'fill-box'; w.style.transformOrigin = '50% 100%';
    M.loop(w, [{ transform: 'rotate(-5deg)' }, { transform: 'rotate(5deg)' }, { transform: 'rotate(-5deg)' }], { t: rr() * 2, d: 2.2, n: Math.floor(T / 2.2) });
  }
  welt.setAttribute('filter', 'url(#wackel)');

  /* ============ Helfer ============ */
  const aussenInnen = (parent, x, y) => g(g(parent, { transform: `translate(${x},${y})` }));   // aussen Position, innen Animation (sonst überschreibt CSS-transform das Attribut)
  function herz(parent, x, y, t, farbe) {
    const h = aussenInnen(parent, x, y);
    M.svg('path', { d: 'M0 26 C-60 -16 -40 -60 0 -30 C40 -60 60 -16 0 26Z', fill: farbe || '#ef476f', stroke: STRICH, 'stroke-width': 6, 'stroke-linejoin': 'round' }, h);
    M.svg('path', { d: 'M-24 -24 q-8 6 -8 16', stroke: '#fff', 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none', opacity: .8 }, h);
    h.style.transformBox = 'fill-box'; h.style.transformOrigin = '50% 70%';
    M.at(h, [{ opacity: 0, transform: 'scale(0)' }, { opacity: 1, transform: 'scale(1.15)' }, { opacity: 1, transform: 'scale(1)' }], { t: t, d: .6, ease: E.out });
    M.at(h, [{ opacity: 1, transform: 'translateY(0) scale(1)' }, { opacity: 0, transform: 'translateY(-50px) scale(1.1)' }], { t: t + 1.7, d: 1.0, ease: E.out, fill: 'forwards' });
  }
  function funkeln(parent, x, y, t) {   // kleiner vierzackiger Stern
    const o = aussenInnen(parent, x, y);
    M.svg('path', { d: 'M0 -18 Q3 -3 18 0 Q3 3 0 18 Q-3 3 -18 0 Q-3 -3 0 -18Z', fill: '#ffd166', stroke: STRICH, 'stroke-width': 4, 'stroke-linejoin': 'round' }, o);
    o.style.transformBox = 'fill-box'; o.style.transformOrigin = '50% 50%';
    M.at(o, [{ opacity: 0, transform: 'scale(0) rotate(0deg)' }, { opacity: 1, transform: 'scale(1) rotate(90deg)' }, { opacity: 0, transform: 'scale(.2) rotate(180deg)' }], { t: t, d: 1.2, ease: E.out });
  }
  // Szene: Wisch-Übergang (von rechts herein, nach links hinaus), leichte Kamerafahrt, Wackel-Filter
  function szene(i) {
    const t0 = SZ[i].t0, t1 = i === SZ.length - 1 ? SZ[i].t1 - .15 : SZ[i].t1, d = t1 - t0, f = Math.min(.6, d / 4) / d;
    const aussen = g(s), cam = g(aussen);
    aussen.setAttribute('filter', 'url(#wackel)');
    M.at(aussen, [{ opacity: 0, transform: 'translateX(90px)', offset: 0 }, { opacity: 1, transform: 'translateX(0)', offset: f }, { opacity: 1, transform: 'translateX(0)', offset: 1 - f }, { opacity: 0, transform: 'translateX(-90px)', offset: 1 }], { t: t0, d: d, ease: E.out });
    cam.style.transformOrigin = '540px ' + GY + 'px';
    M.at(cam, [{ transform: 'scale(1)' }, { transform: 'scale(1.045)' }], { t: t0, d: d, ease: E.linear });
    return cam;
  }
  const L = (i, k) => SZ[i].zeilen[k];
  function tisch(parent, x, breite, hoehe) {   // Tisch mit Tischdecke
    const t = g(parent), oben = GY - hoehe;
    M.svg('ellipse', { cx: x + breite / 2, cy: GY + 4, rx: breite / 2 + 10, ry: 13, fill: 'rgba(34,48,60,.16)' }, t);
    M.svg('line', { x1: x + 34, y1: oben, x2: x + 34, y2: GY, stroke: STRICH, 'stroke-width': 12, 'stroke-linecap': 'round' }, t);
    M.svg('line', { x1: x + breite - 34, y1: oben, x2: x + breite - 34, y2: GY, stroke: STRICH, 'stroke-width': 12, 'stroke-linecap': 'round' }, t);
    M.svg('rect', { x: x, y: oben - 10, width: breite, height: 28, rx: 10, fill: '#e9c27a', stroke: STRICH, 'stroke-width': 6 }, t);
    M.svg('path', { d: `M${x + 18} ${oben + 18} v22 l14 -10 l14 10 l14 -10 l14 10 l14 -10 v-12`, fill: '#fff', stroke: STRICH, 'stroke-width': 5, 'stroke-linejoin': 'round' }, t);
    return oben - 10;
  }

  /* ============ Szene 1: Pia wünscht sich eine friedliche Welt ============ */
  (function () {
    const sc = szene(0);
    const pia = Stickman(sc, { x: -150, y: GY, s: 1.7, schleife: BOGEN });
    pia.gehen(.5, 3.0, { dx: 690 / 1.7, per: .75 });
    pia.pose(3.6, 'jubeln', .6).mund(3.6, 'lachen');
    pia.huepfen(4.3, 1.0);
    herz(sc, 540, GY - 580, 4.4, '#ef476f');
    funkeln(sc, 400, GY - 520, 4.6); funkeln(sc, 690, GY - 560, 4.9); funkeln(sc, 470, GY - 640, 5.1);
  })();

  /* ============ Szene 2: Frage beim Frühstück, Fakt 1 ============ */
  (function () {
    const sc = szene(1), a = L(1, 0), b = L(1, 1);
    const pia = Stickman(sc, { x: 215, y: GY, s: 1.55, schleife: BOGEN });
    pia.pose(SZ[1].t0 + .3, 'denken', .6);
    pia.mund(b.start + 1.8, 'sorge');
    const oben = tisch(sc, 600, 430, 96);
    M.svg('ellipse', { cx: 810, cy: oben - 4, rx: 104, ry: 17, fill: '#fff', stroke: STRICH, 'stroke-width': 6 }, sc);
    M.svg('circle', { cx: 770, cy: oben - 34, r: 30, fill: '#ef476f', stroke: STRICH, 'stroke-width': 6 }, sc);
    M.svg('path', { d: `M770 ${oben - 64} q4 -14 18 -16`, stroke: '#4fb069', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }, sc);
    M.svg('ellipse', { cx: 836, cy: oben - 20, rx: 36, ry: 18, fill: '#f6c667', stroke: STRICH, 'stroke-width': 6 }, sc);
    // Denkblase mit Fragezeichen
    const bk = aussenInnen(sc, 410, 1040);
    M.svg('circle', { cx: -78, cy: 142, r: 10, fill: '#fff', stroke: STRICH, 'stroke-width': 5 }, bk);
    M.svg('circle', { cx: -46, cy: 100, r: 16, fill: '#fff', stroke: STRICH, 'stroke-width': 5 }, bk);
    M.svg('ellipse', { cx: 20, cy: 24, rx: 104, ry: 74, fill: '#fff', stroke: STRICH, 'stroke-width': 6 }, bk);
    const fz = M.svg('text', { x: 20, y: 62, 'text-anchor': 'middle', 'font-size': 120, 'font-weight': 900, fill: STRICH, 'font-family': 'Inter, DejaVu Sans, sans-serif' }, bk); fz.textContent = '?';
    bk.style.transformBox = 'fill-box'; bk.style.transformOrigin = '30% 95%';
    M.at(bk, [{ opacity: 0, transform: 'scale(0)' }, { opacity: 1, transform: 'scale(1.1)' }, { opacity: 1, transform: 'scale(1)' }], { t: a.start + .9, d: .7, ease: E.out });
    M.at(bk, [{ opacity: 1 }, { opacity: 0 }], { t: b.start - .1, d: .4, ease: E.linear, fill: 'forwards' });
    // Infografik (HTML)
    const ui = document.getElementById('ui2');
    M.fenster(ui, b.start - .1, SZ[1].t1, .5);
    M.at(ui, [{ transform: 'translateY(26px) scale(.97)' }, { transform: 'translateY(0) scale(1)' }], { t: b.start - .1, d: .6, ease: E.back });
    M.at('#b1', [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { t: b.start + .6, d: 1.5, ease: E.inOut });
    M.at('#w1', [{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'scale(1)' }], { t: b.start + 1.9, d: .5, ease: E.back });
    M.at('#b2', [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { t: b.start + 2.7, d: 1.0, ease: E.inOut });
    M.at('#w2', [{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'scale(1)' }], { t: b.start + 3.5, d: .5, ease: E.back });
    M.at('#q2', [{ opacity: 0 }, { opacity: 1 }], { t: b.start + 3.9, d: .5, ease: E.out });
  })();

  /* ============ Szene 3: Fakt 2, Zähler ============ */
  (function () {
    const sc = szene(2), z = L(2, 0);
    const pia = Stickman(sc, { x: 215, y: GY, s: 1.55, schleife: BOGEN });
    pia.pose(SZ[2].t0 + .2, 'denken', .5).mund(SZ[2].t0 + .2, 'sorge');
    const ui = document.getElementById('ui3');
    M.fenster(ui, z.start - .1, SZ[2].t1, .5);
    M.at(ui, [{ transform: 'translateY(26px) scale(.97)' }, { transform: 'translateY(0) scale(1)' }], { t: z.start - .1, d: .6, ease: E.back });
    const lauf = Math.max(2.5, z.dauer - 1.2);
    M.at('#zaehler', [{ '--v': 0 }, { '--v': 83 }], { t: z.start + .6, d: lauf, ease: E.inOut });
    const dots = document.getElementById('dots'), pts = [];
    for (let i = 0; i < 83; i++) {
      const d = document.createElement('div');
      d.style.cssText = `position:absolute;width:22px;height:22px;border-radius:11px;background:#8a98a3;border:3px solid #22303c;box-sizing:border-box;opacity:0;left:${(i % 17) * 33}px;top:${Math.floor(i / 17) * 35}px`;
      dots.appendChild(d); pts.push(d);
    }
    M.stagger(pts, [{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1)' }], { t: z.start + .6, d: .25, gap: lauf / 83, ease: E.out });
    M.at('#q3', [{ opacity: 0 }, { opacity: 1 }], { t: z.start + z.dauer - .6, d: .5, ease: E.out });
  })();

  /* ============ Szene 4: Pia kocht pflanzlich ============ */
  (function () {
    const sc = szene(3), z = L(3, 0), t0 = SZ[3].t0;
    const oben = tisch(sc, 640, 410, 100);
    M.svg('path', { d: `M706 ${oben} v-104 q0 -12 12 -12 h168 q12 0 12 12 v104Z`, fill: '#cfd8dc', stroke: STRICH, 'stroke-width': 7, 'stroke-linejoin': 'round' }, sc);
    M.svg('path', { d: `M690 ${oben - 116} h220`, stroke: STRICH, 'stroke-width': 8, 'stroke-linecap': 'round' }, sc);
    M.svg('path', { d: `M714 ${oben - 78} h170`, stroke: '#fff', 'stroke-width': 7, 'stroke-linecap': 'round', opacity: .7 }, sc);
    // Gemüse poppt gestaffelt auf den Tisch
    const brokkoli = aussenInnen(sc, 672, oben - 14);
    M.svg('rect', { x: -7, y: -4, width: 14, height: 26, rx: 4, fill: '#a7d948', stroke: STRICH, 'stroke-width': 5 }, brokkoli);
    [[-17, -22], [0, -32], [17, -22]].forEach(([cx, cy]) => M.svg('circle', { cx: cx, cy: cy, r: 18, fill: '#4fb069', stroke: STRICH, 'stroke-width': 5 }, brokkoli));
    const tomate = aussenInnen(sc, 944, oben - 28);
    M.svg('circle', { r: 28, fill: '#ef476f', stroke: STRICH, 'stroke-width': 6 }, tomate);
    M.svg('path', { d: 'M-10 -26 l10 8 l10 -8', stroke: '#4fb069', 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round' }, tomate);
    M.svg('path', { d: 'M-14 -10 q-4 6 -2 12', stroke: '#fff', 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none', opacity: .7 }, tomate);
    const karotte = aussenInnen(sc, 1000, oben - 10);
    M.svg('path', { d: 'M-34 -4 L26 -18 L30 0Z', fill: '#f78c1f', stroke: STRICH, 'stroke-width': 5, 'stroke-linejoin': 'round' }, karotte);
    M.svg('path', { d: 'M-34 -4 l-16 -8 M-34 -4 l-16 6 M-34 -4 l-12 -16', stroke: '#4fb069', 'stroke-width': 6, 'stroke-linecap': 'round' }, karotte);
    [brokkoli, tomate, karotte].forEach((e, i) => { e.style.transformBox = 'fill-box'; e.style.transformOrigin = '50% 100%';
      M.at(e, [{ opacity: 0, transform: 'scale(0)' }, { opacity: 1, transform: 'scale(1.18)' }, { opacity: 1, transform: 'scale(1)' }], { t: z.start + .3 + i * .5, d: .6, ease: E.out }); });
    // Dampf
    for (let i = 0; i < 3; i++) {
      const d = M.svg('path', { d: `M${760 + i * 42} ${oben - 130} q-16 -28 0 -56 q16 -28 0 -56`, stroke: '#aab9c2', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }, sc);
      M.at(d, [{ opacity: 0, transform: 'translateY(0)' }, { opacity: .9, transform: 'translateY(-14px)' }, { opacity: 0, transform: 'translateY(-44px)' }], { t: z.start + 1 + i * .5, d: 1.7, n: 4, ease: E.linear, fill: 'forwards' });
    }
    // Pia kocht und lächelt
    const pia = Stickman(sc, { x: 430, y: GY, s: 1.75, schleife: BOGEN });
    pia.mund(t0 + .1, 'lachen');
    pia.pose(t0 + .1, 'kochen', .6);
    pia.ruehren(t0 + .8, z.dauer - .4);
    // Keimlinge wachsen am Boden
