<!doctype html>
<meta charset="utf-8">
<title>Pia, Folge 2: Pia deckt den Tisch für alle (3D)</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden;width:1080px;height:1920px;position:relative}
  canvas{position:absolute;left:0;top:0;display:block}
  .schild{position:absolute;left:90px;width:900px;box-sizing:border-box;padding:18px 26px;text-align:center;font:900 54px/1.12 system-ui,'Segoe UI',Arial,sans-serif;color:#1d1d22;background:#ffd23f;border:6px solid #1d1d22;border-radius:26px;box-shadow:0 10px 0 rgba(29,29,34,.35);opacity:0;transform-origin:50% 100%}
  #schild{top:300px}
  #quelle{top:300px;font-size:30px;font-weight:800;background:#fff;padding:8px 18px;border-width:4px;border-radius:16px;width:640px;left:220px;box-shadow:0 6px 0 rgba(29,29,34,.25)}
</style>
<script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","three/addons/":"../../node_modules/three/examples/jsm/"}}</script>
<script src="../../../motion/motion.js"></script>
<script src="zeiten.js"></script>
<div id="schild" class="schild"></div>
<div id="quelle" class="schild">Quelle: Our World in Data</div>
<script type="module">
import * as THREE from 'three';
import { erzeugeWelt, hoehe } from '../../lib/welt3d.js';
import { erzeugePia, spieler } from '../../lib/pia3d.js';
import { kamera } from '../../lib/kamera3d.js';
import { nachbearbeitung } from '../../lib/post.js';

const W = 1080, H = 1920, FPS = 30, Z = window.__ZEITEN, G = Z.gesamt;
const S = Object.fromEntries(Z.szenen.map((s) => [s.id, s]));
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(36, W / H, 0.1, 700);
const welt = erzeugeWelt(scene, { dauer: 40, schattenGroesse: 2048 });
const post = nachbearbeitung(renderer, scene, cam, W, H, { samples: Number(new URLSearchParams(location.search).get('aa') ?? 4) });

// ---- Weltzeit: Szenengrenzen → Tageszeit (Morgen, Tag, Nachmittag, Abend, Nacht) ----
const kn = [[0, 0], [S.S1.t1, 7], [S.S2.t1, 15], [S.S3.t1, 22.5], [S.S4.t1, 34], [G, 40]];
const weltZeit = (t) => { let i = 0; while (i < kn.length - 2 && t >= kn[i + 1][0]) i++; const [a, x] = kn[i], [b, y] = kn[i + 1]; return x + (y - x) * Math.min(1, Math.max(0, (t - a) / (b - a))); };
const gegen = (x0, z0, x1, z1) => Math.atan2(x1 - x0, z1 - z0);   // Blickrichtung (ry) von Punkt 0 zu Punkt 1

// ---- Figuren ----
const mk = (opt) => { const f = erzeugePia(opt); scene.add(f.wurzel); return f; };
const pia = mk({ skala: 0.7 }), mia = mk({ kleid: 0x4f7fb8, flicken: 0xf2d9a0, haar: 0x7a3b1c, schleife: null, skala: 0.73 }), ben = mk({ kleid: 0x5f9b6a, flicken: 0xe9c46a, haar: 0xd9a441, schleife: null, skala: 0.67 });
const gl = (v) => { v = Math.min(1, Math.max(0, v)); return v * v * (3 - 2 * v); };
// Sitzende sinken mit der Hüfte (Figuren sind klein skaliert): auf der Bank wieder anheben
const y = (x, z) => hoehe(x, z) + 0.04 * gl((z + 5.7) / 1.0) * gl((x - 14) / 1.5);
const t1 = S.S1.t1, t2 = S.S2.t1, t3 = S.S3.t1, t4 = S.S4.t1;
const FEUER = [14, -8], TISCH = [16.5, -3];
const faceFeuer = (x, z) => gegen(x, z, FEUER[0], FEUER[1]);

const spPia = spieler(pia, [
  { t0: 0, t1: t1 - 1.44, clip: 'ernten' }, { t0: t1 - 1.44, t1: S.S2.t1 - 1.6, clip: 'tragen', requisit: 'korb' },
  { t0: S.S2.t1 - 1.6, t1: S.S3.t0 + 0.3, clip: 'winkenKlein', requisit: 'korb' }, { t0: S.S3.t0 + 0.3, t1: t3 - 0.3, clip: 'ruehren', requisit: 'loeffel' },
  { t0: t3 - 0.3, t1: t3 + 0.9, clip: 'gehen' }, { t0: t3 + 0.9, t1: t4 - 3.2, clip: 'sitzen' }, { t0: t4 - 3.2, t1: 99, clip: 'anstossen', requisit: 'becher' }
].map((s) => s), [
  { t: 0, x: 3.2, z: -3.1, ry: 0 }, { t: t1 - 1.34, x: 3.2, z: -3.1, ry: 0 }, { t: t1 - 0.14, x: 3.6, z: -2.6, ry: Math.PI / 2 }, { t: S.S2.t1 - 1.78, x: 8.0, z: -2.7, ry: Math.PI / 2, lin: true },
  { t: S.S2.t1 - 1.38, x: 8.0, z: -2.7, ry: Math.PI / 2 }, { t: S.S3.t0, x: 8.0, z: -2.7, ry: Math.PI / 2 }, { t: S.S3.t0 + 0.01, x: 15.3, z: -9.7, ry: faceFeuer(15.3, -9.7) },
  { t: t3 - 0.3, x: 15.3, z: -9.7, ry: faceFeuer(15.3, -9.7) }, { t: t3 + 0.9, x: 16.5, z: -4.65, ry: 0 }, { t: 99, x: 16.5, z: -4.65, ry: 0 }
], { y });
const spMia = spieler(mia, [
  { t0: 0, t1: S.S2.t1 - 1.6, clip: 'idle' }, { t0: S.S2.t1 - 1.6, t1: S.S3.t0, clip: 'winken' }, { t0: S.S3.t0, t1: t3 - 1, clip: 'idle' },
  { t0: t3 - 1, t1: t3 + 0.2, clip: 'jubeln' }, { t0: t3 + 0.2, t1: t4 - 3.2, clip: 'sitzen' }, { t0: t4 - 3.2, t1: 99, clip: 'anstossen', requisit: 'becher' }
], [
  { t: 0, x: 10.0, z: -3.2, ry: -Math.PI / 2 }, { t: S.S3.t0, x: 10.0, z: -3.2, ry: -Math.PI / 2 }, { t: S.S3.t0 + 0.01, x: 15.9, z: -7.4, ry: faceFeuer(15.9, -7.4) },
  { t: t3 + 0.2, x: 15.9, z: -7.4, ry: faceFeuer(15.9, -7.4) }, { t: t3 + 1.0, x: 15.0, z: -4.65, ry: 0 }, { t: 99, x: 15.0, z: -4.65, ry: 0 }
], { y });
const spBen = spieler(ben, [
  { t0: 0, t1: S.S2.t1 - 1.2, clip: 'idle' }, { t0: S.S2.t1 - 1.2, t1: S.S3.t0, clip: 'winken' }, { t0: S.S3.t0, t1: t3 - 1, clip: 'denken' },
  { t0: t3 - 1, t1: t3 + 0.2, clip: 'staunen' }, { t0: t3 + 0.2, t1: t4 - 3.2, clip: 'sitzen' }, { t0: t4 - 3.2, t1: 99, clip: 'anstossen', requisit: 'becher' }
], [
  { t: 0, x: 10.8, z: -4.4, ry: -Math.PI / 2 }, { t: S.S3.t0, x: 10.8, z: -4.4, ry: -Math.PI / 2 }, { t: S.S3.t0 + 0.01, x: 13.0, z: -9.5, ry: faceFeuer(13.0, -9.5) },
  { t: t3 + 0.2, x: 13.0, z: -9.5, ry: faceFeuer(13.0, -9.5) }, { t: t3 + 1.0, x: 18.0, z: -4.65, ry: 0 }, { t: 99, x: 18.0, z: -4.65, ry: 0 }
], { y });

// ---- Kamera ----
const cm = kamera([
  { t0: 0, t1: S.S1.t1, ease: 'sanft', shake: 0.006, keys: [{ u: 0, p: [-9, 15, 17], z: [4, 0.5, -2], fov: 44 }, { u: 1, p: [5.4, 1.6, 3.4], z: [3.3, 1.3, -3.1], fov: 36 }] },
  { t0: S.S2.t0, t1: S.S2.t1, ease: 'glatt', keys: [{ u: 0, p: [1.5, 2.3, 6.8], z: [4.8, 1.2, -2.7], fov: 36 }, { u: 1, p: [9.8, 1.7, 5.2], z: [9.6, 1.3, -3.3], fov: 38 }] },
  { t0: S.S3.t0, t1: S.S3.t1, ease: 'glatt', keys: [{ u: 0, p: [8.2, 1.9, -3.6], z: [14.2, 1.0, -8.4], fov: 40 }, { u: 1, p: [11.4, 1.5, -6.0], z: [14.9, 1.1, -9.2], fov: 32 }] },
  { t0: S.S4.t0, t1: S.S4.t1, ease: 'glatt', keys: [{ u: 0, p: [11.4, 1.5, 2.6], z: [13.6, 1.0, -3.4], fov: 38 }, { u: 0.65, p: [18.6, 1.35, 1.8], z: [16.4, 1.1, -4.3], fov: 36 }, { u: 1, p: [16.6, 1.3, 0.4], z: [16.5, 1.15, -4.65], fov: 30 }] },
  { t0: S.S5.t0, t1: G + 0.01, ease: 'sanft', shake: 0.004, keys: [{ u: 0, p: [16.6, 1.3, 0.4], z: [16.5, 1.15, -4.65], fov: 30 }, { u: 1, p: [16.5, 34, 46], z: [16.5, 7, -30], fov: 46 }] }
]);

// ---- Schilder (gelb) aus den Zeilen von zeiten.js ----
const schild = document.getElementById('schild'), quelle = document.getElementById('quelle');
const zl = Z.szenen.flatMap((s) => s.zeilen);
const pop = (el, u) => { const a = Math.min(1, u / 0.12), b = Math.min(1, Math.max(0, (1 - u) / 0.1)); const o = Math.min(a, b); const s = 0.85 + 0.15 * (1 - Math.pow(1 - a, 3)) + (u < 0.12 ? 0.05 * Math.sin(u / 0.12 * Math.PI) : 0); el.style.opacity = o; el.style.transform = `scale(${s})`; };

window.__seek3d = async (t) => {
  t = Math.min(t, G);
  const wz = weltZeit(t), c = cm.bei(t);
  spPia.setzeZeit(t); spMia.setzeZeit(t); spBen.setzeZeit(t);
  welt.update(wz, new THREE.Vector3(c.z[0], 0, c.z[2]));
  cam.fov = c.fov; cam.position.set(...c.p); cam.up.set(Math.sin(c.roll), Math.cos(c.roll), 0); cam.lookAt(...c.z); cam.updateProjectionMatrix();
  // Schild: erscheint mit der Sprecherzeile
  let aktiv = null; for (const z of zl) if (z.titel && t >= z.start - 0.15 && t <= z.start + z.dauer + 0.5) aktiv = z;
  if (aktiv) { schild.textContent = aktiv.titel; pop(schild, (t - (aktiv.start - 0.15)) / (aktiv.dauer + 0.65)); } else schild.style.opacity = 0;
  const q = S.S4.zeilen[0]; if (t >= q.start + 1.5 && t <= q.start + q.dauer + 0.4) { quelle.style.top = '470px'; pop(quelle, (t - (q.start + 1.5)) / (q.dauer - 1.1)); } else quelle.style.opacity = 0;
  const blende = Math.min(1, t / 0.5) * Math.min(1, (G - t) / 0.5);
  post.setze({ blende: Math.max(0, blende), bild: Math.round(t * FPS), waerme: wz < 7 ? 0.7 : wz < 20 ? 0.35 : 0.6 });
  post.render();
};
Motion.fertig(G);
</script>
