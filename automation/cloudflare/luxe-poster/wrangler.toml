name = "luxe-poster"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 6 Cron-Läufe/Tag: ANALYSE bei allen 6, POSTEN nur in 3 Slots (POST_HOURS=[10,15,19] im Code)
# = 3 Posts/Tag (Meta, weniger Spam) + 6× Meta-Analyse/Tag. UTC->CH(+2): 10=12(Lunch) 15=17 19=21(Primetime).
# Posten geht an IG + FB + TikTok-Entwurf (falls TT-Secrets gesetzt).
[triggers]
crons = ["0 8,12,17 * * *"]

# KV für Cursor + entdeckte IDs (LUXE_KV). ID fest eingetragen → git pull/deploy ohne Handarbeit.
[[kv_namespaces]]
binding = "LUXE_KV"
id = "662199893128478e8db247831dd86ee9"
