name = "luxe-poster"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 2×/Tag posten in CH-Primetime (Feierabend-Scrolling 18–21 Uhr CH = 16–19 UTC).
# Lehre 2026-06-13 (TikTok-Analyse): 16–19 UTC war komplett ungenutzt = beste CH-Zeit verschenkt.
# 16:00 UTC = 18:00 CH · 19:00 UTC = 21:00 CH. Anpassbar.
[triggers]
crons = ["0 16,19 * * *"]

# KV für Cursor + entdeckte IDs. ID nach `wrangler kv namespace create LUXE_KV` hier eintragen.
[[kv_namespaces]]
binding = "LUXE_KV"
id = "REPLACE_WITH_KV_ID"
