name = "luxe-poster"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 2×/Tag posten (UTC): 09:00 & 17:00. Anpassbar.
[triggers]
crons = ["0 9,17 * * *"]

# KV für Cursor + entdeckte IDs. ID nach `wrangler kv namespace create LUXE_KV` hier eintragen.
[[kv_namespaces]]
binding = "LUXE_KV"
id = "REPLACE_WITH_KV_ID"
