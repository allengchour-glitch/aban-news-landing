# LuxeStyle VPS - n8n (Always-on Hirn). Hetzner/Ubuntu, Docker Compose.
# Start:  docker compose up -d    |    Update:  docker compose pull && docker compose up -d
# n8n laeuft NUR auf localhost (127.0.0.1) -> Zugriff per SSH-Tunnel oder Cloudflare-Tunnel (kein offener Port).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped          # heilt sich nach Crash/Reboot selbst -> nie wieder manueller Neustart
    ports:
      - "127.0.0.1:5678:5678"        # nur lokal gebunden = nicht offen im Netz
    environment:
      - GENERIC_TIMEZONE=Europe/Zurich
      - TZ=Europe/Zurich
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false      # ok hinter SSH-Tunnel; bei eigener Domain auf true + HTTPS
      - N8N_RUNNERS_ENABLED=true
      - N8N_HOST=${N8N_HOST:-localhost}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
    volumes:
      - n8n_data:/home/node/.n8n     # Workflows + Credentials persistent (ueberleben Updates)

volumes:
  n8n_data:
