<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inserate-Moderation (Admin)</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--amber:#d97706;--amber-dk:#b45309;--ink:#1f2937;--ink2:#374151;--muted:#6b7280;--line:#ece3d4;--bg:#fffbf5;--card:#fff;--ok:#059669;--bad:#a01616;--field:#fffdf9}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;color:var(--ink);background:var(--bg);padding:18px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:1.3rem;margin-bottom:10px}
input{font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--field);width:100%;max-width:360px}
.btn{background:var(--amber-dk);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sm{padding:6px 11px;font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px;margin:9px 0}
.card .k{font-size:.7rem;font-weight:700;color:var(--amber-dk);text-transform:uppercase}
.card h3{font-size:1rem;margin:2px 0}.card .meta{font-size:.8rem;color:var(--muted)}
.card .d{font-size:.9rem;color:var(--ink2);margin:6px 0}
.status{color:var(--muted);font-size:.9rem;padding:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Inserate-Moderation</h1>
  <div class="row">
    <input id="tok" type="password" placeholder="Admin-Token (ADMIN_TOKEN)">
    <button class="btn" id="load" type="button">Wartende laden</button>
  </div>
  <div class="status" id="status">Token eingeben und „Wartende laden".</div>
  <div id="list"></div>
</div>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var tokEl=$("#tok"),list=$("#list"),status=$("#status");
  tokEl.value=localStorage.getItem("aban_admin_tok")||"";
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function load(){
    var tok=tokEl.value.trim();if(!tok){status.textContent="Bitte Token eingeben.";return}
    localStorage.setItem("aban_admin_tok",tok);
    status.textContent="Lade …";list.innerHTML="";
    fetch("/api/inserate-list?status=pending",{headers:{"X-Admin-Token":tok}}).then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})}).then(function(o){
      if(o.s===401){status.textContent="Token ungültig.";return}
      if(o.d.demo){status.textContent="Datenbank noch nicht angebunden.";return}
      var items=o.d.items||[];
      if(!items.length){status.textContent="Keine wartenden Inserate. 🎉";return}
      status.textContent=items.length+" wartende Inserate:";
      list.innerHTML=items.map(function(it){
        return '<div class="card" data-id="'+it.id+'"><div class="k">'+esc(it.kat||"")+'</div><h3>'+esc(it.titel)+'</h3><div class="meta">'+esc([it.preis,it.plz,it.ort].filter(Boolean).join(" · "))+' · Kontakt: '+esc(it.kontakt||"")+'</div><div class="d">'+esc(it.beschreibung)+'</div><div class="row"><button class="btn ok sm" data-a="approve">✓ Freigeben</button><button class="btn bad sm" data-a="reject">✗ Ablehnen</button></div></div>';
      }).join("");
      Array.prototype.forEach.call(document.querySelectorAll(".card button"),function(b){b.addEventListener("click",function(){
        var card=this.closest(".card"),id=card.dataset.id,action=this.dataset.a;
        fetch("/api/inserat-moderate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({admin:tokEl.value.trim(),id:id,action:action})}).then(function(r){return r.json()}).then(function(d){if(d.ok){card.remove()}else{alert("Fehler: "+(d.error||"?"))}});
      })});
    }).catch(function(){status.textContent="Fehler beim Laden.";});
  }
  $("#load").addEventListener("click",load);
})();
</script>
</body>
</html>
