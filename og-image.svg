<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="aban news — Täglicher AI-Newsletter für DACH">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbf5"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <g fill="#d97706" opacity="0.08">
    <circle cx="80" cy="80" r="6"/>
    <circle cx="140" cy="40" r="4"/>
    <circle cx="1130" cy="120" r="8"/>
    <circle cx="1080" cy="60" r="5"/>
    <circle cx="60" cy="540" r="7"/>
    <circle cx="1140" cy="580" r="6"/>
  </g>

  <!-- Coffee cup illustration (left side) -->
  <g transform="translate(140 200)">
    <!-- Steam swirls -->
    <path d="M70 30 C 50 0, 90 -20, 70 -60 C 50 -90, 100 -110, 80 -150" stroke="url(#steam)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M130 30 C 150 0, 110 -20, 130 -60 C 150 -90, 100 -110, 120 -150" stroke="url(#steam)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Saucer -->
    <ellipse cx="100" cy="220" rx="135" ry="14" fill="#1f2937" opacity="0.12"/>
    <!-- Cup body -->
    <path d="M0 50 L0 170 Q0 220 60 220 L140 220 Q200 220 200 170 L200 50 Z" fill="url(#amber)"/>
    <!-- Cup rim -->
    <ellipse cx="100" cy="50" rx="100" ry="14" fill="#b45309"/>
    <ellipse cx="100" cy="50" rx="88" ry="9" fill="#1f2937" opacity="0.45"/>
    <!-- Handle -->
    <path d="M200 80 Q260 80 260 130 Q260 180 200 180" stroke="url(#amber)" stroke-width="20" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text block (right side) -->
  <g transform="translate(470 200)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <text x="0" y="0" font-size="92" font-weight="800" fill="#1f2937" letter-spacing="-2">aban news</text>
    <text x="0" y="60" font-size="32" font-weight="600" fill="#b45309">Der erste tägliche deutsche AI-Newsletter</text>
    <text x="0" y="140" font-size="26" font-weight="500" fill="#374151">Mo–Fr morgens · 3-5 Min · kein Hype</text>

    <!-- Three feature pills -->
    <g transform="translate(0 200)">
      <rect x="0" y="0" width="220" height="56" rx="28" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
      <text x="30" y="36" font-size="22" font-weight="600" fill="#1f2937">📰 3–5 KI-News</text>

      <rect x="240" y="0" width="200" height="56" rx="28" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
      <text x="268" y="36" font-size="22" font-weight="600" fill="#1f2937">🛠 Tool</text>

      <rect x="460" y="0" width="200" height="56" rx="28" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
      <text x="488" y="36" font-size="22" font-weight="600" fill="#1f2937">💡 Prompt</text>
    </g>

    <text x="0" y="350" font-size="22" font-weight="500" fill="#6b7280">abannews.com · von Aban aus der Schweiz</text>
  </g>
</svg>
