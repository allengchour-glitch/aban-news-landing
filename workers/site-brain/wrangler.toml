# 🧠 aban Site-Brain — Live-Gesundheits-Wächter (Cloudflare Cron, gratis, ohne GitHub Actions)
# Deploy:  cd workers/site-brain && npx wrangler deploy

name = "aban-site-brain"
main = "worker.js"
compatibility_date = "2026-01-01"

# Cron: alle 6 Stunden (verbraucht praktisch nichts).
[triggers]
crons = ["0 */6 * * *"]

# KV ist OPTIONAL (nur für Verlauf/Score-History). Der Worker läuft auch ohne.
# Wer Verlauf will: eigenen Namespace anlegen
#   npx wrangler kv namespace create BRAIN_KV
# und hier einkommentieren (NICHT LUXE_KV/INS_KV nehmen — eigener Namespace!):
# [[kv_namespaces]]
# binding = "BRAIN_KV"
# id = "<eigene-id>"

# Secrets per CLI setzen (NICHT hier eintragen):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN  # Alarm bei Problemen
#   npx wrangler secret put TELEGRAM_CHAT_ID
#   npx wrangler secret put TRIGGER_KEY         # optional: schützt den manuellen ?run=1
