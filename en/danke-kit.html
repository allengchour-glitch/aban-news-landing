<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Thank you — your AI Starter Kit | aban news</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1f2937;background:#fffbf5;line-height:1.6;max-width:640px;margin:0 auto;padding:2rem 1.25rem;text-align:center}
    .btn{display:inline-block;background:#b45309;color:#fff;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:12px;font-size:1.05rem;margin:1rem 0}
    .muted{color:#6b7280;font-size:.9rem}
    .box{background:#fff;border:1px solid #ece3d4;border-radius:16px;padding:1.6rem;margin:1.4rem 0}
  </style>
</head>
<body>
  <p style="color:#9a3412;font-weight:700">☕ aban news</p>
  <h1>Thanks for your purchase!</h1>
  <div class="box" id="box"><p>Verifying payment …</p></div>
  <p class="muted">Trouble with the download? Email me: <a href="mailto:hallo@abannews.com" style="color:#b45309">hallo@abannews.com</a></p>
  <p class="muted"><a href="/en/" style="color:#6b7280">← home</a> · <a href="/en/shop.html" style="color:#6b7280">more kits</a></p>
<script>
  (function(){
    var box=document.getElementById('box');
    var sid=new URLSearchParams(location.search).get('session_id');
    if(!sid){box.innerHTML='<p>No valid purchase link. Please buy via the shop.</p>';return;}
    fetch('/api/kit-download?session_id='+encodeURIComponent(sid))
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok&&d.url){
          box.innerHTML='<p>Your kit is ready:</p><a class="btn" href="'+d.url+'">📦 Download kit</a>'+
                        '<p class="muted">This link is for you — please don\'t share it publicly.</p>';
        } else {
          box.innerHTML='<p>'+((d&&d.error)||'Could not unlock the download.')+'</p>'+
                        '<p class="muted">If you just paid: wait a moment and reload the page.</p>';
        }
      })
      .catch(function(){box.innerHTML='<p>Network error. Reload the page or email me.</p>';});
  })();
</script>
</body>
</html>
