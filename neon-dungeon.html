<script>
(function(){
"use strict";
var STATION=window.parent!==window&&/[?&]station=1/.test(location.search);

var W=innerWidth,H=innerHeight;
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(W,H);
renderer.outputEncoding=THREE.sRGBEncoding;document.body.insertBefore(renderer.domElement,document.getElementById("hud"));
var scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0812);scene.fog=new THREE.Fog(0x0a0812,26,84);

addEventListener("resize",function(){W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);});
scene.add(new THREE.HemisphereLight(0x5a4a8e,0x140c20,0.42));
var amb=new THREE.AmbientLight(0x2a2244,0.3);scene.add(amb);
/* 💜 Abgrund-Glühen: riesige leuchtende Kristalle in der Tiefe (sichtbar beim Springen) */
(function(){var cvA=document.createElement("canvas");cvA.width=cvA.height=256;var cA=cvA.getContext("2d");
  var gr=cA.createRadialGradient(128,128,10,128,128,128);gr.addColorStop(0,"rgba(160,90,255,.55)");gr.addColorStop(1,"rgba(160,90,255,0)");
  cA.fillStyle=gr;cA.fillRect(0,0,256,256);
  var glowTex=new THREE.CanvasTexture(cvA);
  for(var ai=0;ai<9;ai++){var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,opacity:0.5,depthWrite:false}));
    sp.scale.set(14+Math.random()*10,14+Math.random()*10,1);
    sp.position.set((Math.random()-0.5)*30,-14-Math.random()*6,-Math.random()*110);scene.add(sp);}
  for(var ki=0;ki<14;ki++){var kr=new THREE.Mesh(new THREE.ConeGeometry(0.8+Math.random()*1.4,3+Math.random()*4,5),M(0x6a4a9e,0x8050e0,0.7));
    var kxs=(8+Math.random()*10)*(Math.random()<0.5?-1:1);kr.position.set(kxs,-14-Math.random()*5,-Math.random()*110);kr.rotation.z=Math.PI;scene.add(kr);}
  /* ✨ Staub-Motes */
  window.__motes=[];for(var mi=0;mi<26;mi++){var mo=new THREE.Mesh(new THREE.SphereGeometry(0.045,5,4),M(0xcab0ff,0x9a80ff,0.8));
    scene.add(mo);window.__motes.push({m:mo,ph:Math.random()*6,sp:0.3+Math.random()*0.5,x:(Math.random()-0.5)*10,y:1+Math.random()*4,z:-Math.random()*100});}})();

function M(c,e,i){return new THREE.MeshLambertMaterial({color:c,emissive:e||0x000000,emissiveIntensity:i||0});}
var STONE=M(0x38324e),STONE2=M(0x1c1830),EDGE=M(0x6a58b0,0x4a3a90,0.55),MOSS=M(0x35503e,0x122416,0.22);

/* ---------- Level: Plattform-Parcours (3 Abschnitte) + Boss-Kammer ---------- */
var plats=[],gems=[],torches=[],checkpoints=[{x:0,y:0,z:0}];
function plat(x,y,z,w,d,mat){var g=new THREE.Group();
  var top=new THREE.Mesh(new THREE.BoxGeometry(w,0.6,d),mat||STONE);top.position.y=-0.3;g.add(top);
  var rim=new THREE.Mesh(new THREE.BoxGeometry(w+0.16,0.14,d+0.16),EDGE);rim.position.y=-0.14;g.add(rim); /* Kante UNTER der Lauffläche -> glüht nur seitlich */
  if(!mat&&Math.random()<0.5){var ms=new THREE.Mesh(new THREE.BoxGeometry(w*0.55,0.06,d*0.55),MOSS);ms.position.set((Math.random()-0.5)*w*0.3,0.04,(Math.random()-0.5)*d*0.3);g.add(ms);} /* 🌿 Moos-Flecken */
  var uc=new THREE.Mesh(new THREE.BoxGeometry(w*0.7,0.9,d*0.7),STONE2);uc.position.y=-1.0;g.add(uc); /* Fels-Unterbau statt schwebender Scheibe */
  g.position.set(x,y,z);scene.add(g);
  var P={x:x,y:y,z:z,w:w/2,d:d/2,g:g,x0:x,y0:y,mv:null};plats.push(P);return P;}
function gem(x,y,z){var m=new THREE.Mesh(new THREE.OctahedronGeometry(0.34,0),M(0xc98bff,0xa060ff,0.9));
  m.position.set(x,y+0.9,z);scene.add(m);gems.push({m:m,x:x,y:y+0.9,z:z,got:false,ph:Math.random()*6});}
function torch(x,y,z){var g=new THREE.Group();
  var st=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,1.1,6),M(0x4a3a2a));st.position.y=0.55;g.add(st);
  var fl=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.42,6),M(0xffa040,0xff8020,1));fl.position.y=1.25;g.add(fl);
  var lt=new THREE.PointLight(0xff9a50,0.55,8);lt.position.y=1.4;g.add(lt);
  if(!window.__glowT){var cvG=document.createElement("canvas");cvG.width=cvG.height=128;var cG=cvG.getContext("2d");
    var g2=cG.createRadialGradient(64,64,4,64,64,64);g2.addColorStop(0,"rgba(255,180,90,.85)");g2.addColorStop(1,"rgba(255,140,60,0)");
    cG.fillStyle=g2;cG.fillRect(0,0,128,128);window.__glowT=new THREE.CanvasTexture(cvG);}
  var gl=new THREE.Sprite(new THREE.SpriteMaterial({map:window.__glowT,transparent:true,opacity:0.8,depthWrite:false}));
  gl.scale.set(2.1,2.1,1);gl.position.y=1.3;g.add(gl);gl.material.opacity=0.6; /* 🔥 weiches Feuer-Glühen */
  g.position.set(x,y,z);scene.add(g);torches.push({fl:fl,lt:lt,ph:Math.random()*6});}

/* Abschnitt 1: gerader Einstieg */
plat(0,0,0,6,6);torch(-2.4,0,-2.4);torch(2.4,0,-2.4);
plat(0,0.3,-7,3,3);gem(0,0.3,-7);
plat(2.5,0.9,-13,2.6,2.6);
plat(-1.5,1.5,-19,2.6,2.6);gem(-1.5,1.5,-19);
plat(1,2.2,-25,3,3);torch(1,2.2,-26);
/* Abschnitt 2: Zickzack + weite Sprünge (Doppelsprung nötig) */
plat(-3,2.8,-32,2.4,2.4);gem(-3,2.8,-32);
plat(3,3.4,-38,2.4,2.4).mv={ax:2.2,ay:0,sp:0.7,ph:0}; /* ↔ gleitet seitlich */
plat(-2,4.0,-45,2.2,2.2);gem(-2,4.0,-45);
var _p52=plat(3.5,4.4,-52,2.2,2.2);_p52.mv={ax:0,ay:1.1,sp:0.9,ph:2};gem(3.5,4.4,-52); /* ↕ hebt und senkt sich */
plat(0,5,-59,3.4,3.4);torch(-1.2,5,-60);torch(1.2,5,-60);
/* Abschnitt 3: schmale Stege hinab zur Kammer */
plat(0,4.2,-66,1.6,4);
plat(-2.5,3.2,-73,1.6,3).mv={ax:1.8,ay:0,sp:1.1,ph:1};gem(-2.5,3.2,-73);
plat(2.5,2.2,-80,1.6,3);gem(2.5,2.2,-80);
plat(0,1,-88,4,4);torch(-1.5,1,-89);torch(1.5,1,-89);
checkpoints.push({x:1,y:2.2,z:-25},{x:0,y:5,z:-59},{x:0,y:1,z:-88});
/* Boss-Kammer */
var CHZ=-104;
plat(0,0,CHZ,26,26,STONE2);
for(var ti=0;ti<8;ti++){var ta=ti/8*Math.PI*2;torch(Math.cos(ta)*11,0,CHZ+Math.sin(ta)*11);}
(function(){var wallM=M(0x161226);
  for(var wi=0;wi<14;wi++){var wa=wi/14*Math.PI*2;
    var p=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.9,9,6),wallM);
    p.position.set(Math.cos(wa)*13,4.5,CHZ+Math.sin(wa)*13);scene.add(p);}})();

/* ---------- Spieler ---------- */
var player=new THREE.Group();scene.add(player);
(function(){var body=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.36,1.1,10),M(0x6ac8f0,0x2a6a99,0.55));
  body.position.y=0.75;player.add(body);
  var cape=new THREE.Mesh(new THREE.BoxGeometry(0.56,0.95,0.08),M(0x9a4ae0,0x40208a,0.5));cape.position.set(0,0.85,0.24);player.add(cape); /* 🦸 Umhang */
  var belt=new THREE.Mesh(new THREE.CylinderGeometry(0.37,0.37,0.12,10),M(0xffce8a,0x8a5a20,0.4));belt.position.y=0.62;player.add(belt);
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.26,12,10),M(0xd8dcf0,0x555a80,0.35));head.position.y=1.5;player.add(head);
  var visor=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.09,0.12),M(0x7de3ff,0x40b0ff,1));visor.position.set(0,1.52,-0.2);player.add(visor); /* ⚔️ Helm-Visier */
  var lt=new THREE.PointLight(0x9fd0ff,0.5,7);lt.position.y=1.6;player.add(lt);})();
var px=0,py=0,pz=0,vy=0,onG=true,jumps=0,coyote=0,jBuf=0,ckpt=0,invT=0;
var hearts=4,gemN=0,stage=1,running=false,won=false,dead=false;
var kx=0,kz=0; /* Eingabe */

/* ---------- Koloss ---------- */
var boss=new THREE.Group(),bossHp=6,bossOn=false,bossPh=0;
(function(){var rock=M(0x4a4258,0x1a1428,0.15);
  var torso=new THREE.Mesh(new THREE.BoxGeometry(3.2,3.4,2.2),rock);torso.position.y=4.4;boss.add(torso);
  var head=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.3,1.4),rock);head.position.y=6.9;boss.add(head);
  var eye1=new THREE.Mesh(new THREE.SphereGeometry(0.16,8,6),M(0xff4020,0xff2000,1));eye1.position.set(-0.35,6.95,0.72);boss.add(eye1);
  var eye2=eye1.clone();eye2.position.x=0.35;boss.add(eye2);
  for(var cr2=0;cr2<5;cr2++){var crk=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.7+Math.random()*0.9,0.08),M(0xff6a30,0xff5020,1)); /* 🔥 glühende Risse */
    crk.position.set((Math.random()-0.5)*2.6,3.6+Math.random()*2.6,1.12);crk.rotation.z=(Math.random()-0.5)*0.9;boss.add(crk);}
  var mossB=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.35,1.6),MOSS);mossB.position.y=6.25;boss.add(mossB); /* 🌿 bemooste Schulter */
  var legL=new THREE.Mesh(new THREE.BoxGeometry(1.1,2.8,1.3),rock);legL.position.set(-0.95,1.4,0);boss.add(legL);
  var legR=legL.clone();legR.position.x=0.95;boss.add(legR);
  function arm(sx){var a=new THREE.Group();
    var up=new THREE.Mesh(new THREE.BoxGeometry(0.95,2.6,1.0),rock);up.position.y=-1.3;a.add(up);
    var fist=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5),rock);fist.position.y=-3.1;a.add(fist);
    var cry=new THREE.Mesh(new THREE.IcosahedronGeometry(0.42,0),M(0xc98bff,0x8040ff,1));cry.position.y=-3.1;cry.position.z=0.85;a.add(cry);
    a.position.set(sx,5.6,0);a.userData.fist=fist;a.userData.cry=cry;return a;}
  boss.userData.armL=arm(-2.35);boss.userData.armR=arm(2.35);
  boss.add(boss.userData.armL);boss.add(boss.userData.armR);
  boss.position.set(0,0,CHZ-4);boss.visible=false;scene.add(boss);})();
var rings=[],bState="idle",bT=2.5,slamArm=null,vulnT=0,hitFx=0,warnD=null,_fw=new THREE.Vector3();
var vRing=new THREE.Mesh(new THREE.RingGeometry(3.4,4.0,36),new THREE.MeshBasicMaterial({color:0xc98bff,transparent:true,opacity:0.6,side:THREE.DoubleSide,depthWrite:false}));
vRing.rotation.x=-Math.PI/2;vRing.position.y=0.14;vRing.visible=false;scene.add(vRing); /* 💜 zeigt die Schlag-Zone am Kristall */
var vLight=new THREE.PointLight(0xc98bff,0,10);scene.add(vLight);

/* ---------- Audio ---------- */
var AC=null;function sfx(f,d,t,g,sl){try{if(!running)return;AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  var o=AC.createOscillator(),ga=AC.createGain();o.type=t||"triangle";o.frequency.value=f;d=d||0.1;
  if(sl)o.frequency.exponentialRampToValueAtTime(sl,AC.currentTime+d);
  ga.gain.setValueAtTime(0.0001,AC.currentTime);ga.gain.exponentialRampToValueAtTime(g||0.05,AC.currentTime+0.005);
  ga.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
  o.connect(ga);ga.connect(AC.destination);o.start();o.stop(AC.currentTime+d+0.02);}catch(e){}}

/* ---------- HUD ---------- */
var annT=0;
function announce(t,c){var a=document.getElementById("announce");a.textContent=t;a.style.color=c||"#ffd166";a.style.opacity=1;annT=2.4;}

  document.getElementById("gems").textContent="💎 "+gemN;

  document.getElementById("bossBar").style.display=bossOn?"block":"none";

/* ---------- Eingabe: Joystick + Sprung + Schlag + Tastatur ---------- */
(function(){var st=document.getElementById("stick"),knob=document.getElementById("knob"),id=null,cx0=0,cy0=0;
  st.addEventListener("touchstart",function(e){e.preventDefault();var t=e.changedTouches[0];id=t.identifier;
    var r=st.getBoundingClientRect();cx0=r.left+r.width/2;cy0=r.top+r.height/2;},{passive:false});
  addEventListener("touchmove",function(e){if(id==null)return;
    for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier!==id)continue;
      var dx=t.clientX-cx0,dy=t.clientY-cy0,l=Math.hypot(dx,dy),mx=Math.min(l,46);
      if(l>4){kx=dx/l*(mx/46);kz=dy/l*(mx/46);}else{kx=0;kz=0;}
      knob.style.transform="translate(calc(-50% + "+(kx*34)+"px),calc(-50% + "+(kz*34)+"px))";}},{passive:false});
  function end(e){for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===id){id=null;kx=0;kz=0;
    knob.style.transform="translate(-50%,-50%)";}}}
  addEventListener("touchend",end);addEventListener("touchcancel",end);})();
var jHeld=false;
function doJump(){jBuf=0.12;jHeld=true;}
function endJump(){jHeld=false;if(vy>3.5)vy=3.5;} /* Loslassen kappt den Sprung -> kurze/hohe Sprünge */
function doHit(){if(!bossOn)return;
  if(vulnT>0&&slamArm){var f=slamArm.userData.fist,wp=new THREE.Vector3();f.getWorldPosition(wp);
    if(Math.hypot(wp.x-px,wp.z-pz)<4.0){bossHp--;vulnT=0;hitFx=0.5;
      slamArm.userData.cry.material.emissiveIntensity=0.2;slamArm.userData.cry.scale.setScalar(1);slamArm.userData.slamTgt=0;slamArm=null; /* Arm federt zurück statt einzufrieren */
      sfx(180,0.25,"sawtooth",0.09,60);sfx(880,0.15,"square",0.05,1400);announce("💥 TREFFER!","#c98bff");
      if(bossHp===3){bossPh=1;announce("😡 DER KOLOSS RAST!","#ff5a5a");}
      if(bossHp<=0)winGame();updHud();return;}}
  sfx(220,0.08,"square",0.03);}
document.getElementById("bJump").addEventListener("touchstart",function(e){e.preventDefault();doJump();},{passive:false});
document.getElementById("bJump").addEventListener("touchend",endJump);
document.getElementById("bJump").addEventListener("touchcancel",endJump);
document.getElementById("bJump").addEventListener("mouseup",endJump);
document.getElementById("bJump").addEventListener("click",doJump);
document.getElementById("bHit").addEventListener("touchstart",function(e){e.preventDefault();doHit();},{passive:false});
document.getElementById("bHit").addEventListener("click",doHit);
var keys={};
addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=1;
  if(e.key===" "){e.preventDefault();if(!running){start();return;}doJump();}
  if(e.key.toLowerCase()==="e")doHit();});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=0;if(e.key===" ")endJump();});

/* ---------- Spiel-Logik ---------- */
function groundAt(x,z,maxY){var best=-999;if(maxY==null)maxY=1e9;
  for(var i=0;i<plats.length;i++){var p=plats[i];
    if(p.y<=maxY&&Math.abs(x-p.x)<=p.w&&Math.abs(z-p.z)<=p.d&&p.y>best)best=p.y;}
  return best;}
function respawn(){var c=checkpoints[ckpt];px=c.x;py=c.y+0.2;pz=c.z;vy=0;jumps=0;
  sfx(160,0.3,"sawtooth",0.06,60);announce("💫 Zurück zum Fackel-Halt","#9fd0ff");}
function damage(){if(dead||won)return;hearts--;invT=1.6;updHud();sfx(120,0.2,"sawtooth",0.08,50);
  for(var qi=rings.length-1;qi>=0;qi--){scene.remove(rings[qi].m);rings[qi].m.geometry.dispose();rings[qi].m.material.dispose();}rings.length=0; /* keine Ketten-Treffer nach dem Rücksetzen */
  if(hearts<=0){dead=true;player.visible=true;announce("💀 Der Dungeon hat gewonnen …","#8a8a9a");
    setTimeout(function(){finish(false);},1800);}
  else respawnBoss();}
function respawnBoss(){px=0;pz=CHZ+9;py=0;vy=0;}
function winGame(){if(won)return;won=true;bossOn=false;
  announce("🏆 DER KOLOSS FÄLLT!","#ffd166");
  sfx(392,0.3,"triangle",0.07);setTimeout(function(){sfx(523,0.3,"triangle",0.07);},180);
  setTimeout(function(){sfx(784,0.5,"triangle",0.08);},380);
  boss.userData.falling=true;
  (function(){for(var vi=0;vi<10;vi++)(function(k){setTimeout(function(){ /* 💎 Kristall-Regen */
    var vg=new THREE.Mesh(new THREE.OctahedronGeometry(0.3,0),M(0xc98bff,0xa060ff,1));
    vg.position.set(boss.position.x+(Math.random()-0.5)*6,7+Math.random()*3,boss.position.z+(Math.random()-0.5)*6);
    scene.add(vg);vg.userData.vy=0;
    var iv=setInterval(function(){vg.userData.vy-=0.02;vg.position.y+=vg.userData.vy;vg.rotation.y+=0.15;
      if(vg.position.y<0.3){clearInterval(iv);vg.position.y=0.3;}},16);
    gemN++;updHud();sfx(700+k*60,0.1,"triangle",0.04,1000+k*80);},k*160);})(vi);})();
  setTimeout(function(){finish(true);},2600);}
function finish(win){var score=gemN*4+Math.max(0,hearts)*5+(win?30:0);
  if(STATION)stationPost({t:"stationDone",score:score});
  var ov=document.getElementById("ov");ov.style.display="flex";
  ov.querySelector("h1").textContent=win?"🏆 KOLOSS BESIEGT!":"💀 GESCHEITERT";
  ov.querySelector("p").innerHTML="💎 "+gemN+" Kristalle · ❤️ "+Math.max(0,hearts)+" übrig · <b>Score "+score+"</b>";
  document.getElementById("startBtn").textContent=STATION?"← Zurück zur Wildnis":"Nochmal ▶";
  document.getElementById("startBtn").onclick=function(){if(STATION)stationPost("mini-back");else location.reload();};}

function start(){document.getElementById("ov").style.display="none";running=true;
  hint("🕹️ Laufen · ⤴ zweimal = Doppelsprung",3600);updHud();
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}}
document.getElementById("startBtn").onclick=start;

/* ---------- Frame-Loop ---------- */
var lastT=performance.now();
function frame(now){requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-lastT)/1000)||0.016;lastT=now;
  var t=now*0.001;
  for(var fi=0;fi<torches.length;fi++){var tc=torches[fi];
    tc.fl.scale.setScalar(1+Math.sin(t*9+tc.ph)*0.16);tc.lt.intensity=0.75+Math.sin(t*11+tc.ph)*0.22;}
  if(window.__motes)for(var mo2=0;mo2<window.__motes.length;mo2++){var mt=window.__motes[mo2];
    mt.m.position.set(mt.x+Math.sin(t*mt.sp+mt.ph)*1.6,mt.y+Math.sin(t*mt.sp*0.7+mt.ph)*0.8,mt.z);}
  for(var gi=0;gi<gems.length;gi++){var gm=gems[gi];if(gm.got)continue;
    gm.m.rotation.y+=dt*2.2;gm.m.position.y=gm.y+Math.sin(t*2.4+gm.ph)*0.14;}
  for(var mi2=0;mi2<plats.length;mi2++){var mp=plats[mi2];if(!mp.mv)continue; /* 🛗 bewegliche Plattformen */
    var ox2=mp.x,om=mp.mv;mp.x=mp.x0+Math.sin(t*om.sp+om.ph)*om.ax;mp.y=mp.y0+Math.sin(t*om.sp+om.ph)*om.ay;
    mp.g.position.set(mp.x,mp.y,mp.z);
    if(running&&onG&&Math.abs(px-mp.x)<=mp.w+0.4&&Math.abs(pz-mp.z)<=mp.d+0.4&&Math.abs(py-mp.y)<0.3){px+=mp.x-ox2;py=mp.y;}}
  if(running&&!dead&&!won){
    /* Bewegung (Tastatur überlagert Stick) */
    var ix=kx,iz=kz;
    if(keys.a||keys.arrowleft)ix=-1;if(keys.d||keys.arrowright)ix=1;
    if(keys.w||keys.arrowup)iz=-1;if(keys.s||keys.arrowdown)iz=1;
    var il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;}
    var spd=6.2;px+=ix*spd*dt;pz+=iz*spd*dt;
    if(il>0.05)player.rotation.y=Math.atan2(ix,iz);
    /* Sprung-Physik: Coyote + Buffer + Doppelsprung */
    var g=groundAt(px,pz,py+1.2); /* nur Plattformen unter/kaum über den Füssen (kein Hochzuppen durch hohe Decks) */
    if(onG)coyote=0.18;else coyote-=dt; /* grosszügige Coyote-Zeit */
    if(jBuf>0){jBuf-=dt;
      if(onG||coyote>0){vy=9.2;onG=false;coyote=0;jumps=1;jBuf=0;sfx(340,0.12,"square",0.04,520);}
      else if(jumps<2){var first=(jumps===0);vy=first?9.2:8.8;jumps=first?1:2;jBuf=0;sfx(first?340:430,0.12,"square",0.04,first?520:640);}} /* Kanten-Fall frisst den 1. Sprung nicht */
    var G=vy<-0.5?32:(Math.abs(vy)<2&&!onG?14:22);vy=Math.max(-16,vy-G*dt);py+=vy*dt; /* schneres Fallen, schwebender Apex */
    if(g>-500&&py<=g&&vy<=0&&py>g-1.2){py=g;vy=0;if(!onG){sfx(150,0.06,"sine",0.03);}onG=true;jumps=0;}
    else onG=false;
    if(py<-9){ /* Abgrund: im Parcours GRATIS zurück zum Fackel-Halt (fair!), nur beim Boss kostet es */
      if(bossOn)damage();else respawn();}
    /* Checkpoints + Stage-Anzeige */
    for(var ci=checkpoints.length-1;ci>0;ci--){var cp=checkpoints[ci];
      if(ci>ckpt&&Math.hypot(px-cp.x,pz-cp.z)<2.6&&Math.abs(py-cp.y)<2){ckpt=ci;
        stage=Math.min(3,ci+0);announce("🔥 Fackel-Halt erreicht!","#ffce8a");sfx(520,0.15,"triangle",0.05,780);updHud();}}
    if(pz<-28&&stage<2){stage=2;updHud();}
    if(pz<-62&&stage<3){stage=3;updHud();}
    /* Kristalle */
    for(var g2=0;g2<gems.length;g2++){var gg=gems[g2];if(gg.got)continue;
      if(Math.hypot(px-gg.x,pz-gg.z)<1.1&&Math.abs(py+0.9-gg.m.position.y)<1.6){gg.got=true;gg.m.visible=false;gemN++;
        sfx(760,0.12,"triangle",0.05,1100);updHud();}}
    /* Boss-Kammer betreten */
    if(!bossOn&&!won&&pz<CHZ+12){bossOn=true;boss.visible=true;
      announce("🗿 DER KOLOSS ERWACHT","#ff8a5a");hint("Schockwellen ÜBERSPRINGEN · glühende Faust = ⚔️ zuschlagen!",4200);
      sfx(60,1.2,"sawtooth",0.1,38);updHud();}
    /* Boss-Verhalten */
    if(bossOn&&!won){bT-=dt;
      boss.rotation.y=Math.atan2(px-boss.position.x,pz-boss.position.z);
      if(bState==="idle"&&bT<=0){
        if(vulnT<=0&&(bossPh===0?Math.random()<0.65:Math.random()<0.5)){bState="stomp";bT=0.7;
          warnD=new THREE.Mesh(new THREE.RingGeometry(1.6,2.2,32),new THREE.MeshBasicMaterial({color:0xff8a3a,transparent:true,opacity:0.5,side:THREE.DoubleSide,depthWrite:false}));
          warnD.rotation.x=-Math.PI/2;warnD.position.set(boss.position.x,0.10,boss.position.z);scene.add(warnD); /* 🔶 Stampf-Telegraph */
          sfx(90,0.6,"sawtooth",0.06,50);}
        else{bState="slam";bT=0.9;slamArm=Math.random()<0.5?boss.userData.armL:boss.userData.armR;
          sfx(200,0.8,"sine",0.05,80);}}
      else if(bState==="stomp"&&bT<=0){ /* Stampfer -> Schockwellen-Ring */
        var rg=new THREE.Mesh(new THREE.RingGeometry(0.6,1.15,40),new THREE.MeshBasicMaterial({color:0xff8a3a,transparent:true,opacity:0.85,side:THREE.DoubleSide,depthWrite:false}));
        rg.rotation.x=-Math.PI/2;rg.position.set(boss.position.x,0.12,boss.position.z);scene.add(rg);
        rings.push({m:rg,r:1,hit:false});sfx(55,0.4,"square",0.1,40);
        if(bossPh===1){setTimeout(function(){if(won||dead)return; /* 😡 Phase 2: zweiter Ring hinterher */
          var rg2=new THREE.Mesh(new THREE.RingGeometry(0.6,1.15,40),new THREE.MeshBasicMaterial({color:0xff5a5a,transparent:true,opacity:0.85,side:THREE.DoubleSide,depthWrite:false}));
          rg2.rotation.x=-Math.PI/2;rg2.position.set(boss.position.x,0.12,boss.position.z);scene.add(rg2);
          rings.push({m:rg2,r:1,hit:false});sfx(65,0.35,"square",0.09,45);},420);}
        if(warnD){scene.remove(warnD);warnD.geometry.dispose();warnD.material.dispose();warnD=null;}
        boss.position.y=0.5;setTimeout(function(){boss.position.y=0;},120);
        bState="idle";bT=bossPh===1?1.5:2.4;}
      else if(bState==="slam"&&bT<=0){ /* Faust-Slam -> Kristall verwundbar */
        vulnT=4.2;bState="idle";bT=5.0; /* langes Fenster zum Zuschlagen */
        var a=slamArm;a.userData.slamTgt=-1.35;
        a.userData.cry.material.emissiveIntensity=1;
        sfx(70,0.5,"sawtooth",0.1,45);hint("⚔️ JETZT die glühende Faust treffen!",2200);}
      if(vulnT>0){vulnT-=dt;
        if(slamArm){slamArm.userData.cry.scale.setScalar(1+Math.sin(t*10)*0.25);
          slamArm.rotation.x+=((slamArm.userData.slamTgt||-1.35)-slamArm.rotation.x)*Math.min(1,dt*10);} /* Arm saust runter */
        if(vulnT<=0&&slamArm){slamArm.userData.slamTgt=0;slamArm=null;}}
      if(boss.userData.armL.rotation.x<-0.02&&boss.userData.armL!==slamArm)boss.userData.armL.rotation.x+=(0-boss.userData.armL.rotation.x)*Math.min(1,dt*5); /* Arme federn zurück */
      if(boss.userData.armR.rotation.x<-0.02&&boss.userData.armR!==slamArm)boss.userData.armR.rotation.x+=(0-boss.userData.armR.rotation.x)*Math.min(1,dt*5);
      if(bState==="stomp"){if(warnD)warnD.material.opacity=0.3+Math.sin(t*14)*0.25;boss.position.y+=(-0.4-boss.position.y)*Math.min(1,dt*8);} /* duckt sich vor dem Stampfer */
      if(vulnT>0&&slamArm){slamArm.userData.fist.getWorldPosition(_fw);
        vRing.visible=true;vRing.position.set(_fw.x,0.14,_fw.z);vRing.material.opacity=0.35+0.3*Math.abs(Math.sin(t*6));
        vLight.position.set(_fw.x,1.2,_fw.z);vLight.intensity+=(0.9-vLight.intensity)*Math.min(1,dt*6);}
      else{vRing.visible=false;vLight.intensity+=(0-vLight.intensity)*Math.min(1,dt*6);}
      if(hitFx>0){hitFx-=dt;boss.position.x=Math.sin(t*60)*0.12*hitFx;}
      /* Ringe expandieren + treffen */
      for(var ri=rings.length-1;ri>=0;ri--){var rr=rings[ri];rr.r+=dt*(bossPh===1?7:5.5);
        rr.m.scale.setScalar(rr.r);rr.m.material.opacity=Math.max(0,0.85-rr.r*0.045);
        var pd=Math.hypot(px-boss.position.x,pz-boss.position.z);
        if(!rr.hit&&invT<=0&&Math.abs(pd-rr.r)<0.55&&py<0.55){rr.hit=true;damage();break;} /* break PFLICHT: damage() leert rings */
        if(rr.r>18){scene.remove(rr.m);rr.m.geometry.dispose();rr.m.material.dispose();rings.splice(ri,1);}}
    }
    if(boss.userData.falling){boss.rotation.x+=dt*0.5;boss.position.y-=dt*1.4;}
    if(invT>0){invT-=dt;player.visible=invT<=0||Math.sin(t*30)>0;} /* 🛡️ kurze Unverwundbarkeit blinkt */
    player.position.set(px,py,pz);
  }
  /* Kamera */
  var cy2=py+ (bossOn?7.5:6.2),cz2=pz+(bossOn?11:8.6);
  camera.position.x+=(px-camera.position.x)*Math.min(1,dt*5);
  camera.position.y+=(cy2-camera.position.y)*Math.min(1,dt*5);
  camera.position.z+=(cz2-camera.position.z)*Math.min(1,dt*5);
  camera.lookAt(px,py+1.2,pz-2);
  if(annT>0){annT-=dt;if(annT<=0)document.getElementById("announce").style.opacity=0;}
  renderer.render(scene,camera);}
requestAnimationFrame(frame);
updHud();
window.__nd={state:function(){return {px:px,py:py,pz:pz,hearts:hearts,gems:gemN,bossOn:bossOn,bossHp:bossHp,won:won};},
  tp:function(x,z){px=x;pz=z;py=groundAt(x,z,1e9)+0.2;vy=0;},boss:function(){px=0;pz=CHZ+10;py=0;}};
})();
</script>
</body>
</html>
