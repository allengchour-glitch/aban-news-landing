# GitLab-CI — Gratis-Ersatz für GitHub Actions (ABAN-Files-Upload)
# Voll-Anleitung: docs/GITLAB-SETUP.md
#
# Idee: GitHub Actions ist account-weit gesperrt → wir lassen die wichtigsten Jobs
# stattdessen auf GitLab.com (gratis CI-Minuten) laufen. Diese Datei wird von GitLab
# automatisch erkannt, sobald das Repo dort liegt/gespiegelt ist.
#
# Benötigte CI/CD-Variablen (GitLab → Settings → CI/CD → Variables), „masked":
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN  (YouTube-OAuth)
#   XI (ElevenLabs, nur falls neu gerendert werden muss — die 13 Folgen sind bereits gerendert)
#   PEXELS (optional, nur für Neu-Rendern)
#   GITLAB_PUSH_TOKEN (optional: Project-Access-Token mit write_repository → speichert
#                      Ledger/Status zurück, verhindert Doppel-Posts/-Uploads)
#   --- Pinterest (Gratis-Dauertraffic für LuxeStyle) ---
#   PINTEREST_ACCESS_TOKEN  ODER  PINTEREST_REFRESH_TOKEN + PINTEREST_APP_ID + PINTEREST_APP_SECRET
#   (Refresh-Variante empfohlen: Token wird pro Lauf frisch geholt, läuft nie ab.)

stages:
  - post
  - traffic
  - brain

# 🧠 aban-Brain — Selbst-Verbesserung OHNE GitHub Actions (umgeht die Actions-Sperre).
# Läuft auf GitLabs Gratis-Runner. Holt sich IMMER frisch den aktuellen Code von GitHub,
# scannt + fixt sicher (rel=noopener) und schreibt Report/Score/Vorschläge auf einen
# EIGENEN Branch `brain/auto` — NIEMALS direkt nach main, KEIN Auto-Deploy auf Produktion.
# Mensch (oder Claude in der nächsten Session) prüft per PR, merged und deployt. So bleibt
# die Regel „immer Branch + PR, nie direkt nach main, kein ungeprüfter Prod-Deploy" gewahrt.
#
# Benötigte CI/CD-Variable (GitLab → Settings → CI/CD → Variables, „Masked"):
#   GH_PUSH_TOKEN   GitHub Fine-grained PAT, Repo allengchour-glitch/aban-news-landing,
#                   Permission „Contents: Read and write"   (PFLICHT — pusht nur auf brain/auto)
#
# Automatisch (sparsam!): GitLab → Build → Pipeline schedules → z. B. täglich 06:00 UTC.
# Manuell: Build → Pipelines → „Run pipeline".
brain-improve:
  stage: brain
  image: python:3.11
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: manual
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    # 1) Frischen Stand von GitHub holen (immer aktuell, kein Drift)
    - test -n "$GH_PUSH_TOKEN" || { echo "GH_PUSH_TOKEN fehlt — Abbruch"; exit 1; }
    - git clone --depth=1 "https://x-access-token:${GH_PUSH_TOKEN}@github.com/allengchour-glitch/aban-news-landing.git" gh
    - cd gh
    # 2) Selbst-Verbesserung: sichere Auto-Fixes + Scan (schreibt Score + Report)
    - python3 tools/daily_improvement_scan.py --fix
    - python3 tools/daily_improvement_scan.py
    # 3) Vorschläge auf EIGENEN Branch brain/auto pushen (NIE main, KEIN Deploy)
    - |
      git config user.email "brain@aban"; git config user.name "aban-brain"
      git checkout -B brain/auto
      git add -A -- '*.html' reports/IMPROVEMENT-REPORT.md automation/brain-state.json
      if ! git diff --cached --quiet; then
        git commit -m "brain: Vorschläge — Auto-Fix + Report + Score (GitLab-CI) [skip ci]"
        git push -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/allengchour-glitch/aban-news-landing.git" "HEAD:brain/auto"
        echo "→ Vorschläge auf Branch 'brain/auto' gepusht. PR öffnen, prüfen, mergen, dann deployen."
      else
        echo "Keine Änderungen — Seite war schon sauber. Nichts zu tun."
      fi

# ABAN-Files-Folgen auf YouTube hochladen.
# Start: GitLab → Build → Pipelines → „Run pipeline" → Variable COUNT setzen (z. B. 6) → Job starten.
# YouTube-API-Limit: ~6 Uploads/Tag → ersten Tag COUNT=6, nächsten Tag COUNT=7.
aban-upload:
  stage: post
  image: python:3.11
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'      # manuell über „Run pipeline"
    - when: manual                            # sonst nur auf Klick (verbrennt keine Minuten)
  variables:
    COUNT: "6"
    PRIVACY: "public"
  before_script:
    - apt-get update -qq && apt-get install -y -qq fonts-dejavu-core git
    - pip install --quiet Pillow numpy imageio-ffmpeg google-api-python-client google-auth-oauthlib google-auth-httplib2
  script:
    - cd video-prototypes/aban-files
    - python3 aban_publish.py --count "$COUNT" --privacy "$PRIVACY"
    # Upload-Status zurückspeichern (nur wenn GITLAB_PUSH_TOKEN gesetzt ist)
    - cd "$CI_PROJECT_DIR"
    - |
      if [ -n "$GITLAB_PUSH_TOKEN" ]; then
        git config user.email "ci@gitlab"; git config user.name "gitlab-ci"
        git add video-prototypes/aban-files/uploaded.json video-prototypes/aban-files/video_ids.json || true
        if ! git diff --cached --quiet; then
          git commit -m "aban: Upload-Status [skip ci]"
          git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
        else
          echo "kein neuer Upload-Status."
        fi
      else
        echo "GITLAB_PUSH_TOKEN nicht gesetzt → Status nicht gespeichert (Doppel-Upload-Gefahr bei erneutem Lauf)."
      fi

# Pinterest-Pins aus dropship/pinterest_pins.csv veröffentlichen (Gratis-Dauertraffic).
# Ersetzt den gesperrten GitHub-Workflow pinterest-publish.yml — identisches Skript.
# Manuell: GitLab → Build → Pipelines → „Run pipeline" (Variablen LIMIT/DRY optional).
# Automatisch (sparsam): Build → Pipeline schedules → z. B. Mo & Do 09:00, LIMIT=5.
# Idempotent über Ledger dropship/pinterest_done.txt (wird mit GITLAB_PUSH_TOKEN zurückgeschrieben).
pinterest-publish:
  stage: traffic
  image: node:20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'      # manuell über „Run pipeline"
    - when: manual                            # sonst nur auf Klick (verbrennt keine Minuten)
  variables:
    LIMIT: "5"      # neue Pins pro Lauf (kein Spam)
    DRY: "false"    # "true" = nur testen, nichts posten
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    - |
      if [ "$DRY" = "true" ]; then DRYFLAG="--dry-run"; else DRYFLAG=""; fi
      node automation/pinterest_publish.mjs --limit "$LIMIT" $DRYFLAG
    # Ledger zurückspeichern (nur wenn GITLAB_PUSH_TOKEN gesetzt ist) → kein Doppel-Posting
    - |
      if [ -n "$GITLAB_PUSH_TOKEN" ]; then
        git config user.email "ci@gitlab"; git config user.name "gitlab-ci"
        git add dropship/pinterest_done.txt || true
        if ! git diff --cached --quiet; then
          git commit -m "pinterest: Ledger aktualisiert [skip ci]"
          git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
        else
          echo "keine neuen Pins."
        fi
      else
        echo "GITLAB_PUSH_TOKEN nicht gesetzt → Ledger nicht gespeichert (Doppel-Post-Gefahr bei erneutem Lauf)."
      fi
