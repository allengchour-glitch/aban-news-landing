name: Merchant-Zugang prüfen (nur lesen)

on:
  workflow_dispatch:
    inputs:
      merchant_id:
        description: 'Merchant-ID (nur für registrieren; wird im Log maskiert)'
        required: false
        default: ''
      registrieren:
        description: 'Google-Projekt beim Merchant-Konto als Entwickler anmelden (einmalig)'
        type: boolean
        default: false
  push:
    branches: [claude/merchant-probe-1111]
    paths: ['.github/workflows/merchant-probe.yml', 'automation/merchant_probe.py']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automation/merchant_probe.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests
      # Die Merchant-Nummer zuerst maskieren: GitHub druckt Umgebung und Skript eines Schritts, bevor er läuft.
      # Darum liest dieser Schritt die Eingabe aus der Ereignisdatei (der Wert steht nie im Skripttext).
      - name: Nummer maskieren
        run: |
          MID=$(jq -r '.inputs.merchant_id // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$MID" ]; then echo "::add-mask::$MID"; fi
      - name: Probe
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          MERCHANT_ID: ${{ inputs.merchant_id }}
          REGISTRIEREN: ${{ inputs.registrieren }}
        run: python3 automation/merchant_probe.py
