name: Effizienz-Hinweise (Solar/USB-LED) setzen

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur Vorschau'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: efficiency-badge
  cancel-in-progress: false

jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Effizienz-Hinweise setzen
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node automation/add_efficiency_badge.mjs
