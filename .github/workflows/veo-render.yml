name: Veo Reel Render (Vertex AI)

# Erzeugt mit Google Veo (Vertex AI) einen kurzen Hook-Clip aus einem ECHTEN Produktfoto
# und reiht ihn als status=pending in automation/reels_seed.csv ein (Freigabe nötig vor dem Posten).
# NUR manuell (workflow_dispatch) — Veo ist kostenpflichtig, daher kein Auto-Cron.
# No-op ohne Secrets (GCP_SA_KEY).
#
# Secrets/Variablen (Settings → Secrets and variables → Actions):
#   Secret  GCP_SA_KEY        Service-Account-JSON (oder base64), Rolle "Vertex AI User"
#   Var     GCP_PROJECT       GCP-Projekt-ID
#   Var     GCP_LOCATION      z.B. us-central1
#   Var     VERTEX_VEO_MODEL  optional; Default = günstiges veo-3.0-fast-generate-001 (ggf. gegen Vertex-Doku prüfen)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'animate (echtes Produktfoto animieren) | broll (KI-Mood, kein Produkt)'
        type: choice
        options: [animate, broll]
        default: animate
      dry_run:
        description: 'Nur testen (kein kostenpflichtiger Veo-Aufruf)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veo-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg + fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu

      - name: Generate Veo hook reel
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          VERTEX_VEO_MODEL: ${{ vars.VERTEX_VEO_MODEL }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node automation/gen_veo_reel.mjs

      - name: Commit results if changed
        run: |
          if ! git diff --quiet -- reels/ automation/reels_seed.csv automation/.veo_pointer; then
            git config user.name "luxestyle-veo-bot"
            git config user.email "bot@users.noreply.github.com"
            git add reels/ automation/reels_seed.csv automation/.veo_pointer
            git commit -m "chore(veo): neuer Hook-Clip (pending) [skip ci]"
            git push
          else
            echo "Nichts erzeugt (No-op ohne Secrets oder Dry-Run)."
          fi
