name: "Auswahl-Lauf (CJ-Varianten nachziehen, nachts)"

# Zieht die fehlenden Farben/Grössen bei den Shop-Produkten nach (automation/cj_varianten_nachziehen.mjs, Treiber
# automation/auswahl_durchlauf.sh). Warum auf GitHub statt in der Cloud-Sitzung: dort sterben alle Hintergrundprozesse bei jedem
# Container-Neustart (26.10.2026 zweimal in drei Stunden). Shopify begrenzt neue Varianten pro Tag (gleitendes 24-h-Fenster,
# laut Doku 10 000, gemessen ~9 500); der Lauf der Vornacht begann 21:43 UTC, also öffnet sich das Fenster ab etwa 21:45 wieder.
# Ein langer Lauf pro Nacht nutzt die Tagesmenge aus. Das Repo ist öffentlich: keine Laufminuten-Kosten.
#
# Zugang: Repo-Secrets SHOPIFY_SHOP, SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET (Client-Credentials-Grant einer im Shop INSTALLIERTEN
# Custom-App; sonst «400 app_not_installed»), CJ_EMAIL, CJ_API_KEY und MINDESTENS EINES von GEMINI_API_KEY/GROQ_API_KEY (Übersetzung von
# Variantenlabels; ohne beide bliebe rund die Hälfte der Kandidaten ungeschrieben, unsichere Übersetzungen werden nie geraten → der Lauf bricht dann laut ab).
#
# Ablauf: Freigabe prüfen → ffmpeg installieren → KI-Schlüssel prüfen → Shopify-Zugang prüfen (bricht laut ab) → CJ-Token einmal holen (CJ erlaubt das nur alle 5 Minuten, die
# Läufer teilen den Zwischenspeicher) → Kandidaten aus dem LIVE-Shop bauen (nur Ein-Varianten-Produkte; bereits Nachgezogene fallen
# von selbst heraus) → Probe (schreibt nichts) oder Lauf (schreibt) → Ledger zurück ins Repo.
# Nächtliche (geplante) Läufe schreiben erst, wenn dropship/AUSWAHL-ACTIONS-FREI.txt im Repo liegt (nach einer geprüften Probe).
on:
  schedule:
    - cron: '50 21 * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'probe = nur planen (schreibt nichts) · lauf = schreibt LIVE'
        type: choice
        options: [probe, lauf]
        default: probe
      probe_anzahl:
        description: 'Probe: wie viele Produkte planen'
        type: string
        default: '5'
      stufen:
        description: 'Lauf: Stufen (1 bewertet, 2 Kleidung/Schuhe/Ringe/Uhren/Taschen, 3 Rest)'
        type: string
        default: '1 2 3'
      workers:
        description: 'Lauf: parallele Läufer'
        type: string
        default: '6'
      laufzeit_min:
        description: 'Lauf: Höchstdauer in Minuten (höchstens 330; der Job begrenzt zusätzlich auf seine Restzeit)'
        type: string
        default: '330'

permissions:
  contents: write

concurrency:
  group: auswahl-lauf
  cancel-in-progress: false

jobs:
  auswahl:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MODUS: ${{ inputs.modus || 'lauf' }}
      EREIGNIS: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /automation/
            /dropship/cj_varianten_ledger.txt
            /dropship/AUSWAHL-ACTIONS-FREI.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freigabe prüfen (nächtliche Läufe)
        id: frei
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ "$EREIGNIS" = "schedule" ] && [ ! -f dropship/AUSWAHL-ACTIONS-FREI.txt ]; then
            echo "::warning title=Auswahl-Lauf nicht freigegeben::dropship/AUSWAHL-ACTIONS-FREI.txt fehlt, es wurde nichts getan. Erst den Workflow von Hand mit modus=probe starten und die Ausgabe prüfen."
            echo "weiter=0" >> "$GITHUB_OUTPUT"
          else
            echo "weiter=1" >> "$GITHUB_OUTPUT"
          fi

      - name: ffmpeg installieren (Bild-Vergleich der Variantenbilder)
        if: ${{ steps.frei.outputs.weiter == '1' }}
        # ffmpeg ist auf ubuntu-latest NICHT vorinstalliert. Ohne es gälte jedes Variantenbild als «unlesbar» und die Varianten gingen ohne eigenes Bild live
        # (Prüfung 26.10.2026, drei Prüfer unabhängig). Das Werkzeug prüft ffmpeg zusätzlich selbst und bricht sonst ab.
        run: |
          # apt kann auf frischen Rechnern lange auf die Paketsperre warten (am 26.10.2026 hing ein CI-Lauf über drei Minuten): Sperr-Wartezeit und hartes Zeitlimit,
          # dann laut scheitern — nie eine ganze Nacht stehen.
          for versuch in 1 2 3; do
            if timeout 420 sudo apt-get -o DPkg::Lock::Timeout=240 update -q && timeout 420 sudo apt-get -o DPkg::Lock::Timeout=240 install -y --no-install-recommends ffmpeg; then break; fi
            echo "apt-get gescheitert (Versuch $versuch/3)"; sleep 20
          done
          command -v ffmpeg >/dev/null || { echo "::error title=ffmpeg fehlt::apt-get konnte ffmpeg nach 3 Versuchen nicht installieren; ohne ffmpeg werden keine Variantenbilder erkannt, es wird nichts geschrieben."; exit 1; }
          ffmpeg -version | head -1

      - name: KI-Dienst für die Übersetzung der Variantennamen prüfen (echter Probeaufruf)
        id: ki
        if: ${{ steps.frei.outputs.weiter == '1' }}
        # Scheitert die Prüfung (27.10.2026: Gemini HTTP 402 «prepayment credits are depleted», GROQ_API_KEY nicht als Secret gesetzt), bricht die Nacht NICHT ab:
        # Produkte, deren Optionswerte übersetzt werden müssten, werden 20 Stunden zurückgestellt (KEIN_KI_UEBERSETZEN), alle anderen laufen weiter.
        # Rot wird der Job trotzdem — am Ende («KI-Ausfall sichtbar machen»), damit es jemand merkt.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
        run: |
          if [ -z "${GEMINI_API_KEY// }" ] && [ -z "${GROQ_API_KEY// }" ] && [ -z "${GROQ_API_KEY2// }" ] && [ -z "${GROQ_API_KEY3// }" ]; then
            echo "::error title=KI-Schlüssel fehlt::Weder GEMINI_API_KEY noch GROQ_API_KEY (auch _2/_3) ist als Repo-Secret gesetzt. Ohne sie bleibt rund die Hälfte der Kandidaten ungeschrieben, weil unsichere Variantennamen nie geraten werden."
            exit 1
          fi
          echo "KI-Schlüssel: gemini=$([ -n "${GEMINI_API_KEY// }" ] && echo ja || echo nein) groq=$([ -n "${GROQ_API_KEY// }" ] && echo ja || echo nein) groq2=$([ -n "${GROQ_API_KEY2// }" ] && echo ja || echo nein) groq3=$([ -n "${GROQ_API_KEY3// }" ] && echo ja || echo nein)"
          # Ein gesetzter Schlüssel heisst nicht, dass der Dienst antwortet (leeres Guthaben HTTP 402, Ratenlimit, ungültiger Schlüssel): einmal wirklich fragen.
          node --input-type=module -e "
            import { nachDeutsch } from './automation/lib/uebersetzen.mjs';
            const t = await nachDeutsch(['Rose Red']);
            if (t.weg === 'original') { console.error('KI-Probeaufruf scheiterte: ' + (t.grund || 'ohne Grund')); process.exit(1); }
            console.log('KI-Probeaufruf ok über', t.weg);
          "

      - name: Shopify-Zugang prüfen (bricht laut ab)
        if: ${{ steps.frei.outputs.weiter == '1' }}
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          CJ_PROBE: '0'
        run: node automation/diagnose_actions_zugang.mjs

      - name: CJ-Token holen (einmal, die Läufer teilen den Zwischenspeicher)
        if: ${{ steps.frei.outputs.weiter == '1' }}
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: |
          node --input-type=module -e "
            import { cjToken } from './automation/lib/cj_token.mjs';
            const t = await cjToken();
            if (!t) { console.error('Kein CJ-Token (Zugang falsch oder CJ drosselt: nur ein Abruf je 5 Minuten)'); process.exit(1); }
            console.log('CJ-Token bereit');
          "

      - name: Kandidaten aus dem Live-Shop bauen
        if: ${{ steps.frei.outputs.weiter == '1' }}
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          node automation/auswahl_kandidaten.mjs
          test -s /tmp/auswahl_kandidaten.csv || { echo "Kandidatenliste leer — Abbruch"; exit 1; }
          echo "Kandidaten insgesamt: $(wc -l < /tmp/auswahl_kandidaten.csv)"
          awk -F';' '{c[$2]++} END{for(k in c) print "  Stufe " k ": " c[k]}' /tmp/auswahl_kandidaten.csv | sort

      - name: Probe (plant, schreibt nichts)
        if: ${{ steps.frei.outputs.weiter == '1' && env.MODUS == 'probe' }}
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          KEIN_KI_UEBERSETZEN: ${{ steps.ki.outcome != 'success' && '1' || '' }}
          HANDLES_DATEI: /tmp/auswahl_kandidaten.csv
          LIMIT: ${{ inputs.probe_anzahl || '5' }}
          LIVE: '0'
        run: node automation/cj_varianten_nachziehen.mjs

      - name: Lauf (schreibt LIVE)
        id: lauf
        if: ${{ steps.frei.outputs.weiter == '1' && env.MODUS == 'lauf' }}
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          # leer = KI an; «1» = der Probeaufruf oben ist gescheitert, Produkte mit zu übersetzenden Werten werden 20 Stunden zurückgestellt
          KEIN_KI_UEBERSETZEN: ${{ steps.ki.outcome != 'success' && '1' || '' }}
          LIVE: '1'
          STUFEN: ${{ inputs.stufen || '1 2 3' }}
          WORKERS: ${{ inputs.workers || '6' }}
          LAUFZEIT: ${{ inputs.laufzeit_min || '330' }}
          BATCH: '40'
          # SKU auf die CJ-Variantennummer (Bestellung #1029): höchstens so viele Schreibvorgänge je 20 Stunden über alle Läufer. Erwartet sind 0 bis 2 pro Nacht; erst nach sauberen Nächten anheben.
          MAX_SKU_SCHREIBEN: '5'
        run: |
          export NODE="$(command -v node)"
          rm -f /tmp/auswahl_stop
          # Höchstdauer: Eingabe (nur Ziffern, höchstens 330), nie mehr als die Restzeit des Jobs (timeout-minutes 355 minus Vorlauf und 15 Minuten für Zusammenfassung und Ledger), mindestens 20.
          LAUFZEIT="${LAUFZEIT//[^0-9]/}"; [ -z "$LAUFZEIT" ] && LAUFZEIT=330
          [ "$LAUFZEIT" -gt 330 ] && LAUFZEIT=330
          rest=$(( 340 - ( $(date +%s) - JOB_START ) / 60 ))
          [ "$LAUFZEIT" -gt "$rest" ] && LAUFZEIT=$rest
          [ "$LAUFZEIT" -lt 20 ] && LAUFZEIT=20
          echo "Höchstdauer des Laufs: ${LAUFZEIT} Minuten"
          # sanftes Ende 20 Minuten vor der Höchstdauer: laufende Produkte werden fertig geschrieben, dann stoppt der Treiber
          ( sleep $(( (LAUFZEIT - 20) * 60 )); touch /tmp/auswahl_stop ) &
          wache=$!
          set +e
          timeout --kill-after=120 "${LAUFZEIT}m" bash automation/auswahl_durchlauf.sh > /tmp/auswahl_durchlauf.out 2>&1
          rc=$?
          set -e
          kill "$wache" 2>/dev/null || true
          # übrig gebliebene Läufer beenden, bevor das Ledger committet wird
          pids=$(ps -eo pid,cmd | grep -E '[c]j_varianten_nachziehen' | awk '{print $1}' || true)
          if [ -n "$pids" ]; then kill $pids || true; sleep 5; fi
          echo "Treiber-Code: $rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          tail -n 25 /tmp/auswahl_durchlauf.out || true

      - name: Zusammenfassung
        if: ${{ always() && steps.frei.outputs.weiter == '1' && env.MODUS == 'lauf' }}
        run: |
          neu=$(git diff -U0 -- dropship/cj_varianten_ledger.txt | grep '^+[^+]' | grep -c ' · GESCHRIEBEN · ' || true)
          var=$(git diff -U0 -- dropship/cj_varianten_ledger.txt | grep '^+[^+]' | grep ' · GESCHRIEBEN · ' | awk -F' · ' '{split($4,a," "); s+=a[1]} END{print s+0}')
          skip=$(git diff -U0 -- dropship/cj_varianten_ledger.txt | grep '^+[^+]' | grep -c ' · UEBERSPRUNGEN · ' || true)
          fehl=$(git diff -U0 -- dropship/cj_varianten_ledger.txt | grep '^+[^+]' | grep -c ' · FEHLER · ' || true)
          skugesetzt=$(git diff -U0 -- dropship/cj_varianten_ledger.txt | grep '^+[^+]' | grep -c ' · SKU_GESETZT · ' || true)
          skumehr=$(git diff -U0 -- dropship/cj_varianten_ledger.txt | grep '^+[^+]' | grep -c 'SKU mehrdeutig' || true)
          {
            echo "### Auswahl-Lauf"
            echo "- Nachgezogen: **$neu** Produkte mit **$var** neuen Varianten"
            echo "- Übersprungen (CJ führt nur eine Variante o. ä.): $skip · Fehler beim Schreiben: $fehl"
            echo "- SKU auf die CJ-Variantennummer gesetzt: **$skugesetzt** · SKU mehrdeutig (zurückgestellt, Entscheid offen): $skumehr"
            echo "- Treiber-Code: ${{ steps.lauf.outputs.rc }}"
            echo "- Letzte Zeilen:"
            echo '```'
            tail -n 12 /tmp/auswahl_durchlauf.log 2>/dev/null | cut -c1-200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Protokoll sichern
        if: ${{ always() && steps.frei.outputs.weiter == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: auswahl-lauf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/auswahl_durchlauf.log
            /tmp/auswahl_durchlauf.out
            dropship/cj_varianten_ledger.txt
          if-no-files-found: warn
          retention-days: 14

      - name: KI-Ausfall sichtbar machen
        if: ${{ always() && steps.frei.outputs.weiter == '1' && steps.ki.outcome == 'failure' }}
        run: |
          echo "::error title=KI-Dienst für die Übersetzung fiel aus::Der Probeaufruf scheiterte (Gemini-Guthaben leer? GROQ_API_KEY nicht als Repo-Secret gesetzt?). Die Nacht lief ohne KI: Produkte mit zu übersetzenden Optionswerten wurden 20 Stunden zurückgestellt, alle anderen wurden normal bearbeitet. Behebung: Gemini-Guthaben auffüllen (https://ai.studio/projects) oder Repo-Secrets GROQ_API_KEY (und optional GROQ_API_KEY2/GROQ_API_KEY3) setzen."
          exit 1

      - name: Ledger committen (auch nach Teilfehlern)
        if: ${{ always() && steps.frei.outputs.weiter == '1' && env.MODUS == 'lauf' }}
        env:
          ZIEL: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- dropship/cj_varianten_ledger.txt)" ]; then
            echo "Kein Ledger-Update."
            exit 0
          fi
          n=$(git diff -U0 -- dropship/cj_varianten_ledger.txt | grep '^+[^+]' | grep -c ' · GESCHRIEBEN · ' || true)
          git config user.name "luxestyle-autopilot"
          git config user.email "bot@users.noreply.github.com"
          # Das Ledger besteht aus unabhängigen Zeilen: hängt eine andere Seite (Cloud-Sitzung, ein zweiter Lauf) gleichzeitig an, bleiben beim Rebase
          # beide Seiten erhalten (Union-Merge). .git/info/attributes gilt auch im Sparse-Checkout, eine .gitattributes im Repo-Wurzelordner läge dort nicht aus.
          mkdir -p .git/info
          echo 'dropship/cj_varianten_ledger.txt merge=union' >> .git/info/attributes
          git add -- dropship/cj_varianten_ledger.txt
          git commit -m "Auswahl-Ledger: $n Produkte nachgezogen [skip ci]"
          for versuch in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$ZIEL"; then exit 0; fi
            if ! git pull --rebase --autostash origin "$ZIEL"; then
              echo "Rebase fehlgeschlagen — Ledger liegt im Artefakt dieses Laufs." >&2
              exit 1
            fi
            sleep 3
          done
          echo "Push nach 5 Versuchen gescheitert — Ledger liegt im Artefakt dieses Laufs." >&2
          exit 1

      - name: Treiber-Fehler sichtbar machen
        if: ${{ steps.lauf.outputs.rc != '' && steps.lauf.outputs.rc != '0' && steps.lauf.outputs.rc != '124' && steps.lauf.outputs.rc != '137' && steps.lauf.outputs.rc != '143' }}
        run: |
          echo "Der Treiber endete mit Code ${{ steps.lauf.outputs.rc }} (0/124/137/143 wären normal)." >&2
          exit 1
