name: Märkte-Monitor (Daten-Wächter)

# Prüft regelmäßig, ob data/markets.json frisch & vollständig ist. Schlägt per
# Telegram Alarm, wenn der Daten-Job hängt. Nur lesend (kein Commit). No-op ohne Secrets.
on:
  # schedule:  # PAUSIERT 2026-06-13 (Cron-Nulldiaet — GitHub Fair-Use)
    # - cron: '17 */12 * * *'   # alle 6 Stunden
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markets-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Daten-Frische prüfen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          TELEGRAM_ALERT_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python automation/markets_monitor.py
