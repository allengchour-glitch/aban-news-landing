name: Poster zum Selbstgestalten anlegen (Printful/POD)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur Vorschau (nichts schreiben)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: create-poster-pod
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Poster-Produkt anlegen
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'false' && '0' || '1' }}
        run: node automation/create_poster_pod.mjs
