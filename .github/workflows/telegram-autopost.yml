name: Telegram Autopost

# Postet werktags den naechsten faelligen Eintrag aus social/telegram_queue.json
# in den Telegram-Kanal. No-op ohne Secrets. Cron laeuft nur vom Default-Branch.

on:
  schedule:
    - cron: '30 6 * * 1-5'   # Mo–Fr 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Post next queued item
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          VERTEX_IMAGE_MODEL: ${{ vars.VERTEX_IMAGE_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ABAN_IMAGE_SOURCE: ${{ vars.ABAN_IMAGE_SOURCE }}
          ABAN_DISABLE_IMAGE_GEN: ${{ vars.ABAN_DISABLE_IMAGE_GEN }}
        run: |
          pip install --quiet pillow google-auth requests || true
          python3 automation/telegram_post.py

      - name: Persist queue status (falls gepostet)
        run: |
          if ! git diff --quiet -- social/telegram_queue.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add social/telegram_queue.json
            git commit -m "Telegram-Autopost: Queue-Status aktualisiert [skip ci]"
            git push
          else
            echo "Queue unveraendert — kein Commit."
          fi
