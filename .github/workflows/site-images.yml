name: Webseiten-Bilder

# Erzeugt Header-Bilder (Hubs=Pexels, themen/index/founding=KI) + bindet sie ein.
# Läuft nur manuell (workflow_dispatch), batch-fähig gegen Pexels-Rate-Limit (200/h)
# und Imagen-Kosten. Idempotent: bereits erzeugte Bilder werden übersprungen.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "hub | themen | pages | all"
        default: "hub"
      batch:
        description: "max. Seiten pro Lauf (0 = alle)"
        default: "150"
      offset:
        description: "Start-Index"
        default: "0"

permissions:
  contents: write

concurrency:
  group: site-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bilder erzeugen + einbinden
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          VERTEX_IMAGE_MODEL: ${{ vars.VERTEX_IMAGE_MODEL }}
          ABAN_DISABLE_IMAGE_GEN: ${{ vars.ABAN_DISABLE_IMAGE_GEN }}
        run: |
          pip install --quiet pillow google-auth requests || true
          python3 automation/gen_site_images.py \
            --kind "${{ github.event.inputs.kind || 'hub' }}" \
            --batch "${{ github.event.inputs.batch || '150' }}" \
            --offset "${{ github.event.inputs.offset || '0' }}"

      - name: Bilder + Seiten committen
        run: |
          if ! git diff --quiet -- img/ ki-fuer-*.html themen/ index.html founding.html 2>/dev/null || [ -n "$(git status --porcelain img/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add img/ ki-fuer-*.html themen/ index.html founding.html 2>/dev/null || true
            git commit -m "Webseiten-Bilder: Header-Bilder erzeugt + eingebunden [skip ci]" || echo "nichts"
            for _i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else
            echo "Keine Änderung."
          fi
