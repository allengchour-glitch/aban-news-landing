name: Tägliche KI-Reels (Tool + Hype-Watch)

# Rendert täglich ZWEI fertige 9:16-Reels: das „KI-Tool des Tages" (data/tools.json)
# und einen rotierenden Hype-Watch-Faktencheck (data/hype-watch.json). Beide landen
# im /reels-Loop (media/reels) und als Artefakt. Mehr Video-Content = mehr Reichweite.
# Mit Secret XI: Stimme+Karaoke. Mit PEXELS: dynamischer Stockclip-Look (sonst Zoom).
on:
  # schedule:  # PAUSIERT 2026-06-09 — ElevenLabs-Guthaben schonen (User: „nicht mehr viel Filme").
  #            # Dieser Lauf rendert 2 Reels/Tag MIT ElevenLabs-Stimme (Secret XI) → Hauptverbraucher.
  #            # Manuell weiter via „Run workflow"; Cron wieder einkommentieren, wenn Guthaben da ist.
  #   - cron: '0 5 * * *'   # täglich 05:00 UTC
  workflow_dispatch:
    inputs:
      tool_id:
        description: 'Bestimmtes Tool (leer = Tool des Tages)'
        required: false
        default: ''

jobs:
  reels:
    name: Render KI-Reels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (Pillow + ffmpeg)
        run: pip install --quiet Pillow imageio-ffmpeg
      - name: Render + publish (Tool + Hype-Watch)
        # XI → Stimme+Karaoke; PEXELS → Stockclip-Look (sonst ruhiger Zoom)
        env:
          XI: ${{ secrets.XI }}
          PEXELS: ${{ secrets.PEXELS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cd video-pipeline
          VOICE=""; [ -n "$XI" ] && VOICE="--voice"
          # 1) KI-Tool des Tages
          python tool_reel.py ${{ github.event.inputs.tool_id }} $VOICE
          # 2) Hype-Watch des Tages (deterministisch rotierend)
          HW=$(python - <<'PY'
          import json, datetime
          f = json.load(open('../data/hype-watch.json'))['faelle']
          i = (datetime.date.today() - datetime.date(2026, 1, 1)).days % len(f)
          print(f[i]['id'])
          PY
          )
          echo "Hype-Watch des Tages: $HW"
          python render_all_reels.py "$HW" $VOICE
          # 3) Beide auf /reels veröffentlichen
          python publish_reel_to_site.py --latest    # Tool-Reel
          python publish_reel_to_site.py "$HW"       # Hype-Watch-Reel
          echo "Fertige Reels:"; find ausgabe -name 'reel.mp4'
          # 4) Commit media/reels (rollendes Fenster)
          cd ..
          if [ -n "$(git status --porcelain media/reels)" ]; then
            git config user.name "reel-bot"
            git config user.email "actions@users.noreply.github.com"
            git add media/reels
            git commit -m "reels: neue KI-Reels (Tool + Hype-Watch) auf /reels [skip ci]"
            for _i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else
            echo "Keine Änderung an media/reels."
          fi
      - name: Upload reels (Artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: ki-reels
          path: video-pipeline/ausgabe
          retention-days: 30
