name: Fertig-Designs → Sticker-Produkte (Printful)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur Vorschau (keine Produkte anlegen)'
        type: boolean
        default: true
      limit:
        description: 'Wie viele Designs (Test: 1-2)'
        type: string
        default: '2'
      only:
        description: 'Nur diese Design-Namen (Komma)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: design-products
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Produkte anlegen
        env:
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
          LIMIT: ${{ github.event.inputs.limit || '2' }}
          ONLY: ${{ github.event.inputs.only }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'false' && '' || '1' }}
        run: node automation/printful_create_design_products.mjs
      - name: Ledger commit
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          if [ -n "$(git status --porcelain social/designs/_created.txt)" ]; then
            git config user.name "luxestyle-autopilot"; git config user.email "bot@users.noreply.github.com"
            git add social/designs/_created.txt
            git commit -m "Fertig-Sticker-Produkte: Ledger [skip ci]"
            for i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          fi
