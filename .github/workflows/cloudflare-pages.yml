name: Cloudflare Pages

# Versionierter, reproduzierbarer Deploy nach Cloudflare Pages (Alternative bzw.
# Ergänzung zur Git-Integration im Dashboard). Push auf main -> Production-Deploy;
# Pull Request -> Preview-Deploy.
#
# WICHTIG: Der Job ist bewusst so gebaut, dass er OHNE Secrets nichts kaputt macht:
# fehlt CLOUDFLARE_API_TOKEN, werden alle Deploy-Schritte übersprungen und der Job
# bleibt grün (kein roter Check). Sobald die Secrets gesetzt sind, deployt er.
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – API-Token mit der Berechtigung "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  – die Cloudflare Account-ID
# Optionale Repository-Variable:
#   CF_PAGES_PROJECT       – Pages-Projektname (Default: radar; muss zum
#                            Cloudflare-Pages-Projekt passen)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Secrets sind in `if`-Bedingungen nicht direkt nutzbar -> als env mappen und
    # darüber gaten. Fehlt das Token, laufen die Deploy-Schritte nicht.
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Deploy (wrangler pages deploy)
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          # Output-Verzeichnis = Repo-Root (".") als Positional. Bewusst KEINE
          # wrangler.toml im Repo, damit die Pages-Git-Integration im Dashboard
          # unveraendert weiterlaeuft; dieser Action-Deploy ist ein opt-in
          # Direct-Upload (laeuft nur mit gesetzten Secrets).
          # branch=main -> Production, sonst Preview-Deploy fuer den Branch.
          command: >-
            pages deploy .
            --project-name=${{ vars.CF_PAGES_PROJECT || 'radar' }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Hinweis, wenn Secrets fehlen
        if: ${{ env.CF_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN ist nicht gesetzt — Deploy übersprungen."
          echo "Secrets unter Settings → Secrets and variables → Actions hinterlegen:"
          echo "  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID"
