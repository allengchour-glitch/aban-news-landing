name: Cloudflare-Build-Logs holen (Diagnose)

# Einmalige Diagnose: liest die Logs der fehlschlagenden Cloudflare-Builds (Workers Builds
# aban-a / ki-verzeichnis / aban-news-landing, Pages handwerk-radar / voice-radar) über die
# Cloudflare-API, weil sie ausserhalb des Dashboards nirgends sichtbar sind. Nur lesend.
on:
  push:
    branches: [claude/luxstyle-play-store-app-rjuxbz]
    paths: [.github/workflows/cf-build-logs.yml]
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Workers Builds
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/$1"; }
          for b in 5c3fddde-faa0-4155-9a79-9c180081ba40 da73a9e1-9160-4481-8b09-d2fa46edf1e7 52411026-05fc-4295-a19d-50271e34fc98; do
            echo "::group::build $b"
            api "builds/builds/$b" | head -c 3000; echo
            api "builds/builds/$b/logs" | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          r=d.get("result") or {}
          lines=r.get("lines") or r.get("logs") or []
          print(d.get("errors") or "")
          for l in lines[-80:]: print(l if isinstance(l,str) else " ".join(map(str,l)))' || true
            echo "::endgroup::"
          done
      - name: Pages
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/$1"; }
          for p in handwerk-radar voice-radar; do
            echo "::group::pages $p"
            id=$(api "pages/projects/$p/deployments?per_page=5" | python3 -c 'import json,sys
          d=json.load(sys.stdin); r=d.get("result") or []
          print(next((x["id"] for x in r if x.get("latest_stage",{}).get("status")=="failure"), ""))')
            echo "deployment=$id"
            [ -n "$id" ] && api "pages/projects/$p/deployments/$id/history/logs" | python3 -c 'import json,sys
          d=json.load(sys.stdin); r=d.get("result") or {}
          print(d.get("errors") or "")
          for l in (r.get("data") or [])[-80:]: print(l.get("line",""))'
            echo "::endgroup::"
          done
