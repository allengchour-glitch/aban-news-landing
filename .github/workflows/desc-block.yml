name: Produkt-Beschreibungs-Block (Styling + Bemerkung + passender Link)

# Hängt bei Fashion-Produkten einen Block an (Styling-Text + Bemerkung + Link zur PASSENDEN Kollektion).
# Idempotent (überspringt bereits ergänzte). No-op ohne Shopify-Creds. Nur manuell.
# Pro Lauf max. MAX Produkte (Default 60) — für grosse Kollektionen mehrfach starten.
# AUTH: SHOPIFY_ADMIN_TOKEN (Custom-App-Token) ODER SHOPIFY_CLIENT_ID/SECRET (Client-Credentials).

on:
  workflow_dispatch:
    inputs:
      collection:
        description: 'Kollektion-Handle (Scope), z. B. damen-mode'
        type: string
        default: 'damen-mode'
      max:
        description: 'Max. Produkte pro Lauf'
        type: string
        default: '60'
      dry_run:
        description: 'Nur testen (keine Änderung)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desc-block
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Beschreibungs-Block ergänzen
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          COLLECTION: ${{ github.event.inputs.collection || 'damen-mode' }}
          MAX: ${{ github.event.inputs.max || '60' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node automation/desc_block.mjs
