name: "🎬 Werbevideo erstellen (1 Klick, DE+EN)"

# EIN Tool, 2 Konzepte: 'fashion' (Katalog) oder 'print' (Selbst gestalten). Generiert optional Veo-Bewegung
# + rendert die fertige Werbung 9:16 hook-first DE+EN (ElevenLabs-Stimme, sonst Google-Fallback; Musik + Clean).

on:
  workflow_dispatch:
    inputs:
      concept:
        description: 'Konzept'
        type: choice
        default: 'fashion'
        options: [ 'fashion', 'print' ]
      heroes:
        description: 'Produkt-namen fuer echte Veo-Bewegung (Komma-Liste; leer = nur Stills)'
        type: string
        default: ''
      stills:
        description: 'Anzahl Still-Produkte'
        type: string
        default: '6'
      seconds:
        description: 'Veo Clip-Sekunden (4/6/8)'
        type: string
        default: '4'
      source:
        description: 'CSV-Quelle (leer = automatisch nach Konzept)'
        type: string
        default: ''
      hook_de:
        description: 'Hook DE (leer = Konzept-Default)'
        type: string
        default: ''
      hook_en:
        description: 'Hook EN (leer = Konzept-Default)'
        type: string
        default: ''
      veo_model:
        description: 'Veo-Modell (z.B. veo-3.1-generate-preview = Full, oder veo-3.1-lite-generate-preview)'
        type: string
        default: 'veo-3.1-lite-generate-preview'
      veo_csv:
        description: 'Custom-CSV fuer Veo-Heroes (name,image_url,label,handle) – leer = automation/good_products.csv'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: werbevideo
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ffmpeg + Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: 1) Veo-Bewegung (nur falls heroes gesetzt)
        if: ${{ github.event.inputs.heroes != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VEO_MODEL: ${{ github.event.inputs.veo_model || 'veo-3.1-lite-generate-preview' }}
          VEO_CSV: ${{ github.event.inputs.veo_csv }}
          VEO_ONLY: ${{ github.event.inputs.heroes }}
          VEO_SECONDS: ${{ github.event.inputs.seconds || '4' }}
        run: node automation/veo-hero-clip.mjs || echo "Veo uebersprungen/fehlgeschlagen -> weiter mit Stills"

      - name: 2) Manifest + Voiceover + Render (DE & EN)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          CONCEPT: ${{ github.event.inputs.concept || 'fashion' }}
          NSTILL: ${{ github.event.inputs.stills || '6' }}
          SRC_IN: ${{ github.event.inputs.source }}
          HEROES_IN: ${{ github.event.inputs.heroes }}
          HOOK_DE_IN: ${{ github.event.inputs.hook_de }}
          HOOK_EN_IN: ${{ github.event.inputs.hook_en }}
        run: |
          set -e
          D=/tmp/wv; IMG=$D/img; mkdir -p "$IMG"; : > "$D/manifest.txt"
          if [ "$CONCEPT" = "print" ]; then
            SRC="${SRC_IN:-dropship/ads/good_products_print.csv}"
            HOOK_DE="${HOOK_DE_IN:-Dein Design. Dein Teil.}"
            HOOK_EN="${HOOK_EN_IN:-Your design. Your piece.}"
            DE="Dein Design, dein Teil. Bei LuxeStyle gestaltest du dein eigenes T-Shirt, Hoodie, Tasche oder Tasse, mit deinem Spruch, Motiv oder Logo. Waehle dein Produkt, lade dein Design hoch, fertig. On-demand gedruckt, kein Lager, keine Mindestmenge. Jetzt selbst gestalten, nur bei LuxeStyle."
            EN="Your design, your piece. At LuxeStyle you create your own t-shirt, hoodie, bag or mug, with your slogan, artwork or logo. Pick your product, upload your design, done. Printed on demand, no inventory, no minimum. Start designing, only at LuxeStyle."
            OUTBASE="werbung-selbst-gestalten"
          else
            SRC="${SRC_IN:-automation/good_products.csv}"
            HOOK_DE="${HOOK_DE_IN:-Designer-Look. Fairer Preis.}"
            HOOK_EN="${HOOK_EN_IN:-Designer looks. Fair prices.}"
            DE="Das ist LuxeStyle. Premium-Mode aus der Schweiz, Designer-Looks zu fairen Preisen. Kleider, Taschen und Accessoires fuer deinen Sommer. Oder gestalte dein eigenes Teil, dein Design, on-demand gedruckt. Gratis Versand ab fuenfundsechzig Franken. Zehn Prozent mit dem Code Welcome zehn. Jetzt shoppen, nur bei LuxeStyle."
            EN="This is LuxeStyle. Premium Swiss fashion, designer looks at fair prices. Dresses, bags and accessories for your summer. Or design your own piece, your design, printed on demand. Free shipping over sixty-five francs. Ten percent off with the code Welcome ten. Shop now, only at LuxeStyle."
            OUTBASE="werbung-luxestyle"
          fi
          echo "Konzept=$CONCEPT  Quelle=$SRC  Out=$OUTBASE"
          if [ "$CONCEPT" = "fashion" ] || [ -n "$HEROES_IN" ]; then
            if [ -n "$HEROES_IN" ]; then
              # nur die gewaehlten Heroes, in genau dieser Reihenfolge (kein glob-all -> keine alten/rotierenden Clips)
              IFS=',' read -ra HRS <<< "$HEROES_IN"
              for nm in "${HRS[@]}"; do
                nm=$(printf '%s' "$nm" | tr -d ' ')
                [ -z "$nm" ] && continue
                f=$(ls -1 reels/veo-hero-${nm}-*.mp4 2>/dev/null | sort | tail -n1)
                [ -n "$f" ] && [ -e "$f" ] && printf 'veo|%s|\n' "$f" >> "$D/manifest.txt"
              done
            else
              for f in reels/veo-hero-*.mp4; do [ -e "$f" ] && printf 'veo|%s|\n' "$f" >> "$D/manifest.txt" || true; done
            fi
          fi
          k=0
          tail -n +2 "$SRC" | head -n "$NSTILL" > "$D/rows.csv" || true
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            url=$(printf '%s' "$line" | cut -d, -f2); label=$(printf '%s' "$line" | cut -d, -f3); k=$((k+1))
            curl -sL --fail "$url" -o "$IMG/$k.jpg" && printf 'still|%s|%s\n' "$IMG/$k.jpg" "$label" >> "$D/manifest.txt" || true
          done < "$D/rows.csv"
          echo "=== Manifest ==="; cat "$D/manifest.txt"
          if [ "$CONCEPT" = "print" ]; then
            MUSIC_PROMPT="upbeat playful modern pop beat, energetic and fun, creative maker vibe, bright synths and claps, no vocals, social media ad, loopable"
          else
            MUSIC_PROMPT="upbeat modern fashion beat, stylish and energetic, driving drums and bright synths, premium social media ad, no vocals, loopable"
          fi
          MUSICFILE="$D/music.m4a"
          bash dropship/ads/gen_music.sh "$MUSICFILE" "$MUSIC_PROMPT" 28000
          bash dropship/ads/tts_eleven.sh de "$D/voice_de.wav" "$DE"
          bash dropship/ads/tts_eleven.sh en "$D/voice_en.wav" "$EN"
          mkdir -p reels
          bash dropship/ads/render_masterpiece.sh "reels/${OUTBASE}-de.mp4" "$D/voice_de.wav" "$MUSICFILE" "$D/manifest.txt" de "$HOOK_DE"
          bash dropship/ads/render_masterpiece.sh "reels/${OUTBASE}-en.mp4" "$D/voice_en.wav" "$MUSICFILE" "$D/manifest.txt" en "$HOOK_EN"
          ls -la reels/${OUTBASE}-*.mp4

      - name: Commit
        run: |
          git config user.name "werbevideo-bot"; git config user.email "actions@users.noreply.github.com"
          git add reels/werbung-*.mp4 reels/veo-hero-*.mp4 2>/dev/null || true
          git commit -m "Werbevideo LuxeStyle DE+EN (1-Klick, hook-first) [skip ci]" || { echo nichts; exit 0; }
          for i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
