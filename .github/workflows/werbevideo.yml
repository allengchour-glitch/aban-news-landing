name: LuxeStyle Werbevideo (DE + EN, Voiceover)

# Rendert ein Hype-Werbevideo (9:16) aus echten Produktbildern (good_products.csv) mit Voiceover
# (Google-TTS) + geduckter Musik + Marken-CTA — auf Deutsch UND Englisch. Nur manuell.

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Anzahl Produktbilder'
        type: string
        default: '6'

permissions:
  contents: write

concurrency:
  group: werbevideo
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg + Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Bilder + Voiceover + Render (DE & EN)
        env:
          NIMG: ${{ github.event.inputs.images || '6' }}
        run: |
          set -e
          D=/tmp/ad; IMG=$D/img; mkdir -p $IMG; : > $IMG/names.txt
          k=0
          tail -n +2 automation/good_products.csv | head -n "$NIMG" | while IFS= read -r line; do
            url=$(printf '%s' "$line" | cut -d, -f2); label=$(printf '%s' "$line" | cut -d, -f3)
            k=$((k+1))
            if curl -sL --fail "$url" -o "$IMG/$k.jpg"; then printf '%s\n' "$label" >> "$IMG/names.txt"; fi
          done
          ls -la $IMG
          DE="Entdecke LuxeStyle. Premium-Mode aus der Schweiz, Designer-Looks zu fairen Preisen. Kleider, Taschen und Accessoires, handverlesen für deinen Sommer. Gratis Versand ab fünfundsechzig Franken. Sichere dir jetzt zehn Prozent mit dem Code Welcome zehn. LuxeStyle punkt c h. Dein Look, deine Story."
          EN="Discover LuxeStyle. Premium Swiss fashion, designer looks at fair prices. Dresses, bags and accessories, handpicked for your summer. Free shipping over sixty-five francs. Get ten percent off now with the code Welcome ten. LuxeStyle dot c h. Your look, your story."
          bash dropship/ads/tts.sh de "$D/voice_de.wav" "$DE"
          bash dropship/ads/tts.sh en "$D/voice_en.wav" "$EN"
          mkdir -p reels
          bash dropship/ads/render_ad.sh reels/werbung-luxestyle-de.mp4 "$D/voice_de.wav" automation/reel_music.m4a "$IMG" "luxestyle.ch  ·  -10% mit Code WELCOME10"
          bash dropship/ads/render_ad.sh reels/werbung-luxestyle-en.mp4 "$D/voice_en.wav" automation/reel_music.m4a "$IMG" "luxestyle.ch  ·  -10% with code WELCOME10"
          ls -la reels/werbung-luxestyle-*.mp4
      - name: Commit
        run: |
          git config user.name "werbevideo-bot"; git config user.email "actions@users.noreply.github.com"
          git add reels/werbung-luxestyle-de.mp4 reels/werbung-luxestyle-en.mp4
          git commit -m "Werbevideo LuxeStyle DE+EN (Voiceover + Musik) [skip ci]" || { echo nichts; exit 0; }
          for i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
