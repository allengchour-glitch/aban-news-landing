name: Cloudflare — Domain abannews.com auf Pages-Projekt umziehen

# Registriert die Custom-Domain auf dem Pages-Projekt und stellt die Apex-DNS
# von GitHub Pages auf das Pages-Projekt (CNAME -> <projekt>.pages.dev, proxied).
#
# SICHERHEIT: Standard ist apply=false (Trockenlauf) — zeigt nur den IST-Zustand
# und den Plan, ändert NICHTS. Erst apply=true führt die DNS-Umstellung aus.
# Nutzt CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (Secrets).

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Pages-Projektname'
        required: true
        default: 'abannews'
      apply:
        description: 'true = DNS wirklich umstellen (sonst nur Trockenlauf)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cf-attach-domain
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJ: ${{ inputs.project }}
      APPLY: ${{ inputs.apply }}
    steps:
      - name: Domain umstellen (oder Trockenlauf)
        run: |
          set -uo pipefail
          ZONE="abannews.com"
          TARGET="${PROJ}.pages.dev"
          api() { curl -s -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          ok() { jq -e '.success==true' >/dev/null 2>&1; }

          if [ -z "$CF_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN fehlt"; exit 1; fi

          echo "── Zone-ID ermitteln ──"
          ZRESP=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE")
          ZID=$(echo "$ZRESP" | jq -r '.result[0].id // empty')
          if [ -z "$ZID" ]; then echo "::error::Zone $ZONE nicht gefunden / Token ohne Zone-Zugriff"; echo "$ZRESP" | jq '.errors'; exit 1; fi
          echo "Zone-ID: $ZID"

          echo "── Aktuelle DNS-Records für $ZONE ──"
          CUR=$(api "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?name=$ZONE")
          echo "$CUR" | jq -r '.result[] | "\(.id)  \(.type)  \(.content)  proxied=\(.proxied)"'

          echo "── Custom-Domain auf Pages-Projekt registrieren ($PROJ) ──"
          REG=$(api -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJ/domains" --data "{\"name\":\"$ZONE\"}")
          if echo "$REG" | ok; then echo "✅ Domain auf Pages-Projekt registriert (oder bereits vorhanden)."; else
            echo "ℹ️ Registrierungs-Antwort:"; echo "$REG" | jq '{success,errors,messages}'; fi

          if [ "$APPLY" != "true" ]; then
            echo "── TROCKENLAUF (apply=false): es wird NICHTS an der DNS geändert. ──"
            echo "Plan bei apply=true:"
            echo "  1) Lösche obige A/AAAA/CNAME-Records am Apex ($ZONE)  [GitHub-Pages-Einträge]"
            echo "  2) Lege CNAME $ZONE -> $TARGET (proxied) an"
            echo "Token-DNS-Schreibtest (harmlos, legt nichts an): "
            # Versuch eines ungültigen Patch nur um die Berechtigung zu sehen
            TESTID=$(echo "$CUR" | jq -r '.result[0].id // empty')
            if [ -n "$TESTID" ]; then
              T=$(api -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records/$TESTID" --data '{}')
              if echo "$T" | jq -e '.success==true or (.errors|length>0)' >/dev/null; then
                echo "$T" | jq -e '.errors[]?|select(.code==10000)' >/dev/null && echo "⚠️ Token fehlt »Zone · DNS · Edit«." || echo "✅ DNS-Schreibrecht sieht vorhanden aus."
              fi
            fi
            exit 0
          fi

          echo "── APPLY: konfliktbehaftete Apex-Records löschen ──"
          for rid in $(echo "$CUR" | jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id'); do
            echo "DELETE $rid"; api -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records/$rid" | jq -c '{success}'
          done

          echo "── CNAME $ZONE -> $TARGET (proxied) anlegen ──"
          NEW=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" --data "{\"type\":\"CNAME\",\"name\":\"$ZONE\",\"content\":\"$TARGET\",\"proxied\":true}")
          if echo "$NEW" | ok; then echo "✅ CNAME angelegt."; else echo "::error::CNAME-Anlage fehlgeschlagen"; echo "$NEW" | jq '.errors'; exit 1; fi

          echo "── Endzustand ──"
          api "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?name=$ZONE" | jq -r '.result[] | "\(.type)  \(.content)  proxied=\(.proxied)"'
          echo "Fertig. In 1-3 Min stellt Cloudflare das SSL-Zertifikat aus; danach läuft https://$ZONE auf Pages."
