name: ABAN Files auto-publish (eigener Kanal)

# Rendert die naechste ABAN-Files-Folge (Pexels-Footage + ElevenLabs-Stimme +
# Untertitel) DIREKT in der CI und laedt sie als Short auf den eigenen
# ABAN-Files-YouTube-Kanal. Fortschritt in video-prototypes/aban-files/uploaded.json.
#
# Benoetigte Repo-Secrets:
#   XI                     - ElevenLabs API-Key
#   PEXELS                 - Pexels API-Key (gratis)
#   YT_CLIENT_ID           - OAuth-Client (wie Bunny-Pipeline, wiederverwendbar)
#   YT_CLIENT_SECRET       - OAuth-Client-Secret
#   ABAN_YT_REFRESH_TOKEN  - Refresh-Token, autorisiert fuer DEN ABAN-FILES-KANAL
#                            (mit scripts/yt_get_refresh_token.py erzeugen und dabei
#                             den ABAN-Files-Kanal auswaehlen)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Wie viele Folgen jetzt veroeffentlichen"
        default: "1"
  schedule:
    - cron: "0 17 2-30/2 * *"   # an geraden Tagen 17:00 UTC (~19:00 Berlin)

permissions:
  contents: write

concurrency:
  group: aban-youtube
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          pip install Pillow numpy imageio-ffmpeg \
            google-api-python-client google-auth-oauthlib google-auth-httplib2
      - name: Render + upload next episode(s)
        working-directory: video-prototypes/aban-files
        env:
          XI: ${{ secrets.XI }}
          PEXELS: ${{ secrets.PEXELS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          ABAN_YT_REFRESH_TOKEN: ${{ secrets.ABAN_YT_REFRESH_TOKEN }}
        run: python3 aban_publish.py --count "${{ github.event.inputs.count || 1 }}"
      - name: Persist upload state
        working-directory: video-prototypes/aban-files
        run: |
          if ! git diff --quiet uploaded.json 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uploaded.json
            git commit -m "aban: Upload-Fortschritt"
            git push
          else
            echo "kein neuer Upload."
          fi
