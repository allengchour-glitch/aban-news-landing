name: Add Premium homepage section (one-off)

# Fügt die "✨ Premium-Marken"-Sektion per Admin-API in die Live-Startseite ein.
# Manuell auslösbar (workflow_dispatch). Nutzt die vorhandenen Shopify-Secrets.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "DRY-Run (1 = nur anzeigen, nicht schreiben)"
        required: false
        default: "0"

jobs:
  add-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Insert Premium section into live theme index.json
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          PREMIUM_COLLECTION_HANDLE: luxestyle-premium
          DRY: ${{ github.event.inputs.dry }}
        run: node automation/add_premium_section.mjs
