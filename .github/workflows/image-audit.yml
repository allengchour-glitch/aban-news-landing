name: Image Audit (Vision)
on:
  schedule:
    - cron: '30 4 * * 2'   # woechentlich Di 04:30 UTC (laeuft Katalog in Chargen ab, idempotent)
  workflow_dispatch:
    inputs:
      apply:
        description: 'Umsortieren anwenden (Vorgabe: nur Bericht)'
        type: boolean
        default: false
      batch:
        description: 'Produkte pro Lauf'
        type: string
        default: '60'
      modell:
        description: 'Gemini-Modell für beide Schlüssel (leer = automatisch: Gratis-Schlüssel gemini-flash-lite-latest, Ersatzschlüssel gemini-3.8-flash)'
        type: string
        default: ''
      pause_ms:
        description: 'Pause zwischen Gemini-Aufrufen in ms (leer = automatisch: 4500 mit Gratis-Schlüssel, sonst 400)'
        type: string
        default: ''

concurrency:
  group: image-audit
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # ohne Angabe gelten 360 Minuten: Lauf 7 hing 20 Minuten an einem klemmenden Gratis-Schlüssel
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Vision-Audit
        env:
          # Zweiter Gemini-Schlüssel (Gratis-Tarif) hat Vorrang, sobald das Secret GEMINI_API_KEY2 gesetzt ist; sonst der erste.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY2 || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY2 && secrets.GEMINI_API_KEY || '' }}
          # GEMESSEN 08.11.: der Gratis-Schlüssel bekommt für gemini-3.8-flash sofort 429 (Kontingent), gemini-flash-lite-latest geht; neue Schlüssel
          # dürfen gemini-2.5-flash nicht mehr benutzen (404). Auf 17 Hauptbildern stimmte Lite in 16 Fällen mit 3.8-flash überein.
          # Gratis-Tarif: rund 15 Anfragen je Minute, darum 4500 ms Pause, solange der Gratis-Schlüssel vorn steht.
          PAUSE_MS: ${{ inputs.pause_ms || (secrets.GEMINI_API_KEY2 && '4500') || '400' }}
          GEMINI_MODEL: ${{ inputs.modell || (secrets.GEMINI_API_KEY2 && 'gemini-flash-lite-latest') || 'gemini-3.8-flash' }}
          GEMINI_MODEL_FALLBACK: ${{ inputs.modell || 'gemini-3.8-flash' }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # Der Wochenlauf berichtet nur. Umsortieren passiert ausschliesslich auf ausdruecklichen Zuruf.
          APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) && '1' || '0' }}
          BATCH: ${{ inputs.batch || '60' }}
        run: node automation/image-audit.mjs
      - name: Report/Ledger zurueckschreiben
        if: ${{ always() }}  # auch nach einem Abbruch: ins Ledger kommen nur Produkte mit echter Beurteilung
        run: |
          git config user.name "luxestyle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dropship/image-audit-done.txt dropship/image-audit-report.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Image-Audit: Report/Ledger aktualisiert [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          else echo "Keine Aenderungen."; fi
