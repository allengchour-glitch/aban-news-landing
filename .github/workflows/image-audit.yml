name: Image Audit (Vision)
on:
  schedule:
    - cron: '30 4 * * 2'   # woechentlich Di 04:30 UTC (laeuft Katalog in Chargen ab, idempotent)
  workflow_dispatch:
    inputs:
      apply:
        description: 'Umsortieren anwenden (sonst nur Report)'
        type: boolean
        default: true
      batch:
        description: 'Produkte pro Lauf'
        type: string
        default: '60'

concurrency:
  group: image-audit
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Vision-Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply == false) && '0' || '1' }}
          BATCH: ${{ inputs.batch || '60' }}
        run: node automation/image-audit.mjs
      - name: Report/Ledger zurueckschreiben
        run: |
          git config user.name "luxestyle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dropship/image-audit-done.txt dropship/image-audit-report.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Image-Audit: Report/Ledger aktualisiert [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          else echo "Keine Aenderungen."; fi
