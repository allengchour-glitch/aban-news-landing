name: Weekly Content Audit

on:
  schedule:
    - cron: '0 22 * * 0'  # Sunday 22:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit all newsletter issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          if [ -f tools/requirements.txt ]; then
            pip install -r tools/requirements.txt
          fi

      - name: Run voice-linter (batch) on all newsletter issues
        id: audit
        run: |
          set +e
          mkdir -p .audit
          REPORT=weekly-audit-report.md
          {
            echo "# Weekly Content Audit Report"
            echo ""
            echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "**Trigger:** ${{ github.event_name }}"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
          } > "$REPORT"

          if [ ! -f tools/brand-voice-linter.py ]; then
            echo "::warning::tools/brand-voice-linter.py not found"
            echo "_Linter script missing — audit skipped._" >> "$REPORT"
            echo "violations=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL=0
          VIOLATIONS=0
          if [ -d ausgaben ]; then
            python tools/brand-voice-linter.py --batch ausgaben/ > .audit/output.txt 2>&1
            EXIT=$?
            cat .audit/output.txt >> "$REPORT"
            TOTAL=$(find ausgaben -type f -name '*.md' | wc -l)
            VIOLATIONS=$(grep -c '^FAIL\|violation\|forbidden' .audit/output.txt 2>/dev/null || echo 0)
          else
            echo "_No \`ausgaben/\` directory yet — no issues to audit._" >> "$REPORT"
          fi

          {
            echo ""
            echo "## Summary"
            echo ""
            echo "- Files scanned: $TOTAL"
            echo "- Violations: $VIOLATIONS"
            echo ""
          } >> "$REPORT"

          echo "violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          cat "$REPORT"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit-report
          path: weekly-audit-report.md
          retention-days: 90

      - name: Create issue when violations found
        if: steps.audit.outputs.violations != '0' && steps.audit.outputs.violations != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Weekly Content Audit Report — ${{ steps.audit.outputs.violations }} violations"
          content-filepath: weekly-audit-report.md
          labels: audit, voice-linter, automated
