name: Gemini Ausgaben-Entwurf

# Manuell ausloesbar: sammelt frisches Rohmaterial (RSS) und laesst Gemini einen
# Ausgaben-ENTWURF formulieren (kein Versand!). Committet den Entwurf zum Review.
# No-op ohne GEMINI_API_KEY. Optional als taeglicher Cron aktivierbar (auskommentiert).

on:
  workflow_dispatch:
    inputs:
      niche:
        description: 'Nischen-ID aus data/niches.json (leer = Haupt-Ausgabe)'
        required: false
        default: ''
  # schedule:
  #   - cron: '0 4 * * 1-5'   # bei Bedarf: werktags 04:00 UTC Rohmaterial+Entwurf

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rohmaterial sammeln (echte Quellen, keine Erfindung)
        env:
          NICHE: ${{ inputs.niche }}
        run: |
          ARG=""; [ -n "$NICHE" ] && ARG="--niche $NICHE"
          python3 automation/news_aggregator.py $ARG || echo "::warning::Aggregator-Fehler (evtl. Netz) — fahre fort"

      - name: Entwurf + bild-reiche Ausgabe erzeugen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          VERTEX_IMAGE_MODEL: ${{ vars.VERTEX_IMAGE_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ABAN_IMAGE_SOURCE: ${{ vars.ABAN_IMAGE_SOURCE }}
          ABAN_DISABLE_IMAGE_GEN: ${{ vars.ABAN_DISABLE_IMAGE_GEN }}
          NICHE: ${{ inputs.niche }}
        run: |
          pip install --quiet pillow google-auth requests || true
          ARG=""; [ -n "$NICHE" ] && ARG="--niche $NICHE"
          python3 automation/draft_with_gemini.py $ARG
          python3 automation/build_issue.py $ARG

      - name: Entwurf + Ausgabe committen (zum Review)
        run: |
          if ! git diff --quiet -- automation/ data/ img/ 2>/dev/null || [ -n "$(git status --porcelain img/ data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add automation/news-roh-*.md automation/entwurf-gemini-*.md data/issue-*-draft.html img/issues/ 2>/dev/null || true
            git commit -m "Gemini-Entwurf + bild-reiche Ausgabe (ENTWURF, nicht gesendet) [skip ci]" || echo "nichts zu committen"
            git push || echo "::warning::push fehlgeschlagen"
          else
            echo "Keine Aenderung."
          fi
