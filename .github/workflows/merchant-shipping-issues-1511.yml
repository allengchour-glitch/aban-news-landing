name: Merchant-Versandfehler konkret lesen 15.11.
on:
  push:
    branches: [codex/merchant-fix-1511]
    paths:
      - automation/merchant-fix-1511/shipping_issues.py
      - .github/workflows/merchant-shipping-issues-1511.yml
permissions:
  contents: read
jobs:
  lesen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automation/merchant-fix-1511/shipping_issues.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests google-auth
      - name: Nur konkrete Versandfehler lesen
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python automation/merchant-fix-1511/shipping_issues.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merchant-shipping-issues
          path: merchant-shipping-issues/
          retention-days: 14
