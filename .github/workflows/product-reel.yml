name: Produkt-Reel (Premium, 1 Produkt)

# Rendert EIN Premium-Reel aus mehreren Bildern EINES Produkts (dropship/ads/product_reels.csv):
# Marken-Intro + Ken-Burns + Text + royalty-free Musik + Clean-Version (Trend-Sound) → Queue mit ECHTEM
# Produktlink. Nur manuell (workflow_dispatch). ffmpeg wird im Runner installiert.

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Produkt-name aus dropship/ads/product_reels.csv (z. B. bali)'
        type: string
        default: 'bali'

permissions:
  contents: write

concurrency:
  group: product-reel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg + Fonts installieren
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Produkt-Reel rendern + enqueuen
        run: bash dropship/ads/render_product_reel.sh "${{ github.event.inputs.product || 'bali' }}"

      - name: Commit (Reel + Clean + Queue)
        run: |
          if [ -n "$(git status --porcelain reels/ automation/reels_seed.csv)" ]; then
            git config user.name  "product-reel-bot"
            git config user.email "actions@users.noreply.github.com"
            git add reels/ automation/reels_seed.csv
            git commit -m "product-reel: Premium-Reel (1 Produkt) + Queue [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then echo "gepusht."; break; fi
              echo "rebase --autostash & retry ($i)…"; git pull --rebase --autostash origin main || true; sleep 3
            done
          else
            echo "Nichts gerendert — nichts zu committen."
          fi
