name: Schweiz-Poster generieren (Gemini)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Nur diese Namen (Komma) – leer = alle'
        type: string
        default: ''
      force:
        description: 'Vorhandene überschreiben'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gen-posters
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Poster generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: node automation/gen_posters.mjs
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain social/posters/)" ]; then
            git config user.name "luxestyle-autopilot"; git config user.email "bot@users.noreply.github.com"
            git add social/posters/
            git commit -m "Schweiz-Poster: Gemini-Motive generiert [skip ci]"
            for i in 1 2 3 4 5; do git push origin HEAD:${{ github.ref_name }} && break; git pull --rebase --autostash origin ${{ github.ref_name }} || true; sleep 3; done
          else echo "keine neuen Poster"; fi
