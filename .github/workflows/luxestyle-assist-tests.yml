name: LuxeStyle Assist tests
on:
  pull_request:
    paths:
      - 'automation/claude-assist.mjs'
      - 'automation/cj-read-mcp.mjs'
      - 'automation/cj-read-mcp-probe.mjs'
      - 'automation/lib/claude_assist*.mjs'
      - 'automation/lib/cj_read*.mjs'
      - '.mcp.json'
      - '.github/workflows/diagnose-actions-zugang.yml'
      - '.github/workflows/cj-read-mcp-diagnose.yml'
      - '.github/workflows/luxestyle-assist-tests.yml'
      - 'dropship/assistant/CJ-READ-MCP.md'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            automation/claude-assist.mjs
            automation/cj-read-mcp.mjs
            automation/cj-read-mcp-probe.mjs
            automation/lib/claude_assist*.mjs
            automation/lib/cj_identity.mjs
            automation/lib/cj_read*.mjs
            .mcp.json
            .github/workflows/diagnose-actions-zugang.yml
            .github/workflows/cj-read-mcp-diagnose.yml
            .github/workflows/luxestyle-assist-tests.yml
            dropship/assistant/CJ-READ-MCP.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Local assistant and MCP regressions
        run: |
          node --check automation/claude-assist.mjs
          node --check automation/cj-read-mcp.mjs
          node --check automation/cj-read-mcp-probe.mjs
          node --test automation/lib/claude_assist_test.mjs automation/lib/claude_assist_mcp_test.mjs automation/lib/claude_assist_changes_test.mjs automation/lib/claude_assist_readiness_test.mjs automation/lib/claude_assist_launch_test.mjs automation/lib/claude_assist_runner_test.mjs automation/lib/claude_assist_commits_test.mjs automation/lib/claude_assist_evidence_test.mjs automation/lib/cj_readonly_test.mjs automation/lib/cj_read_mcp_test.mjs automation/lib/cj_read_mcp_probe_test.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync(".mcp.json","utf8"))'
