name: i18n Sync-Bot

# Hält die Mehrsprachigkeit (DE/EN/FR/IT) automatisch synchron + prüft Qualität.
# - deterministische Fixes (hreflang-Reziprozität + fehlende Sitemap-Einträge) werden auto-committet
# - harte i18n-Probleme + echte (abannews-)Broken-Links lassen den Job FEHLSCHLAGEN (sichtbar)
# - Übersetzungs-Leftover/og:image/Orphans = Hinweise (kein Fail)
# KEY-LOS (reines stdlib-Python). Cron läuft nur vom Default-Branch.

on:
  schedule:
    - cron: '17 4 * * *'        # täglich 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'tools/i18n_audit.py'

permissions:
  contents: write

concurrency:
  group: i18n-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deterministische Fixes anwenden (hreflang + Sitemap + Bild-Maße)
        run: |
          python3 tools/i18n_audit.py --fix || true
          python3 tools/add_img_dims.py || true

      - name: Fixes committen (falls vorhanden)
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "i18n-Bot: hreflang/Sitemap synchronisiert [skip ci]"
            for _i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash || true; sleep 3; done
          else
            echo "Nichts zu synchronisieren — bereits konsistent."
          fi

      - name: Harte i18n-Prüfung (Job schlägt fehl bei Defekten)
        run: python3 tools/i18n_audit.py

      - name: Echte Broken-Links (abannews-scope) — Job schlägt fehl
        run: |
          python3 - <<'PY'
          import subprocess, sys
          out = subprocess.run(["python3","tools/check_internal_links.py"], capture_output=True, text=True).stdout
          real, cur = [], None
          for line in out.splitlines():
              s = line.strip()
              if s and not s.startswith(('←','…','✗','✓')):
                  cur = s
              elif s.startswith('←'):
                  src = s[1:].strip()
                  # nur echte abannews-Defekte: externes Shop-/Template-Ziel + Dropship-Quellen ausblenden
                  if cur and not cur.startswith(('/products/','/pages/','AFFILIATE')) and not src.startswith('dropship/'):
                      real.append(f"{cur} <- {src}")
          if real:
              print("::error::Echte interne Broken-Links gefunden:")
              for r in real[:50]: print(" ", r)
              sys.exit(1)
          print("Keine echten abannews-Broken-Links.")
          PY

      - name: Konsistenz (Preise/Garantien) — informativ
        run: |
          python3 tools/consistency_check.py || echo "::warning::consistency_check meldete Abweichungen"
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')" && echo "sitemap.xml wohlgeformt"
