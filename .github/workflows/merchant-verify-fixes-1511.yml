name: Merchant-Korrekturen zurücklesen 15.11.
on:
  push:
    branches: [codex/merchant-fix-1511]
    paths:
      - automation/merchant-fix-1511/verify_google.py
      - dropship/merchant-fix-1511/audit/image-verify-plan.json
      - .github/workflows/merchant-verify-fixes-1511.yml
permissions:
  contents: read
jobs:
  lesen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            automation/merchant-fix-1511/verify_google.py
            dropship/merchant-fix-1511/audit/image-verify-plan.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests google-auth
      - name: Nur frisch zurücklesen
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python automation/merchant-fix-1511/verify_google.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merchant-final-verification
          path: merchant-final-verification/
          retention-days: 30
