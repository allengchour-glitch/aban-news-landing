name: Datensatz neu bauen (frisch halten)

# Hält das verkaufbare KI-Tools-DACH-Produkt aktuell: sobald sich ein Radar-
# anbieter.json oder data/tools.json ändert, wird der Datensatz neu erzeugt.
# Die Gratis-Probe (downloads/ki-tools-dach-sample.csv) wird committet; die
# Voll-Dateien (CSV+JSON) gehen als Artefakt raus → bei Lemon Squeezy/Gumroad
# hochladen. So stimmt das Abo-Versprechen „immer frische Daten".
on:
  push:
    paths:
      - 'data/tools.json'
      - '**/data/anbieter.json'
      - 'daten-produkt/generate_datensatz.py'
  # schedule:  # PAUSIERT 2026-06-13 (Cron-Nulldiaet — GitHub Fair-Use)
    # - cron: '0 4 1 * *'   # zusätzlich monatlich (1. um 04:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Datensatz bauen
        run: |
          cd daten-produkt
          python generate_datensatz.py
          echo "Voll-Dateien:"; ls -la dist/ 2>/dev/null
      - name: Voll-Datensatz als Artefakt (für Lemon Squeezy/Gumroad)
        uses: actions/upload-artifact@v4
        with:
          name: ki-tools-dach-voll
          path: daten-produkt/dist/ki-tools-dach-voll.*
          retention-days: 60
      - name: Aktualisierte Gratis-Probe committen (nur bei Änderung)
        run: |
          if ! git diff --quiet -- downloads/ki-tools-dach-sample.csv; then
            git config user.name "datensatz-bot"
            git config user.email "actions@users.noreply.github.com"
            git add downloads/ki-tools-dach-sample.csv
            git commit -m "datensatz: Gratis-Probe aktualisiert [skip ci]"
            for _i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else
            echo "Keine Änderung an der Probe."
          fi
