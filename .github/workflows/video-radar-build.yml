name: Video-Radar — Auto-Build

on:
  push:
    paths:
      - 'video-radar/**'
  workflow_dispatch:

jobs:
  build:
    name: Generate video directory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate site
        run: |
          cd video-radar
          python generate.py
          find dist -type f | wc -l
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-radar-dist
          path: video-radar/dist
          retention-days: 14

      # --- Deploy nach Cloudflare Pages (nur auf main, nur mit Secret) ---
      - name: Ensure Cloudflare Pages project exists
        if: ${{ github.ref == 'refs/heads/main' && env.CF_API_TOKEN != '' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages project create video --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: ${{ github.ref == 'refs/heads/main' && env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy video-radar/dist --project-name=video --branch=main
      - name: Hinweis, wenn Secrets fehlen
        if: ${{ github.ref == 'refs/heads/main' && env.CF_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN nicht gesetzt — Deploy übersprungen (Build ok)."
          echo "Danach Custom Domain video.abannews.com im CF-Dashboard zuordnen."
