name: Reel Auto-Render (Nachschub für die Queue)

# Selbstgemachtes Tool: rendert automatisch neue Reels aus gut bewerteten Produkten
# (automation/good_products.csv = Regel 7b) und legt sie als status=ready in die Queue.
# Versetzt zum Poster (reel-autopost.yml läuft 00/04/08…, dieser hier 01/05/09…) → keine Commit-Kollision.
# Läuft komplett gratis auf GitHub-Infra. Erweiterung der Vielfalt = mehr Zeilen in good_products.csv.

on:
  schedule:
    - cron: '0 1 */2 * *'   # alle 4h, um 01/05/09/13/17/21 Uhr UTC
  workflow_dispatch:
    inputs:
      n:
        description: 'Produkte pro Reel'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: reel-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg + Fonts + Pillow installieren
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pil

      - name: Reel rendern + enqueuen
        env:
          N: ${{ github.event.inputs.n || '5' }}
        run: bash dropship/ads/auto_render.sh

      - name: Commit (Reel + Queue + Pointer)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "reel-render-bot"
            git config user.email "actions@users.noreply.github.com"
            git add reels/ automation/reels_seed.csv automation/.render_pointer
            git commit -m "reel-render: neues Auto-Reel + Queue ready [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "Nichts gerendert — nichts zu committen."
          fi
