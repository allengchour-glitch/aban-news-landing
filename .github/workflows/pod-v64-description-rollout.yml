name: POD v6.4 Beschreibungs-Rollout

# Editor 6.4.0 («Auf dem Produkt bearbeiten»: Bearbeiten | Druckversion | Vorschau) per Produktbeschreibung.
# Kopie des v6.3-Workflows mit FEST eingestelltem EDITOR_VERSION=6.4.0, eigenen Stufen und eigenen Bestätigungen.
# Reihenfolge und Gates: dropship/selbst-gestalten-fertig-0511/rollout-v63-direct/README.md, Abschnitt «Editor 6.4.0».
#   1. plan (alle Stufen: prüft immer alle 19 Produkte)  2. Artefakt lesen  3. apply canary-tasse  4. Gates
#   5. apply canary-jutebeutel  6. Gates + Beobachtung  7. apply full
# Rollback in UMGEKEHRTER Reihenfolge, je mit dem Artefakt des zugehörigen Apply-Laufs.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Planen, anwenden oder einen früheren Apply-Lauf zurücknehmen
        type: choice
        required: true
        default: plan
        options: [plan, apply, rollback]
      scope:
        description: Stufe A Keramik-Tasse, Stufe B Bio-Jutebeutel oder alle 16 Editorprodukte
        type: choice
        required: true
        default: canary-tasse
        options: [canary-tasse, canary-jutebeutel, full]
      confirmation:
        description: Apply/Rollback erfordert den dokumentierten exakten Bestätigungstext
        type: string
        required: false
        default: ''
      source_run_id:
        description: 'Nur Rollback: numerische Run-ID des ursprünglichen Apply-Artefakts'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

# Bewusst DIESELBE Gruppe wie pod-v63-description-rollout.yml: beide Workflows schreiben dieselben
# Produktbeschreibungen und dürfen nie gleichzeitig laufen.
concurrency:
  group: pod-v63-description-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Eingaben und Default-Branch prüfen
        env:
          OPERATION: ${{ inputs.operation }}
          SCOPE: ${{ inputs.scope }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$REF_NAME" = "$DEFAULT_BRANCH" || { echo "Nur der Default-Branch darf ausrollen" >&2; exit 2; }
          case "$OPERATION:$SCOPE" in
            plan:canary-tasse|plan:canary-jutebeutel|plan:full) test -z "$CONFIRMATION"; test -z "$SOURCE_RUN_ID" ;;
            apply:canary-tasse) test "$CONFIRMATION" = V64_CANARY_TASSE; test -z "$SOURCE_RUN_ID" ;;
            apply:canary-jutebeutel) test "$CONFIRMATION" = V64_CANARY_JUTEBEUTEL; test -z "$SOURCE_RUN_ID" ;;
            apply:full) test "$CONFIRMATION" = V64_FULL_16_EDITOR; test -z "$SOURCE_RUN_ID" ;;
            rollback:canary-tasse) test "$CONFIRMATION" = V64_ROLLBACK_TASSE; [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] ;;
            rollback:canary-jutebeutel) test "$CONFIRMATION" = V64_ROLLBACK_JUTEBEUTEL; [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] ;;
            rollback:full) test "$CONFIRMATION" = V64_ROLLBACK_16_EDITOR; [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] ;;
            *) echo "Unzulässige Eingabekombination" >&2; exit 2 ;;
          esac

      - uses: actions/checkout@v4
        with:
          # Exakt den beim Dispatch aufgezeichneten Commit ausführen. So kann ein späterer
          # Push auf main zwischen Eingabeprüfung und Checkout den geprüften Code nicht ersetzen.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ursprüngliches Apply-Artefakt für Rollback laden
        if: ${{ inputs.operation == 'rollback' }}
        uses: actions/download-artifact@v4
        with:
          name: pod-v64-rollout-${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/pod-v64-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Lokaltests vor jedem Lauf
        run: node dropship/selbst-gestalten-fertig-0511/rollout-v63-direct/direct_rollout_test.mjs

      - name: editor-release.json gegen die echten Dateien prüfen
        run: node dropship/selbst-gestalten-fertig-0511/rollout-v63-direct/editor_release_bauen.mjs --pruefen

      - name: Planen oder kontrolliert schreiben
        env:
          OPERATION: ${{ inputs.operation }}
          SCOPE: ${{ inputs.scope }}
          ACK: ${{ inputs.confirmation }}
          EDITOR_VERSION: '6.4.0'
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          OUT_DIR: ${{ runner.temp }}/pod-v64-run
          ROLLBACK_PLAN: ${{ runner.temp }}/pod-v64-source
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          SCRIPT=dropship/selbst-gestalten-fertig-0511/rollout-v63-direct/direct_rollout.mjs
          case "$OPERATION" in
            plan) MODE=plan SCOPE="$SCOPE" node "$SCRIPT" ;;
            apply) MODE=apply LIVE=1 SCOPE="$SCOPE" node "$SCRIPT" ;;
            rollback) MODE=rollback LIVE=1 SCOPE="$SCOPE" node "$SCRIPT" ;;
            *) exit 2 ;;
          esac

      - name: Plan, Sicherungen und Ledger hochladen
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pod-v64-rollout-${{ github.run_id }}
          path: ${{ runner.temp }}/pod-v64-run/
          if-no-files-found: warn
          retention-days: 30
