name: Täglicher Verbesserungs-Scan

# Läuft jeden Tag von selbst (ohne Befehl): scannt alle HTML-Seiten + sitemap auf
# konkrete, verifizierbare Schwachstellen (SEO, a11y, Security, JSON-LD, Aban-Voice)
# und schreibt den priorisierten Report nach reports/IMPROVEMENT-REPORT.md.
# Der Report wird nur committet, wenn er sich geändert hat (kein Spam, [skip ci]).

on:
  schedule:
    - cron: '0 6 * * *'      # täglich 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-improvement
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verbesserungs-Scan
        run: python3 tools/daily_improvement_scan.py

      - name: Telegram-Report (mit Buttons)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/telegram_report.py

      - name: Report als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: improvement-report
          path: reports/IMPROVEMENT-REPORT.md
          retention-days: 14

      - name: Report committen, wenn geändert
        run: |
          if ! git diff --quiet -- reports/IMPROVEMENT-REPORT.md; then
            git config user.name "aban-improvement-bot"
            git config user.email "bot@users.noreply.github.com"
            git add reports/IMPROVEMENT-REPORT.md
            git commit -m "chore(report): täglicher Verbesserungs-Scan [skip ci]"
            git push
          else
            echo "Report unverändert — nichts zu committen."
          fi
