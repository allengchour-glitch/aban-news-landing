name: Merchant-Versand Liechtenstein

# Modus steht in der Datei dropship/merchant-versand-1111/MODUS (pruefen | schreiben | zurueck),
# damit jede schreibende Ausführung als eigener Commit sichtbar ist.
on:
  workflow_dispatch:
  push:
    branches: [claude/shop-bilder-1111]
    paths: ['.github/workflows/merchant-versand.yml', 'automation/merchant_versand.py', 'dropship/merchant-versand-1111/MODUS']

permissions:
  contents: read

jobs:
  versand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            automation/merchant_versand.py
            dropship/merchant-versand-1111/MODUS
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests
      - name: Versand
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: MODUS="$(tr -d '[:space:]' < dropship/merchant-versand-1111/MODUS 2>/dev/null || echo pruefen)" python3 automation/merchant_versand.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: versand-vorher
          path: versand_vorher.json
          if-no-files-found: ignore
          retention-days: 30
