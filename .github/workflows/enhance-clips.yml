name: Veredeln → Clips (Meta-Video-Queue)

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Wie viele Produkte pro Lauf'
        type: string
        default: '4'
      only:
        description: 'Nur diese Namen (Komma) – leer = rotierend'
        type: string
        default: ''
      dry_run:
        description: 'Nur testen'
        type: boolean
        default: false
  schedule:
    - cron: '20 5 */2 * *'   # täglich 1 Charge veredelte Clips erzeugen

permissions:
  contents: write

concurrency:
  group: enhance-clips
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Veredeln + Clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH: ${{ github.event.inputs.batch || '4' }}
          CLIP_ONLY: ${{ github.event.inputs.only }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node automation/enhance_clips.mjs
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain reels/ social/)" ]; then
            git config user.name "luxestyle-autopilot"; git config user.email "bot@users.noreply.github.com"
            git add reels/ social/video_queue.csv social/enhanced/ automation/.clip_pointer
            git commit -m "Veredelte Clips erzeugt + in Video-Queue [skip ci]"
            for i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else echo "keine neuen Clips"; fi
