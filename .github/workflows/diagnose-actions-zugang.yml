name: "Diagnose Actions-Zugang (CJ-MCP, nur lesen)"

# Prüft ausschliesslich den eng begrenzten CJ-Nur-Lese-MCP an einem fixierten Commit.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Prüfmodus'
        type: choice
        options:
          - cj_mcp
        default: cj_mcp
        required: true
      approved_commit:
        description: 'Nur cj_mcp: freigegebener 40-stelliger Commit des gewählten Refs'
        type: string
        required: false
        default: ''
      operation:
        description: 'Nur cj_mcp: product oder inventory'
        type: choice
        options:
          - product
          - inventory
        default: product
        required: true
      pid:
        description: 'CJ-PID; inventory verlangt ausschliesslich PID'
        type: string
        required: false
      productSku:
        description: 'CJ-productSku; genau PID oder productSku setzen'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: diagnose-actions-zugang-${{ github.repository }}-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  cj_mcp:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'cj_mcp' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fixierten Auftrag prüfen
        shell: bash
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          CJ_MCP_OPERATION: ${{ inputs.operation }}
          CJ_MCP_PID: ${{ inputs.pid }}
          CJ_MCP_PRODUCT_SKU: ${{ inputs.productSku }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = allengchour-glitch/aban-news-landing
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_COMMIT" = "$GITHUB_SHA"
          [[ "$CJ_MCP_OPERATION" == product || "$CJ_MCP_OPERATION" == inventory ]]
          if [[ "$CJ_MCP_OPERATION" == inventory ]]; then
            if [[ -z "$CJ_MCP_PID" || -n "$CJ_MCP_PRODUCT_SKU" ]]; then
              echo 'inventory verlangt genau eine PID und kein productSku.' >&2
              exit 1
            fi
          else
            if [[ -n "$CJ_MCP_PID" && -n "$CJ_MCP_PRODUCT_SKU" ]] || [[ -z "$CJ_MCP_PID" && -z "$CJ_MCP_PRODUCT_SKU" ]]; then
              echo 'product verlangt genau PID oder productSku.' >&2
              exit 1
            fi
          fi
          if [[ -n "$CJ_MCP_PID" ]]; then [[ "$CJ_MCP_PID" =~ ^[0-9]{6,40}$ ]]; fi
          if [[ -n "$CJ_MCP_PRODUCT_SKU" ]]; then [[ "$CJ_MCP_PRODUCT_SKU" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; fi

      - name: Freigegebenen Commit minimal auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.approved_commit }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .mcp.json
            automation/cj-read-mcp.mjs
            automation/cj-read-mcp-probe.mjs
            automation/lib/claude_assist_mcp.mjs
            automation/lib/cj_read_mcp.mjs
            automation/lib/cj_readonly.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Commit und geprüfte Dateien gegenlesen
        shell: bash
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
          cat <<'HASHES' | sha256sum -c -
          9ea924f1c74bcced370290adbe2a4a3b3ad12ec43496a961d9e46531bb895883  .mcp.json
          ef986b11c17d707aa78208c2fd51d4b35486a86e85c2883618daa2e8f8c80ffc  automation/cj-read-mcp.mjs
          4abf25c51e6b44a1cef54d08753b726ba02717ef6c2beb2a01b78e69689cc3d7  automation/cj-read-mcp-probe.mjs
          228be1d0783fb688e2f6971f39fd6a29457a24138bc5242de2f648345793a671  automation/lib/claude_assist_mcp.mjs
          2163a3243b2afe766606f497876248dcdd9468f05e3c0b740017912b16e462a0  automation/lib/cj_read_mcp.mjs
          9a97ca7a99110814bd7b4b9a5c73c024deb87ecfb9a9eb018b3f31ed952c4c1a  automation/lib/cj_readonly.mjs
          HASHES

      - name: CJ-MCP einmalig nur lesend prüfen
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_MCP_OPERATION: ${{ inputs.operation }}
          CJ_MCP_PID: ${{ inputs.pid }}
          CJ_MCP_PRODUCT_SKU: ${{ inputs.productSku }}
        run: node automation/cj-read-mcp-probe.mjs
