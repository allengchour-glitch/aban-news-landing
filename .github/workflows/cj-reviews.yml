name: "POD Reviews-Import (echte CJ-Kommentare zu Judge.me)"

# Importiert echte CJ-Kommentare. Ohne Credentials kein Import; Testlauf ist Standard.
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      regular_run:
        description: 'Begrenzten Regelbetrieb prüfen oder ausführen (Testschalter bleibt wirksam)'
        type: boolean
        default: false
      query:
        description: 'Shopify-Produktfilter (Default tag:cj-real)'
        type: string
        default: 'tag:cj-real'
      only:
        description: 'Nur diese Handles (Komma, ueberschreibt query)'
        type: string
        default: ''
      limit:
        description: 'Max. Produkte'
        type: string
        default: '25'
      scan:
        description: 'Max. gescannte Produkte (max. 5000; leer = limit mal 5)'
        type: string
        default: ''
      per:
        description: 'Max. Reviews je Produkt'
        type: string
        default: '6'
      dry_run:
        description: 'Nur testen (nichts senden)'
        type: boolean
        default: true
      debug:
        description: 'Debug: CJ-Resolver-Strategien loggen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pod-cj-reviews
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            automation/cj_reviews_import.mjs
            automation/lib
            dropship/cj_reviews_done.txt
            dropship/cj_reviews_leer.txt
            dropship/cj_review_scan.json
            dropship/cj_review_items.jsonl
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require a branch for durable import checkpoints
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Select a branch; import checkpoints cannot be saved to a tag." >&2
            exit 1
          fi
      - name: CJ-Reviews importieren
        id: import
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          JUDGEME_PRIVATE_TOKEN: ${{ secrets.JUDGEME_PRIVATE_TOKEN }}
          JUDGEME_SHOP_DOMAIN: ${{ secrets.JUDGEME_SHOP_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
          GROQ_API_KEY4: ${{ secrets.GROQ_API_KEY4 }}
          GROQ_API_KEY5: ${{ secrets.GROQ_API_KEY5 }}
          REGELBETRIEB: ${{ github.event_name == 'schedule' || inputs.regular_run }}
          STARTEREIGNIS: ${{ github.event_name }}
          QUERY: ${{ inputs.query }}
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
          SCAN: ${{ inputs.scan }}
          PER: ${{ inputs.per }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: |
          mkdir -p dropship
          if [ "$REGELBETRIEB" = "true" ]; then
            export QUERY='tag:cj-real status:active' ONLY='' LIMIT=5 SCAN=50 PER=2
            export SORT=CREATED_AT REVERSE=1 MIN_SCORE=1 CJ_REVIEW_SOURCE_NOTE=1
            export CJ_REVIEW_SCAN_STATE=dropship/cj_review_scan.json
            if [ "$STARTEREIGNIS" = "schedule" ]; then export DRY_RUN=0; fi
            for key in CJ_EMAIL CJ_API_KEY JUDGEME_PRIVATE_TOKEN; do
              if [ -z "${!key}" ]; then echo "Zugang fehlt: $key; kein Import." >&2; exit 1; fi
            done
            if [ -z "$SHOPIFY_ADMIN_TOKEN" ] && { [ -z "$SHOPIFY_CLIENT_ID" ] || [ -z "$SHOPIFY_CLIENT_SECRET" ]; }; then
              echo "Shopify-Zugang fehlt; kein Import." >&2; exit 1
            fi
          fi
          node automation/cj_reviews_import.mjs
      - name: Save review import recovery checkpoints
        if: ${{ always() && steps.import.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: cj-review-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dropship/cj_reviews_done.txt
            dropship/cj_reviews_leer.txt
            dropship/cj_review_items.jsonl
            dropship/cj_review_scan.json
          if-no-files-found: warn
          retention-days: 30
      - name: Ledger committen, auch nach Teilfehlern
        if: ${{ always() && steps.import.outcome != 'skipped' && !inputs.dry_run }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          ledger_paths=()
          for path in dropship/cj_reviews_done.txt dropship/cj_reviews_leer.txt dropship/cj_review_items.jsonl dropship/cj_review_scan.json; do
            if [ -f "$path" ]; then ledger_paths+=("$path"); fi
          done
          if [ "${#ledger_paths[@]}" -eq 0 ]; then
            echo "Kein Ledger vorhanden."
            exit 0
          fi
          if [ -n "$(git status --porcelain -- "${ledger_paths[@]}")" ]; then
            git config user.name "luxestyle-autopilot"
            git config user.email "bot@users.noreply.github.com"
            git add -- "${ledger_paths[@]}"
            git commit -m "POD: CJ-Reviews-Import Checkpoint [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
                exit 0
              fi
              if ! git pull --rebase --autostash origin "$TARGET_BRANCH"; then
                echo "Checkpoint rebase failed; recover the ledgers from the workflow artifact." >&2
                exit 1
              fi
              sleep 3
            done
            echo "Checkpoint push failed after 5 attempts; recover the ledgers from the workflow artifact." >&2
            exit 1
          else
            echo "Kein Ledger-Update."
          fi
