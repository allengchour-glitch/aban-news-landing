name: Merchant-Bildprobleme lesen (nur lesen)

on:
  workflow_dispatch:
  push:
    branches: [claude/shop-bilder-1111]
    paths: ['.github/workflows/merchant-bildprobleme.yml', 'automation/merchant_bildprobleme.py']

permissions:
  contents: read

jobs:
  lesen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automation/merchant_bildprobleme.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests
      - name: Bildprobleme lesen
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python3 automation/merchant_bildprobleme.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bildprobleme
          path: bildprobleme.json
          if-no-files-found: ignore
          retention-days: 7
