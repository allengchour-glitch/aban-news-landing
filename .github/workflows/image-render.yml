name: Image Render (Produkt-Post-Bilder)

# Rendert markenkonforme JPG-Post-Bilder (1080x1350 + 1080x1080) aus automation/good_products.csv
# nach social/static/ und reiht sie als status=ready in social/posts_image.csv ein.
# Die JPGs werden via GitHub Pages serviert (öffentliche URL für die Meta-API, JPG-Pflicht).
# Reines Pillow, keine Secrets nötig.

on:
  # schedule:  # PAUSIERT 2026-06-13 (Cron-Nulldiaet — GitHub Fair-Use)
    # 1x täglich morgens Vorrat rendern (Autopilot postet dann gestaffelt).
    # - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Anzahl Produkte pro Lauf'
        default: '5'
      only:
        description: 'Komma-Liste von names neu rendern (Queue unberührt); leer = normaler Batch'
        default: ''

permissions:
  contents: write

concurrency:
  group: image-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Render post images
        env:
          BATCH: ${{ inputs.batch || '5' }}
          ONLY: ${{ inputs.only }}
          OUT_BASE_URL: https://abannews.com
        run: python3 automation/gen_post_image.py
      - name: Commit rendered images + queue
        run: |
          if ! git diff --quiet -- social/ ; then
            git config user.name "luxestyle-image-bot"
            git config user.email "bot@users.noreply.github.com"
            git add social/static social/posts_image.csv automation/.image_pointer
            git commit -m "chore(social): Produkt-Post-Bilder gerendert [skip ci]"
            # Race-sicher: andere Bots pushen staendig auf main → rebase + retry.
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push abgelehnt — rebase + retry ($i/5)"
              git pull --rebase --autostash origin main || true
              sleep 3
            done
          else
            echo "Keine neuen Bilder."
          fi
