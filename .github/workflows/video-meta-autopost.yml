name: Social Meta Video Auto-Post (IG Reels + FB + Threads)

# Postet das nächste fällige VIDEO aus social/video_queue.csv per Meta-Graph-API an
# Instagram (Reels) + Facebook-Page (Video) + Threads (Video). 1 Video pro Lauf (gestaffelt).
# Video wird per ÖFFENTLICHER URL gezogen (GitHub Pages: https://abannews.com/reels/<datei>.mp4).
#
# Tokens NUR aus GitHub-Secrets (identisch zum Bild-Poster):
#   IG_USER_ID + IG_ACCESS_TOKEN (oder META_ACCESS_TOKEN)        → Instagram Business (Reels)
#   FB_PAGE_ID + FB_PAGE_ACCESS_TOKEN (oder META_ACCESS_TOKEN)   → Facebook-Seite (Video)
#   THREADS_USER_ID + THREADS_ACCESS_TOKEN                        → Threads (Video)
# Ohne Secrets = sauberer No-Op.

on:
  # schedule:  # PAUSIERT 2026-06-13 (Cron-Nulldiaet — GitHub Fair-Use)
    # 2×/Tag auf den datengeprüften Top-Reichweiten-Slots: 09:00 & 20:00 UTC (≈ 11:00 / 22:00 CH)
    # (IG-Analyse 11.06.: 09h Ø141 Reach, 20h Ø112 — Reels sind der Reichweiten-Motor → beste Slots.)
    # - cron: '0 9 * * *'
    # - cron: '0 20 * * *'   # PAUSIERT 2026-06-13 (Cron-Diaet) — 1x/Tag reicht
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur testen (nichts posten)'
        type: boolean
        default: true
      approve_publish:
        description: 'Veroeffentlichung der vorbereiteten Inhalte ausdruecklich freigeben'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: video-meta-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Repo enthält viele committete .mp4 → voller Checkout hängt. Shallow + Sparse-Checkout
      # holt nur die fürs Posten nötigen Pfade (Script + Queue) und bleibt schnell.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            automation/video-autopost-meta.mjs
            automation/lib/social_queue.mjs
            social/video_queue.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require a branch for durable publication checkpoints
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Select a branch; publication checkpoints cannot be saved to a tag." >&2
            exit 1
          fi

      - name: Post next video (Meta Graph API)
        id: publish
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SKIP_THREADS: '1'   # Threads NICHT mit Video-Spam fluten (Account geblockt/0 Follower) → eigener Text-Post-Cron
          MAX_PER_RUN: '1'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          APPROVE_PUBLISH: ${{ inputs.approve_publish && '1' || '0' }}
        run: node automation/video-autopost-meta.mjs

      # Save before rebasing: even a failed push or merge conflict must leave recovery evidence.
      - name: Save video queue recovery checkpoint
        if: ${{ always() && steps.publish.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-queue-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: social/video_queue.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit publication checkpoint, including partial failures
        if: ${{ always() && steps.publish.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$(git status --porcelain -- social/video_queue.csv)" ]; then
            git config user.name "luxestyle-autopost-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -- social/video_queue.csv
            git commit -m "chore(social): save publication checkpoint [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
                exit 0
              fi
              if ! git pull --rebase --autostash origin "$TARGET_BRANCH"; then
                echo "Checkpoint rebase failed; recover the queue from the workflow artifact." >&2
                exit 1
              fi
              sleep 3
            done
            echo "Checkpoint push failed after 5 attempts; recover the queue from the workflow artifact." >&2
            exit 1
          else
            echo "Kein Checkpoint-Update."
          fi
