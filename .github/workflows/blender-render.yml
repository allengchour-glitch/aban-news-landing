name: 3D Render (Blender · manuell)

# Bewusst NUR manuell (workflow_dispatch) — kein Cron. Kostet 0 Actions-Minuten,
# bis du hier auf "Run workflow" klickst. Blender + Cycles-CPU (kein GPU nötig).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Was rendern?"
        type: choice
        options: [intro, mug]
        default: intro
      design:
        description: "Nur mug: Pfad zum Design-PNG (z. B. pod/looks/ex-mug-quote.png)"
        type: string
        default: ""
      frames:
        description: "Anzahl Frames (mehr = länger + mehr Minuten)"
        type: string
        default: "48"
      samples:
        description: "Cycles-Samples (mehr = sauberer + langsamer)"
        type: string
        default: "16"
      res:
        description: "Auflösung (quadratisch, px)"
        type: string
        default: "720"

permissions:
  contents: write

concurrency:
  group: blender-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Blender + ffmpeg installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg
          blender --version | head -1

      - name: Szene rendern (Cycles CPU)
        env:
          MODE: ${{ inputs.mode }}
          DESIGN: ${{ inputs.design }}
          FRAMES: ${{ inputs.frames }}
          SAMPLES: ${{ inputs.samples }}
          RES: ${{ inputs.res }}
          OUT: media/3d/frames
        run: |
          mkdir -p media/3d
          rm -f media/3d/frames_*.png
          xvfb-run -a blender -b -noaudio -P blender/render_scene.py || blender -b -noaudio -P blender/render_scene.py
          echo "Gerenderte Frames:"; ls media/3d/frames_*.png | wc -l

      - name: Frames -> Video (mp4 + webm)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -e
          first=$(ls media/3d/frames_*.png | head -1)
          # Padding-Breite automatisch ermitteln
          pad=$(echo "$first" | grep -oE '[0-9]+' | tail -1 | awk '{print length}')
          ffmpeg -y -framerate 30 -i "media/3d/frames_%0${pad}d.png" \
                 -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart \
                 "media/3d/${MODE}.mp4"
          ffmpeg -y -framerate 30 -i "media/3d/frames_%0${pad}d.png" \
                 -c:v libvpx-vp9 -b:v 0 -crf 32 "media/3d/${MODE}.webm"
          # Poster (erstes Frame) als JPG
          ffmpeg -y -i "$first" -frames:v 1 "media/3d/${MODE}-poster.jpg"
          rm -f media/3d/frames_*.png
          ls -la media/3d/

      - name: Ergebnis committen
        run: |
          git config user.name "aban-3d-bot"
          git config user.email "bot@users.noreply.github.com"
          git add media/3d/*.mp4 media/3d/*.webm media/3d/*-poster.jpg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nichts Neues zu committen."
          else
            git commit -m "3D-Render (Blender, ${{ inputs.mode }}): Video aktualisiert [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              sleep $((i*2))
            done
          fi
