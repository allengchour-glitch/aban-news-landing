name: Stripe-Shop (autonom)

# Vollautonomer Shop: baut die Kits, legt sie geschützt ab (gehashter Name),
# erstellt Stripe-Produkte + Bezahllinks per API und schreibt data/shop-products.json.
# Danach ist shop.html live — ohne manuelles Hochladen. EINMALIGE Voraussetzung:
# Secrets STRIPE_API_KEY + DOWNLOAD_SALT (GitHub), und im Cloudflare-Pages-Projekt
# dieselben als Env (für functions/api/kit-download.js).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stripe-shop
  cancel-in-progress: false

jobs:
  shop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kits bauen + Stripe einrichten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          VERTEX_TEXT_MODEL: ${{ vars.VERTEX_TEXT_MODEL }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          DOWNLOAD_SALT: ${{ secrets.DOWNLOAD_SALT }}
        run: |
          pip install --quiet reportlab pillow google-auth requests || true
          # --- Deutsch ---
          SLUGS=$(python3 -c "import json;print(','.join(k['slug'] for k in json.load(open('data/kit-catalog.json'))))")
          python3 automation/generate_branchen_pdfs.py --slugs "$SLUGS" || true
          python3 automation/build_product_pack.py --slugs "$SLUGS"
          # --- English ---
          EN_SLUGS=$(python3 -c "import json;print(','.join(k['slug'] for k in json.load(open('data/kit-catalog-en.json'))))")
          python3 automation/generate_branchen_pdfs.py --all --lang en || true
          python3 automation/build_product_pack.py --lang en --slugs "$EN_SLUGS"
          # Kit-ZIPs werden NICHT mehr hier abgelegt/committet. Sie baut der Deploy selbst
          # (build-pages.sh -> automation/build_kit_zips.py, Salt mit .strip()). Frueher legte
          # dieser Schritt sie mit ungestripptem Salt ab -> falsche Namen (404) und bezahlte
          # Inhalte im oeffentlichen Repo (23.09.: 45 Dateien).
          python3 automation/stripe_sync.py
          python3 automation/stripe_sync.py --catalog data/kit-catalog-en.json \
            --out data/shop-products-en.json --state data/stripe-state-en.json --danke /en/danke-kit.html

      - name: Shop committen
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/shop-products.json data/shop-products-en.json data/stripe-state.json data/stripe-state-en.json 2>/dev/null || true
            git commit -m "Stripe-Shop: Produkte/Links (DE+EN) aktualisiert" || echo "nichts"
            for _i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else
            echo "Keine Änderung."
          fi
