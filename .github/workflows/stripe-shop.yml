name: Stripe-Shop (autonom)

# Vollautonomer Shop: baut die Kits, legt sie geschützt ab (gehashter Name),
# erstellt Stripe-Produkte + Bezahllinks per API und schreibt data/shop-products.json.
# Danach ist shop.html live — ohne manuelles Hochladen. EINMALIGE Voraussetzung:
# Secrets STRIPE_API_KEY + DOWNLOAD_SALT (GitHub), und im Cloudflare-Pages-Projekt
# dieselben als Env (für functions/api/kit-download.js).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stripe-shop
  cancel-in-progress: false

jobs:
  shop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kits bauen + Stripe einrichten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          VERTEX_TEXT_MODEL: ${{ vars.VERTEX_TEXT_MODEL }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          DOWNLOAD_SALT: ${{ secrets.DOWNLOAD_SALT }}
        run: |
          pip install --quiet reportlab pillow google-auth requests || true
          SLUGS=$(python3 -c "import json;print(','.join(k['slug'] for k in json.load(open('data/kit-catalog.json'))))")
          python3 automation/generate_branchen_pdfs.py --slugs "$SLUGS" || true
          python3 automation/build_product_pack.py --slugs "$SLUGS"
          # Kits geschützt ablegen (gehashter Dateiname aus DOWNLOAD_SALT)
          python3 - <<'PY'
          import json, hashlib, os, shutil, pathlib
          salt = os.environ.get("DOWNLOAD_SALT", "")
          out = pathlib.Path("downloads/kits"); out.mkdir(parents=True, exist_ok=True)
          for k in json.load(open("data/kit-catalog.json")):
              s = k["slug"]; src = pathlib.Path(f"downloads/packs/{s}.zip")
              if src.exists():
                  h = hashlib.sha256(f"{s}:{salt}".encode()).hexdigest()[:24]
                  shutil.copy(src, out / f"{h}.zip"); print("staged", s)
          PY
          python3 automation/stripe_sync.py

      - name: Shop committen
        run: |
          if ! git diff --quiet -- data/shop-products.json data/stripe-state.json downloads/kits 2>/dev/null || [ -n "$(git status --porcelain downloads/kits data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/shop-products.json data/stripe-state.json downloads/kits 2>/dev/null || true
            git commit -m "Stripe-Shop: Produkte/Links + geschützte Kits aktualisiert [skip ci]" || echo "nichts"
            git push || echo "::warning::push fehlgeschlagen"
          else
            echo "Keine Änderung."
          fi
