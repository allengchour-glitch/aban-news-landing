name: Tages-Update (KI-News + Maerkte)

# EIN Cron pro Tag fuer die Startseite. Die frueheren Einzel-Crons (news-aggregator,
# markets-build 2x taeglich) sind seit 2026-06-13 pausiert (Cron-Nulldiaet nach der
# Actions-Sperre, s. CLAUDE.md) — seither zeigte die Startseite Kurse vom 12.06. unter „Live".
# Regel aus CLAUDE.md: Crons nur einzeln und hoechstens 1x taeglich. Das ist dieser eine.
#  1. automation/ki_news_heute.py -> data/ki-news.json (echte Quellen, nichts umgeschrieben)
#  2. Übungsdepot: Lern-Bot handelt mit Spielgeld, eigene Statistik (tools/trading/papier_depot.py)
#  3. markets-build.yml (Kurse, Finanz-News, optional KI-Sentiment) — aufgerufen, nicht kopiert
# Beides committet nur bei Aenderung, mit [skip ci]. Die Seite geht mit dem naechsten Deploy live.
on:
  schedule:
    - cron: '15 4 * * *'   # taeglich 04:15 UTC = 06:15 Uhr Schweizer Sommerzeit
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # ki-bot-schatten startet den Deploy (Bot-Commits lösen keinen aus)

concurrency:
  group: tages-update
  cancel-in-progress: false

jobs:
  ki-news:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: KI-News sammeln
        run: python automation/ki_news_heute.py
      - name: data/ki-news.json committen (falls geaendert)
        run: |
          git add data/ki-news.json
          if ! git diff --cached --quiet; then
            git config user.name "aban-news-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "chore(ki-news): Meldungen des Tages [skip ci]"
            for _i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else
            echo "Keine Aenderung."
          fi

  # Übungsdepot: der Lern-Bot handelt täglich mit Spielgeld und führt Buch über sich selbst
  # (tools/trading/papier_depot.py -> data/papierdepot.json). Zuerst die Gegenprobe: stimmt die
  # Buchführung nicht (ehrlich ~50 %, mit Blick in die Zukunft ~100 %), wird NICHTS geschrieben.
  uebungsdepot:
    needs: ki-news
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gegenprobe der Buchführung (Rückblick 250 Tage)
        run: python tools/trading/papier_depot.py --pruefen
      - name: Heute abrechnen und neu entscheiden
        run: python tools/trading/papier_depot.py
      - name: data/papierdepot.json committen (falls geaendert)
        run: |
          git add data/papierdepot.json
          if ! git diff --cached --quiet; then
            git config user.name "aban-news-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "chore(uebungsdepot): Entscheidungen + eigene Statistik des Tages [skip ci]"
            for _i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else
            echo "Keine Aenderung."
          fi

  # KI-Bot + Krypto-Pilot im Schattenbuch: NUR Spielgeld, KEINE Broker-Schlüssel, keine Secrets (User 2026-10-12:
  # „Spielgeld-Lauf auf GitHub"). bot.py --lauf macht zuerst seinen Selbsttest (schlägt er fehl: nichts geschrieben).
  # pilot_schatten.py führt die Entscheide des Krypto-Piloten als Vorwärtstest nach (tools/trading/schatten/).
  ki-bot-schatten:
    needs: uebungsdepot
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests (Schattenbuch + KI-Bot)
        run: |
          python tools/trading/schatten/test_pilot_schatten.py
          node tools/trading/schatten/test_tagebuch.js
          python tools/trading/krypto_bot/test_carry.py
          python tools/trading/krypto_bot/test_pilot2_plan.py
          python tools/trading/krypto_bot/test_pilot2_live.py
          python tools/trading/krypto_bot/test_pilot2_streng.py
          python tools/trading/ki_bot/test_ki_bot.py
      - name: KI-Bot Tages-Depot (Spielgeld)
        # data/ki-bot.json ist gitignored (gehört dem PC). Der GitHub-Lauf führt sein eigenes Logbuch
        # data/ki-bot-schatten.json: vorher zurückkopieren, nachher sichern.
        run: |
          if [ -f data/ki-bot-schatten.json ]; then cp data/ki-bot-schatten.json data/ki-bot.json; fi
          python tools/trading/ki_bot/bot.py --lauf
          cp data/ki-bot.json data/ki-bot-schatten.json
      - name: Krypto-Pilot Schattenbuch (Spielgeld)
        if: always()
        run: python tools/trading/schatten/pilot_schatten.py --lauf
      - name: Logbücher committen (falls geaendert)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in data/ki-bot-schatten.json data/krypto-pilot-schatten.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git config user.name "aban-news-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "chore(ki-bot): Spielgeld-Logbücher des Tages [skip ci]"
            git stash --include-untracked || true
            for _i in 1 2 3 4 5; do git push && break; git pull --rebase origin main || true; sleep 3; done
            # Pushes mit dem Actions-Token lösen keinen Deploy aus → ki-bot-tagebuch.html zeigte sonst alte Zahlen
            gh workflow run cf-deploy-mainsite.yml --ref main && echo "Deploy gestartet." || echo "::warning::Deploy nicht gestartet"
          else
            echo "Keine Aenderung."
          fi

  maerkte:
    needs: [ki-news, uebungsdepot]
    if: always()
    uses: ./.github/workflows/markets-build.yml
    secrets: inherit
