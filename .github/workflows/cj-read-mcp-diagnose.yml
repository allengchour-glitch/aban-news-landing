name: "CJ-MCP-Diagnose (nur lesen)"

# Prüft ausschliesslich den eng begrenzten CJ-Nur-Lese-MCP an einem fixierten Commit.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Prüfmodus'
        type: choice
        options:
          - cj_mcp
        default: cj_mcp
        required: true
      approved_commit:
        description: 'Nur cj_mcp: freigegebener 40-stelliger Commit des gewählten Refs'
        type: string
        required: true
        default: ''
      operation:
        description: 'Nur cj_mcp: product, inventory oder route (fest CN→CH)'
        type: choice
        options:
          - product
          - inventory
          - route
        default: product
        required: true
      pid:
        description: 'CJ-PID; inventory verlangt nur PID, route PID plus variantSku'
        type: string
        required: false
      productSku:
        description: 'CJ-productSku; product verlangt genau einen Schlüssel'
        type: string
        required: false
      variantSku:
        description: 'CJ-variantSku; product verlangt genau einen Schlüssel, route zusätzlich PID'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cj-read-mcp-diagnose-${{ github.repository }}-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  cj_mcp:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'cj_mcp' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fixierten Auftrag prüfen
        shell: bash
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          CJ_MCP_OPERATION: ${{ inputs.operation }}
          CJ_MCP_PID: ${{ inputs.pid }}
          CJ_MCP_PRODUCT_SKU: ${{ inputs.productSku }}
          CJ_MCP_VARIANT_SKU: ${{ inputs.variantSku }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = allengchour-glitch/aban-news-landing
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_COMMIT" = "$GITHUB_SHA"
          [[ "$CJ_MCP_OPERATION" == product || "$CJ_MCP_OPERATION" == inventory || "$CJ_MCP_OPERATION" == route ]]
          if [[ "$CJ_MCP_OPERATION" == inventory ]]; then
            if [[ -z "$CJ_MCP_PID" || -n "$CJ_MCP_PRODUCT_SKU" || -n "$CJ_MCP_VARIANT_SKU" ]]; then
              echo 'inventory verlangt genau eine PID und keine SKU.' >&2
              exit 1
            fi
          elif [[ "$CJ_MCP_OPERATION" == route ]]; then
            if [[ -z "$CJ_MCP_PID" || -n "$CJ_MCP_PRODUCT_SKU" || -z "$CJ_MCP_VARIANT_SKU" ]]; then
              echo 'route verlangt genau PID plus variantSku und keine productSku; Start CN und Ziel CH sind fest.' >&2
              exit 1
            fi
          else
            lookup_count=0
            [[ -n "$CJ_MCP_PID" ]] && lookup_count=$((lookup_count + 1))
            [[ -n "$CJ_MCP_PRODUCT_SKU" ]] && lookup_count=$((lookup_count + 1))
            [[ -n "$CJ_MCP_VARIANT_SKU" ]] && lookup_count=$((lookup_count + 1))
            if [[ "$lookup_count" -ne 1 ]]; then
              echo 'product verlangt genau PID, productSku oder variantSku.' >&2
              exit 1
            fi
          fi
          if [[ -n "$CJ_MCP_PRODUCT_SKU" ]]; then [[ "$CJ_MCP_PRODUCT_SKU" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; fi
          if [[ -n "$CJ_MCP_VARIANT_SKU" ]]; then [[ "$CJ_MCP_VARIANT_SKU" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$ ]]; fi

      - name: Freigegebenen Commit minimal auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.approved_commit }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .mcp.json
            automation/cj-read-mcp.mjs
            automation/cj-read-mcp-probe.mjs
            automation/lib/claude_assist_mcp.mjs
            automation/lib/cj_identity.mjs
            automation/lib/cj_read_mcp.mjs
            automation/lib/cj_readonly.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Commit und geprüfte Dateien gegenlesen
        shell: bash
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
          cat <<'HASHES' | sha256sum -c -
          c3a9261eacab5cfbee7a3a613347cf2d0255e3a3d0e93b44b6febb0d18a23e9d  .mcp.json
          ef986b11c17d707aa78208c2fd51d4b35486a86e85c2883618daa2e8f8c80ffc  automation/cj-read-mcp.mjs
          43d89ba572b4b80d56d8d2e9a6a04bbec8f52f35a509e4547c0727b52329d19f  automation/cj-read-mcp-probe.mjs
          228be1d0783fb688e2f6971f39fd6a29457a24138bc5242de2f648345793a671  automation/lib/claude_assist_mcp.mjs
          1fef93809ba5e8cf2204203abdf3d38ee1ebedbb833167f50a78b8ad1fce024b  automation/lib/cj_identity.mjs
          592c7e22a2159552adb79eb5ac36cbf14665fc1b989d829a485a00c4ac0da467  automation/lib/cj_read_mcp.mjs
          36b61e9afd547ffd929c7d9b7d47f32df7faee1dd9401b365d8bd3212526bbed  automation/lib/cj_readonly.mjs
          HASHES

      - name: PID mit zentralem Validator prüfen
        if: ${{ inputs.pid != '' }}
        env:
          CJ_MCP_PID: ${{ inputs.pid }}
        run: node --input-type=module -e "import { isValidCjPid } from './automation/lib/cj_identity.mjs'; if (!isValidCjPid(process.env.CJ_MCP_PID)) process.exit(1)"

      - name: CJ-MCP einmalig nur lesend prüfen
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_MCP_OPERATION: ${{ inputs.operation }}
          CJ_MCP_PID: ${{ inputs.pid }}
          CJ_MCP_PRODUCT_SKU: ${{ inputs.productSku }}
          CJ_MCP_VARIANT_SKU: ${{ inputs.variantSku }}
        run: node automation/cj-read-mcp-probe.mjs
