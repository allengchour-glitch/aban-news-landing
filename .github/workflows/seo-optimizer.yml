name: SEO-Optimizer (wöchentlich, fehlende Produkt-SEO füllen)

# Füllt NUR die fehlenden SEO-Felder aktiver Produkte (deutsch, CH; es gehen immer beide Felder raus, Vorhandenes bleibt bytegleich) + meldet FAILED-Bilder.
# Braucht Produkt-Scopes am Shopify-Token (read_products, write_products). Seit 19.10.2026 (v2) stoppt Unklares (fehlender Scope, Netz, falsche Antwort,
# Rücklese-Abweichung) den Lauf mit Exit 1 = ROTER Lauf — früher zählte es als «gefüllt» mit Exit 0; Exit 2 = Konfiguration (SHOPIFY_SHOP, LIMIT, DRY_RUN)
# ohne Netzanfrage. Die Werbetest-Sperre (dropship/_werbetest_sperre.txt, bis 24.10.) wird beachtet. Je Produkt 3 Anfragen (Gegenprobe, Schreiben, Rücklesen):
# gemessen 19.10. Scan bis 150 Lücken 3 min 19 s + Schreiben ~3 min → timeout-minutes 10 → 20. Dazu eine Lese-Anfrage für die Bild-QA der 100 neuesten Produkte
# (FAILED-Bilder; schlägt sie fehl, ist der Lauf rot — «unklar», nie «keine FAILED-Bilder»). Nur ZUSAMMEN mit automation/lib/werbetest_sperre.mjs und
# dropship/_werbetest_sperre.txt nach main bringen (Kopfkommentar «ÜBERNAHME» in automation/seo-optimizer.mjs); ohne sie bricht der Lauf laut ab.

on:
  # schedule:  # PAUSIERT 2026-06-13 (Cron-Nulldiaet — GitHub Fair-Use)
    # - cron: '0 6 * * 1'   # Montags 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEO füllen
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIMIT: '150'
        run: node automation/seo-optimizer.mjs
