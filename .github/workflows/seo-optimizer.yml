name: SEO-Optimizer (wöchentlich, fehlende Produkt-SEO füllen)

# Füllt automatisch fehlende SEO-Titel/-Metas aktiver Produkte (deutsch, CH) + meldet FAILED-Bilder.
# Braucht Produkt-Scopes am Shopify-Token (read_products, write_products). Ohne = sauberer No-Op/Log.

on:
  schedule:
    - cron: '0 6 * * 1'   # Montags 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEO füllen
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIMIT: '150'
        run: node automation/seo-optimizer.mjs
