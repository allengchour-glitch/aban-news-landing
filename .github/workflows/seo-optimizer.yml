name: LuxeStyle SEO-Vorschläge (manuell)

# Nur lesen und konkrete Vorschläge erzeugen. Keine Shop-Writes, Nachrichten oder Cron-Aktivierung.
on:
  workflow_dispatch:
    inputs:
      product_ids:
        description: '1–6 geprüfte LuxeStyle-Produkt-IDs, kommagetrennt'
        required: true
        type: string

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Begrenzte SEO-Vorschläge ohne Shop-Schreibzugriff
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          PRODUCT_IDS: ${{ inputs.product_ids }}
          SCAN_LIMIT: '6'
          LIMIT: '6'
          DRY_RUN: '1'
          APPLY_SEO_APPROVED: '0'
        run: node automation/seo-optimizer.mjs > seo-vorschlaege.json
      - name: Vorschläge und unbekannte Antworten als Prüfbeleg sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: luxestyle-seo-vorschlaege-${{ github.run_id }}
          path: seo-vorschlaege.json
          if-no-files-found: warn
          retention-days: 7
