name: Reel Auto-Post (alle 4 Stunden 1 Reel)

# Selbstgemachtes Automatik-Tool (wie cj-autopilot.yml + analog abannews social/post.py):
# postet alle 4h das nächste freigegebene Reel (status=ready) aus automation/reels_seed.csv
# und markiert die Zeile als posted (Commit zurück ins Repo). KEIN Make nötig.
#
# Kanäle (Repository-Secrets, Settings → Secrets and variables → Actions; mind. einer):
#   PUBLISH_WEBHOOK_URL = generischer Webhook → n8n (gratis, self-hosted) → TikTok + Instagram
#                         (n8n-Workflow im Repo: social/n8n-publish-workflow.json)
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID = direkte Telegram-Meldung (Zero-Relay)
#   MAKE_REEL_WEBHOOK   = Legacy-Alias (optional, falls doch Make)
# Ohne jeden Secret = sauberer No-Op (nichts passiert, kein Fehler).
# Reels müssen unter reels/<slug>.mp4 liegen (GitHub Pages, öffentlich) und in reels_seed.csv
# mit status=ready stehen (Freigabe setzt ready).

on:
  # schedule:  # PAUSIERT 2026-06-13 (Cron-Nulldiaet — GitHub Fair-Use)
    # - cron: '0 13 * * *'   # 13:00 UTC — versetzt, damit der 09:00-Top-Slot dem Meta-Reel-Poster gehört
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur anzeigen, was gepostet wuerde (Vorgabe: ja)'
        type: boolean
        required: false
        # ⚠️ 17.09.2026 von false auf true gedreht. Gemessen: auf origin/main liegen
        # WEDER automation/post_guard.mjs NOCH dropship/_SOCIAL_STOPP
        # (git ls-tree origin/main … → 0 Zeilen; Gegenprobe mit social-autopost-meta.mjs
        # → Treffer, das Werkzeug kann also finden). Ein Klick auf «Run workflow» hat
        # damit auf main OHNE jede der sechs Doppelpost-Wachen gepostet und ohne den
        # Stopp zu sehen. Der Zeitplan ist zwar seit 13.06. auskommentiert — es ist keine
        # tickende Bombe, sondern ein geladener Knopf. Ein Vorgabewert, der im
        # Zweifel postet, ist die falsche Vorgabe.
        default: true

permissions:
  contents: write

concurrency:
  group: reel-autopost
  cancel-in-progress: false

jobs:
  post:
    name: Nächstes Reel posten
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Post next ready reel
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          PUBLISH_WEBHOOK_URL: ${{ secrets.PUBLISH_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKE_REEL_WEBHOOK: ${{ secrets.MAKE_REEL_WEBHOOK }}
        run: node automation/post-next-reel.mjs

      - name: Commit status update (falls etwas gepostet wurde)
        run: |
          if ! git diff --quiet -- automation/reels_seed.csv; then
            git config user.name  "reel-autopost-bot"
            git config user.email "actions@users.noreply.github.com"
            git add automation/reels_seed.csv
            git commit -m "reel-autopost: Reel als posted markiert [skip ci]"
            for _i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else
            echo "Keine Änderung an der Queue — nichts zu committen."
          fi
