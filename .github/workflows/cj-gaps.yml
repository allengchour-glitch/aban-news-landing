name: "POD Marktluecken-Import (Grill/Auto aus CJ)"

# Sucht CJ-Produkte zu Katalog-Luecken, legt sie sauber an + Smart-Collections. No-op ohne Creds. Idempotent.

on:
  workflow_dispatch:
    inputs:
      cats:
        description: 'Kategorien (Komma): grill,auto'
        type: string
        default: 'grill,auto'
      per:
        description: 'Produkte je Kategorie'
        type: string
        default: '4'
      dry_run:
        description: 'Nur suchen + Kandidaten listen (nichts anlegen)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pod-cj-gaps
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Marktluecken importieren
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATS: ${{ github.event.inputs.cats }}
          PER: ${{ github.event.inputs.per }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node automation/cj_gaps_import.mjs
      - name: Ledger committen
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain dropship/cj_gaps_done.txt)" ]; then
            git config user.name "luxestyle-autopilot"; git config user.email "bot@users.noreply.github.com"
            git add dropship/cj_gaps_done.txt
            git commit -m "POD: Marktluecken-Import Ledger [skip ci]"
            for i in 1 2 3 4 5; do git push origin HEAD:main && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else echo "kein Ledger-Update"; fi
