name: Pinterest Autopost
on:
  schedule:
    - cron: '20 7,17 * * *'   # 2x/Tag (nur LIVE, wenn PINTEREST_ACCESS_TOKEN gesetzt)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur testen (nichts posten)'
        type: boolean
        default: false

concurrency:
  group: pinterest-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pins posten
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node automation/pinterest-autopost.mjs
      - name: Queue/Ledger zurückschreiben
        run: |
          git config user.name "luxestyle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add social/pinterest_queue.csv social/pinned-done.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Pinterest: Queue-Status aktualisiert [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          else
            echo "Keine Änderungen."
          fi
