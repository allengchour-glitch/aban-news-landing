# name: YouTube auto-publish (Hasen-Lifestyle) — BEENDET 2026-06-07
#
# DEAKTIVIERT auf Wunsch des Users ("hase lifestyle short bei youtube beenden").
# Diese Pipeline lud alle 2 Tage einen Bunny-/Lifestyle-Clip aus video-prototypes/
# via scripts/yt_upload.py auf YouTube. Der automatische Zeitplan (cron) ist entfernt,
# damit KEINE neuen Hasen-Shorts mehr gepostet werden.
#
# Nur noch manuell startbar (workflow_dispatch), falls je wieder gebraucht.
# Voraussetzung waeren weiterhin: YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN.

name: YouTube auto-publish (Hasen-Lifestyle) [BEENDET]

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Wie viele Clips jetzt hochladen (nur manuell)"
        default: "1"
  # schedule ENTFERNT — kein Auto-Posting der Hasen-Shorts mehr.

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2
      - name: Upload next clip(s)
        working-directory: video-prototypes
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 scripts/yt_upload.py --immediate --next "${{ github.event.inputs.count || 1 }}"
      - name: Persist upload state
        working-directory: video-prototypes
        run: |
          git add uploaded.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "yt: Upload-Fortschritt"
            git push
          else
            echo "kein neuer Upload."
          fi
