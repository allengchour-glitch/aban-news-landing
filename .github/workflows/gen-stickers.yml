name: Sticker-Bibliothek generieren (Gemini)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Nur diese Namen (Komma) – leer = alle'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: gen-stickers
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sticker generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        run: node automation/gen_stickers.mjs
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain social/stickers/)" ]; then
            git config user.name "luxestyle-autopilot"; git config user.email "bot@users.noreply.github.com"
            git add social/stickers/
            git commit -m "Sticker-Bibliothek: Gemini-Sticker generiert [skip ci]"
            for i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else echo "keine neuen Sticker"; fi
