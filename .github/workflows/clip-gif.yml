name: Clip-GIF-Vorschau

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Nur diese Clip-Namen (Komma), leer = alle reels/clip-*.mp4'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: clip-gif
  cancel-in-progress: false

jobs:
  gif:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y ffmpeg
      - name: MP4 → GIF
        run: |
          mkdir -p reels/preview
          for f in reels/clip-*.mp4; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .mp4)
            out="reels/preview/${base}.gif"
            ffmpeg -nostdin -y -i "$f" -vf "fps=12,scale=380:-1:flags=lanczos,palettegen" -frames:v 1 /tmp/pal.png 2>/dev/null
            ffmpeg -nostdin -y -i "$f" -i /tmp/pal.png -lavfi "fps=12,scale=380:-1:flags=lanczos[x];[x][1:v]paletteuse" -loop 0 "$out" 2>/dev/null
            echo "✓ $out ($(du -h "$out" | cut -f1))"
          done
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain reels/preview/)" ]; then
            git config user.name "luxestyle-autopilot"; git config user.email "bot@users.noreply.github.com"
            git add reels/preview/
            git commit -m "Clip-GIF-Vorschauen [skip ci]"
            for i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else echo "keine GIFs"; fi
