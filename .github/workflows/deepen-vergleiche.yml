name: Vergleiche vertiefen (Gemini)

# Vertieft Tool-Vergleichsseiten (vergleich/*.html) mit ehrlicher Entscheidungshilfe + FAQ (Gemini).
# NUR manuell auslösbar (kein Cron) — du steuerst Tempo/Charge selbst. No-op ohne GEMINI_API_KEY.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Wie viele Vergleichsseiten pro Lauf vertiefen'
        default: '45'

permissions:
  contents: write

concurrency:
  group: deepen-vergleiche
  cancel-in-progress: false

jobs:
  deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vergleiche vertiefen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          VERTEX_TEXT_MODEL: ${{ vars.VERTEX_TEXT_MODEL }}
          ABAN_DEEP_BATCH: ${{ inputs.batch }}
        run: python3 automation/deepen_vergleiche_gemini.py
      - name: Sichern (race-sicher)
        run: |
          if ! git diff --quiet -- 'vergleich/*.html'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add vergleich/*.html
            git commit -m "Vergleiche vertieft (Gemini) [skip ci]"
            for _i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          else
            echo "Keine Aenderung."
          fi
