name: LuxeStyle Android-App bauen

# Nur manuell starten (Cron-Regel: keine automatischen Läufe, siehe CLAUDE.md).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versionsname, z. B. 1.0.1"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/luxestyle-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Upload-Schlüssel aus Secret holen
        env:
          KEYSTORE_B64: ${{ secrets.LUXE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret LUXE_KEYSTORE_B64 fehlt – siehe apps/luxestyle-android/PLAY-STORE.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Tests, Lint und signiertes Bundle
        env:
          LUXE_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          LUXE_KEYSTORE_PASSWORD: ${{ secrets.LUXE_KEYSTORE_PASSWORD }}
          LUXE_KEY_ALIAS: upload
          LUXE_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          # Jede Play-Version braucht einen höheren versionCode; 1 ist die erste Hand-Hochladung.
          export LUXE_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          ./gradlew --no-daemon testReleaseUnitTest lintRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: luxestyle-${{ inputs.version_name }}-${{ github.run_number }}
          path: apps/luxestyle-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
