name: Reel Analytics (Täglicher Telegram-Report + Tagesreel)

# Schickt TÄGLICH einen Report (Bestellungen/Umsatz + Reel-Queue) per Telegram — plus 1 Reel als Video.
# Secrets (optional): SHOPIFY_SHOP, SHOPIFY_ADMIN_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Ohne Secrets = nur Log, kein Fehler.

on:
  schedule:
    - cron: '0 7 * * *'   # täglich 07:00 UTC (~09:00 CH)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analytics-Report
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAYS: '7'
        run: node automation/reel-analytics.mjs
