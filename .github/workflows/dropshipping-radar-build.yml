name: Dropshipping-Radar — Auto-Build

on:
  push:
    paths:
      - 'dropshipping-radar/**'
  workflow_dispatch:

jobs:
  build:
    name: Generate dropshipping directory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate site
        run: |
          cd dropshipping-radar
          python generate.py
          find dist -type f | wc -l
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropshipping-radar-dist
          path: dropshipping-radar/dist
          retention-days: 14
