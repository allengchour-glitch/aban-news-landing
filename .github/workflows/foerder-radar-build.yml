name: Förder-Radar — Auto-Build

on:
  schedule:
    - cron: '0 7 * * 1'        # Montags 07:00 UTC
  push:
    paths:
      - 'foerder-radar/**'
  workflow_dispatch:

jobs:
  build:
    name: Generate funding directory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate site
        run: |
          cd foerder-radar
          python generate.py
          find dist -type f | wc -l
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foerder-radar-dist
          path: foerder-radar/dist
          retention-days: 14
