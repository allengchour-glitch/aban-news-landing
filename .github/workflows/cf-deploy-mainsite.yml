name: Cloudflare Pages — Hauptseite (abannews) Direct-Upload

# Deployt die Haupt-Website (inkl. functions/ = Edge-API) als Direct-Upload zu einem
# eigenen Cloudflare-Pages-Projekt. Berührt NICHT die Live-Domain abannews.com — das
# Ergebnis liegt zunächst nur auf <projekt>.pages.dev. So lässt sich die Edge-API
# (KI-Studio, /api/*) live testen, bevor die Domain umgezogen wird.
#
# Nutzt die vorhandenen Repo-Secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# (Preflight 11.06.: Token „voll einsatzbereit", Pages-Deploy + DNS möglich).
# Manuell starten: Actions → diesen Workflow → Run.

on:
  # Auto-Deploy bei Inhalts-Pushes (schwere/nicht-öffentliche Pfade ignoriert,
  # damit Dropship-/Social-/Memory-Commits keinen Deploy auslösen).
  push:
    branches: [main]
    paths-ignore:
      - 'dropship/**'
      - 'social/**'
      - 'video-prototypes/**'
      - 'reels/**'
      - 'automation/**'
      - 'tools/**'
      - 'linkedin/**'
      - 'reports/**'
      - 'mediakit/**'
      - 'ki-tools-radar/**'
      - 'ki-schriftsteller/**'
      - '**/*.md'
      - '.github/**'
  # Sicherheitsnetz: regelmäßig deployen (fängt auch Bot-Commits mit [skip ci]
  # ab, z. B. frische Märkte-Daten).
  # schedule:  # PAUSIERT 2026-06-13 (Cron-Nulldiaet — GitHub Fair-Use)
    # - cron: '20 */6 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Cloudflare-Pages-Projektname'
        required: true
        default: 'abannews'

permissions:
  contents: read

concurrency:
  group: cf-mainsite-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build (clean) + Direct Upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ github.event.inputs.project || 'abannews' }}
    steps:
      - name: Token-Gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN fehlt — Repo-Secret setzen."; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # ⚠️ Frueher kopierte dieser Schritt das Repo per rsync selbst. Das wich vom Server-Build ab:
      # ohne inject-engine (Navigation + JSON-LD fehlten), ohne Kit-ZIP-Bau, und server/ + game/
      # wurden mit veroeffentlicht. Jetzt DERSELBE Build wie auf dem Server (build-pages.sh).
      - name: Seite bauen wie der Server (build-pages.sh -> _site)
        env:
          DOWNLOAD_SALT: ${{ secrets.DOWNLOAD_SALT }}
        run: bash build-pages.sh
      - name: Pages-Projekt anlegen (idempotent)
        run: npx --yes wrangler@3 pages project create "${{ env.PROJECT }}" --production-branch=main || true

      - name: Anthropic-Key ins Pages-Projekt schreiben (falls GitHub-Secret gesetzt)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@3 pages secret put ANTHROPIC_API_KEY --project-name="${{ env.PROJECT }}"
            echo "ANTHROPIC_API_KEY ins Pages-Projekt geschrieben (Wert nie ausgegeben)."
          else
            echo "Kein GitHub-Secret ANTHROPIC_API_KEY — KI-Tools bleiben im 503-Fallback."
          fi

      - name: Deploy (Direct Upload)
        run: npx --yes wrangler@3 pages deploy _site --project-name="${{ env.PROJECT }}" --branch=main

      # ⚠️ GEMESSEN 2026-09-23: interne .md-Dateien (CLAUDE.md, SHARED-MEMORY.md …) sind seit #2531
      # nicht mehr im Deploy (mit ?cache-buster: 404) — aber bereits abgerufene URLs hielt der
      # Cloudflare-Cache weiter (s-maxage=604800 = 7 Tage). Dieser Schritt wirft sie aus dem Cache.
      # Braucht am Token „Zone: Cache Purge" + „Zone: Read"; fehlt das, nur ein Hinweis, kein Fehler.
      - name: Cache der internen Notizen leeren
        continue-on-error: true
        run: |
          ZONE=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=abannews.com" | python3 -c "import json,sys;r=json.load(sys.stdin).get('result') or [];print(r[0]['id'] if r else '')")
          if [ -z "$ZONE" ]; then echo "::warning::Zone abannews.com nicht lesbar (Token ohne Zone:Read) — Cache nicht geleert."; exit 0; fi
          { git ls-files '*.md' | grep -v '^downloads/'; git ls-files 'content/*'; } | python3 -c "
          import json,sys
          urls=['https://abannews.com/'+l.strip() for l in sys.stdin if l.strip()]
          for i in range(0,len(urls),30): print(json.dumps({'files':urls[i:i+30]}))" > /tmp/purge.jsonl
          ok=0; n=0
          while read -r body; do
            n=$((n+1))
            r=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "$body" "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache")
            echo "$r" | grep -q '"success":true' && ok=$((ok+1)) || echo "::warning::Purge-Antwort: $(echo "$r" | head -c 300)"
          done < /tmp/purge.jsonl
          echo "Cache-Purge: $ok von $n Paketen ok ($(git ls-files '*.md' | grep -vc '^downloads/') interne .md-URLs, je 30 pro Paket)"
      - name: Hinweis
        run: |
          echo "Fertig. Öffne https://${{ env.PROJECT }}.pages.dev/"
          echo "API-Test:  curl -X POST https://${{ env.PROJECT }}.pages.dev/api/pro-validate -H 'content-type: application/json' -d '{\"license_key\":\"x\"}'"
          echo "Für die KI-Tools fehlt noch das Pages-Secret ANTHROPIC_API_KEY (im CF-Dashboard des Projekts)."
