name: KI-Verzeichnis — Auto-Build

# Baut neu, wenn das Verzeichnis ODER irgendein Radar-Datensatz sich ändert
# (das Verzeichnis aggregiert alle Radars + data/tools.json).
on:
  push:
    paths:
      - 'ki-verzeichnis/**'
      - '*-radar/data/anbieter.json'
      - 'data/tools.json'
  workflow_dispatch:

jobs:
  build:
    name: Generate KI-Tools directory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate site
        run: |
          cd ki-verzeichnis
          python generate.py
          find dist -type f | wc -l
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ki-verzeichnis-dist
          path: ki-verzeichnis/dist
          retention-days: 14

      # --- Deploy nach Cloudflare Pages (nur auf main, nur mit Secret) ---
      - name: Ensure Cloudflare Pages project exists
        if: ${{ github.ref == 'refs/heads/main' && env.CF_API_TOKEN != '' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages project create ki-verzeichnis --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: ${{ github.ref == 'refs/heads/main' && env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy ki-verzeichnis/dist --project-name=ki-verzeichnis --branch=main
      - name: Hinweis, wenn Secrets fehlen
        if: ${{ github.ref == 'refs/heads/main' && env.CF_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN nicht gesetzt — Deploy übersprungen (Build ok)."
          echo "Danach Custom Domain tools.abannews.com im CF-Dashboard zuordnen."
