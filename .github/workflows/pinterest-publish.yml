name: Pinterest Auto-Publish (Pins aus CSV)

# Veröffentlicht Pins aus dropship/pinterest_pins.csv über die Pinterest-API v5.
# Legt fehlende Boards an, ist idempotent (Ledger dropship/pinterest_done.txt) und
# postet gedrosselt N Pins pro Lauf (Standard 5 = Wochenplan, kein Spam).
# Benötigt Secret PINTEREST_ACCESS_TOKEN (Scopes boards:read/write, pins:read/write).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Neue Pins pro Lauf'
        required: false
        default: '5'
      dry_run:
        description: 'Nur testen (true/false)'
        required: false
        default: 'false'
  # schedule:  # PAUSIERT 2026-06-13 (Cron-Nulldiaet — GitHub Fair-Use)
    # - cron: '0 9 * * 1,4'   # Mo & Do 09:00 UTC — passt zum "2×/Woche je 5 Pins"

permissions:
  contents: write

concurrency:
  group: pinterest-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pins veröffentlichen
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
        run: |
          node automation/pinterest_publish.mjs \
            --limit "${{ github.event.inputs.limit || '5' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Ledger committen
        run: |
          if [ -n "$(git status --porcelain dropship/pinterest_done.txt)" ]; then
            git config user.name  "pinterest-bot"
            git config user.email "actions@users.noreply.github.com"
            git add dropship/pinterest_done.txt
            git commit -m "pinterest-publish: Ledger aktualisiert [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "Keine neuen Pins — nichts zu committen."
          fi
