name: LuxeStyle automation tests

on:
  pull_request:
    paths:
      - 'automation/lib/**'
      - 'automation/seo-optimizer.mjs'
      - 'automation/metricool-schedule.mjs'
      - 'automation/price_guard.mjs'
      - 'automation/cross_sell.mjs'
      - 'automation/lieferbarkeit_guard.mjs'
      - 'automation/image-audit.mjs'
      - 'automation/titel_deutsch_fix.mjs'
      - 'automation/shop_brain.mjs'
      - 'automation/publish_guard.mjs'
      - 'automation/cj_reviews_import.mjs'
      - 'automation/video-autopost-meta.mjs'
      - 'automation/review_safety_test.mjs'
      - 'automation/metricool_checkpoint_test.mjs'
      - 'automation/meta_checkpoint_test.mjs'
      - 'automation/cj_import_checkpoint_test.mjs'
      - 'automation/social_queue_test.mjs'
      - 'automation/publish_guard_test.mjs'
      - 'automation/content_preflight.py'
      - 'automation/test_content_preflight.py'
      - 'automation/fortura_galaxus_lauf.mjs'
      - 'automation/lib/galaxus_treffer.mjs'
      - 'automation/lib/galaxus_treffer_test.mjs'
      - 'automation/fortura_preis_kandidaten.mjs'
      - 'automation/fortura_preisvergleich.mjs'
      - 'automation/fortura_preisvergleich_test.mjs'
      - 'automation/cj_video_produkte.mjs'
      - 'automation/lib/cj_video.mjs'
      - 'automation/lib/cj_video_test.mjs'
      - 'dropship/cj_enrich.mjs'
      - 'dropship/cj_enrich_test.mjs'
      - 'dropship/ads/render_brand_video.py'
      - 'dropship/ads/test_render_brand_video.py'
      - '.github/workflows/luxestyle-automation-tests.yml'
      - '.github/workflows/video-meta-autopost.yml'
      - '.github/workflows/cj-reviews.yml'
      - '.github/workflows/metricool-schedule.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            automation/lib
            automation/seo-optimizer.mjs
            automation/metricool-schedule.mjs
            automation/price_guard.mjs
            automation/cross_sell.mjs
            automation/lieferbarkeit_guard.mjs
            automation/image-audit.mjs
            automation/titel_deutsch_fix.mjs
            automation/shop_brain.mjs
            automation/publish_guard.mjs
            automation/cj_reviews_import.mjs
            automation/video-autopost-meta.mjs
            automation/review_safety_test.mjs
            automation/metricool_checkpoint_test.mjs
            automation/meta_checkpoint_test.mjs
            automation/cj_import_checkpoint_test.mjs
            automation/social_queue_test.mjs
            automation/publish_guard_test.mjs
            automation/content_preflight.py
            automation/test_content_preflight.py
            automation/fortura_galaxus_lauf.mjs
            automation/lib/galaxus_treffer.mjs
            automation/lib/galaxus_treffer_test.mjs
            automation/fortura_preis_kandidaten.mjs
            automation/fortura_preisvergleich.mjs
            automation/fortura_preisvergleich_test.mjs
            automation/cj_video_produkte.mjs
            automation/lib/cj_video.mjs
            automation/lib/cj_video_test.mjs
            dropship/cj_enrich.mjs
            dropship/cj_enrich_test.mjs
            dropship/ads/render_brand_video.py
            dropship/ads/test_render_brand_video.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Renderer stays text-only (no rendering or network)
        run: python3 -B -m unittest -v dropship/ads/test_render_brand_video.py
      - name: Syntax
        run: |
          node --check automation/cj_reviews_import.mjs
          node --check dropship/cj_enrich.mjs
          node --check automation/publish_guard.mjs
          node --check automation/cross_sell.mjs
          node --check automation/lieferbarkeit_guard.mjs
          node --check automation/image-audit.mjs
          node --check automation/titel_deutsch_fix.mjs
          node --check automation/shop_brain.mjs
          node --check automation/video-autopost-meta.mjs
          node --check automation/seo-optimizer.mjs
          node --check automation/fortura_galaxus_lauf.mjs
          node --check automation/lib/galaxus_treffer.mjs
          node --check automation/fortura_preis_kandidaten.mjs
          node --check automation/fortura_preisvergleich.mjs
          node --check automation/cj_video_produkte.mjs
          node --check automation/lib/cj_video.mjs
      - name: Existing helper checks
        run: |
          node automation/lib/shopify_gql_test.mjs
          node automation/lib/shopify_secret_test.mjs
          node automation/lib/kanal_sperren_test.mjs
          node automation/lib/cross_sell_ziel_test.mjs
          node automation/lib/bild_befund_test.mjs
          node automation/lib/titel_deutsch_test.mjs
          node automation/lib/lieferbarkeit_test.mjs
          # Lief bisher in KEINEM Workflow — ein Test, der nie laeuft, ist kein Test.
          node automation/lib/seo_titel_test.mjs
          node automation/lib/fortura_marke_test.mjs
          node automation/lib/galaxus_treffer_test.mjs
          node automation/lib/trend_auswahl_test.mjs
          node automation/lib/chf_preis_test.mjs
          node automation/fortura_preisvergleich_test.mjs
          node automation/lib/cj_video_test.mjs
      - name: CJ failures and publication regressions (mock APIs only)
        run: |
          node automation/lib/cj_response_test.mjs
          node automation/lib/cj_fetch_test.mjs
          node automation/lib/judgeme_antwort_test.mjs
          node automation/lib/bewertung_sichtbarkeit_test.mjs
          node automation/review_safety_test.mjs
          node automation/metricool_checkpoint_test.mjs
          node automation/meta_checkpoint_test.mjs
          node automation/cj_import_checkpoint_test.mjs
      - name: Shopify host, queue input and publication guards (mock APIs only)
        run: |
          node --test automation/lib/shopify_host_test.mjs automation/social_queue_test.mjs automation/publish_guard_test.mjs dropship/cj_enrich_test.mjs
      - name: Content preflight (offline evidence only)
        run: python3 -B -m unittest discover -s automation -p 'test_content_preflight.py' -v
