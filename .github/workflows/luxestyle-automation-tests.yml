name: LuxeStyle automation tests

on:
  pull_request:
    paths:
      - 'automation/lib/**'
      - 'codex-mods/**'
      - 'AGENTS.md'
      - 'automation/autopilot/shop_pulse.mjs'
      - 'automation/*.mjs'
      - 'tools/versandregel*.mjs'
      - 'automation/seo-optimizer.mjs'
      - 'automation/metricool-schedule.mjs'
      - 'automation/price_guard.mjs'
      - 'automation/cross_sell.mjs'
      - 'automation/lieferbarkeit_guard.mjs'
      - 'automation/image-audit.mjs'
      - 'automation/titel_deutsch_fix.mjs'
      - 'automation/shop_brain.mjs'
      - 'automation/publish_guard.mjs'
      - 'automation/cj_reviews_import.mjs'
      - 'automation/video-autopost-meta.mjs'
      - 'automation/review_safety_test.mjs'
      - 'automation/metricool_checkpoint_test.mjs'
      - 'automation/meta_checkpoint_test.mjs'
      - 'automation/cj_import_checkpoint_test.mjs'
      - 'automation/social_queue_test.mjs'
      - 'automation/publish_guard_test.mjs'
      - 'automation/content_preflight.py'
      - 'automation/test_content_preflight.py'
      - 'automation/fortura_galaxus_lauf.mjs'
      - 'automation/lib/galaxus_treffer.mjs'
      - 'automation/lib/galaxus_treffer_test.mjs'
      - 'automation/fortura_preis_kandidaten.mjs'
      - 'automation/fortura_preisvergleich.mjs'
      - 'automation/fortura_preisvergleich_test.mjs'
      - 'automation/cj_video_produkte.mjs'
      - 'automation/lib/cj_video.mjs'
      - 'automation/lib/cj_video_test.mjs'
      - 'dropship/cj_enrich.mjs'
      - 'dropship/cj_enrich_test.mjs'
      - 'dropship/ads/render_brand_video.py'
      - 'dropship/ads/test_render_brand_video.py'
      - 'dropship/mode-taxonomie-2610/**'
      - 'dropship/pod-auswahl/**'
      - 'dropship/pod-editor-sicherung-2810/**'
      - 'pod/editor-hintergruende.json'
      - 'automation/pod_inject_designer.mjs'
      - 'automation/pod_editor_hintergruende.mjs'
      - 'automation/lib/pod_editor_bg.mjs'
      - 'automation/lib/pod_editor_bg_test.mjs'
      - 'dropship/taxonomie-2610-b/**'
      - '.github/workflows/luxestyle-automation-tests.yml'
      - '.github/workflows/video-meta-autopost.yml'
      - '.github/workflows/cj-reviews.yml'
      - '.github/workflows/metricool-schedule.yml'
      - '.github/workflows/auswahl-lauf.yml'
      - 'automation/auswahl_durchlauf.sh'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # 8 statt 5 Minuten (28.10.2026): Nachspielung mit bash automation/ci_simulation.sh = 255 s (vorher 207 s, davor 186 s; die Mutationsprobe wuchs von 173 über 197 und 217 auf 221 Mutanten, die Schreibweg-Tests um 68 Pruefungen), 53 % der 480 s.
    # Ohne checkout/setup-node/setup-python, die in der Nachspielung fehlen, blieben von 300 s nur 93 s (31 %) Luft. Das Limit schuetzt vor haengenden Laeufen, nicht vor langsamen Tests.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            automation/lib
            automation/*.mjs
            codex-mods
            AGENTS.md
            automation/autopilot/shop_pulse.mjs
            tools/versandregel.mjs
            tools/versandregel_test.mjs
            automation/seo-optimizer.mjs
            automation/metricool-schedule.mjs
            automation/price_guard.mjs
            automation/cross_sell.mjs
            automation/lieferbarkeit_guard.mjs
            automation/image-audit.mjs
            automation/titel_deutsch_fix.mjs
            automation/shop_brain.mjs
            automation/publish_guard.mjs
            automation/cj_reviews_import.mjs
            automation/video-autopost-meta.mjs
            automation/review_safety_test.mjs
            automation/metricool_checkpoint_test.mjs
            automation/meta_checkpoint_test.mjs
            automation/cj_import_checkpoint_test.mjs
            automation/social_queue_test.mjs
            automation/publish_guard_test.mjs
            automation/content_preflight.py
            automation/test_content_preflight.py
            automation/fortura_galaxus_lauf.mjs
            automation/lib/galaxus_treffer.mjs
            automation/lib/galaxus_treffer_test.mjs
            automation/fortura_preis_kandidaten.mjs
            automation/fortura_preisvergleich.mjs
            automation/fortura_preisvergleich_test.mjs
            automation/cj_video_produkte.mjs
            automation/lib/cj_video.mjs
            automation/lib/cj_video_test.mjs
            dropship/cj_enrich.mjs
            dropship/cj_enrich_test.mjs
            dropship/ads/render_brand_video.py
            dropship/ads/test_render_brand_video.py
            dropship/mode-taxonomie-2610
            dropship/pod-auswahl
            dropship/pod-editor-sicherung-2810
            pod/editor-hintergruende.json
            automation/pod_inject_designer.mjs
            automation/pod_editor_hintergruende.mjs
            automation/lib/pod_editor_bg.mjs
            automation/lib/pod_editor_bg_test.mjs
            dropship/taxonomie-2610-b
            automation/auswahl_durchlauf.sh
            .github/workflows/luxestyle-automation-tests.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Renderer stays text-only (no rendering or network)
        run: python3 -B -m unittest -v dropship/ads/test_render_brand_video.py
      - name: Syntax
        run: |
          node --check automation/cj_reviews_import.mjs
          node --check dropship/cj_enrich.mjs
          node --check automation/publish_guard.mjs
          node --check automation/cross_sell.mjs
          node --check automation/lieferbarkeit_guard.mjs
          node --check automation/image-audit.mjs
          node --check automation/titel_deutsch_fix.mjs
          node --check automation/shop_brain.mjs
          node --check automation/video-autopost-meta.mjs
          node --check automation/seo-optimizer.mjs
          node --check automation/fortura_galaxus_lauf.mjs
          node --check automation/lib/galaxus_treffer.mjs
          node --check automation/fortura_preis_kandidaten.mjs
          node --check automation/fortura_preisvergleich.mjs
          node --check automation/cj_video_produkte.mjs
          node --check automation/lib/cj_video.mjs
          node --check automation/material_nachtragen.mjs
          node --check automation/pod_auswahl.mjs
          node --check automation/pod_inject_designer.mjs
          node --check automation/pod_editor_hintergruende.mjs
          node --check automation/printful_sync.mjs
          node --check automation/schmuck_gruppen.mjs
          node --check automation/schmuck_menue.mjs
          node --check automation/rucksaecke_gruppen.mjs
          node --check automation/rucksaecke_menue.mjs
          node --check automation/kategorie_seo_dubletten.mjs
          node --check automation/lib/collection_web.mjs
          node --check automation/lib/beleg_woerter.mjs
          node --check automation/lib/sperr_tags.mjs
          node --check automation/kundenstimmen_bauen.mjs
          node --check automation/unterteilung_audit.mjs
          node --check automation/gmc_schaufenster.mjs
          node --check automation/codex_zweitmeinung.mjs
          node --check codex-mods/luxe-codex/hooks/leitplanken.mjs
          node --check codex-mods/luxe-codex/hooks/schreibzaehler.mjs
          node --check codex-mods/luxe-codex/hooks/kontext.mjs
      - name: Existing helper checks
        run: |
          node automation/lib/shopify_gql_test.mjs
          node automation/lib/shopify_secret_test.mjs
          node automation/lib/kanal_sperren_test.mjs
          node automation/lib/cross_sell_ziel_test.mjs
          node automation/lib/bild_befund_test.mjs
          node automation/lib/titel_deutsch_test.mjs
          node automation/lib/lieferbarkeit_test.mjs
          # Lief bisher in KEINEM Workflow — ein Test, der nie laeuft, ist kein Test.
          node automation/lib/seo_titel_test.mjs
          node automation/lib/fortura_marke_test.mjs
          node automation/lib/galaxus_treffer_test.mjs
          node automation/lib/trend_auswahl_test.mjs
          node automation/lib/chf_preis_test.mjs
          node automation/fortura_preisvergleich_test.mjs
          node automation/lib/cj_video_test.mjs
      - name: Codex-Mods (Hooks, Befehle, Zweitmeinung-Läufer; kein Netz, kein Modell)
        # 28.10.2026: luxe-codex (codex-mods/) und der Läufer automation/codex_zweitmeinung.mjs; die Tests prüfen die Hook-Ausgabe gegen die Schemas aus der Codex-Binärdatei
        # (codex-mods/luxe-codex/test/schemas) und nutzen einen falschen codex. Fake-Zugangsdaten entstehen darin erst zur Laufzeit (GitHub-Push-Protection).
        run: |
          node codex-mods/luxe-codex/test/hook_io_test.mjs
          node codex-mods/luxe-codex/test/leitplanken_test.mjs
          node codex-mods/luxe-codex/test/schreibzaehler_test.mjs
          node codex-mods/luxe-codex/test/modus_test.mjs
          node codex-mods/luxe-codex/test/befehle_test.mjs
          node automation/lib/codex_zweitmeinung_test.mjs
      - name: Kategorien, Auswahl, Texte, Feed (reine Module, kein Netz)
        # CJ_PAUSE_MS=0: die Tests des Varianten-Werkzeugs sprechen nur mit Attrappen; ohne diese Zeile wartet jeder plane()-Aufruf 1,1 s (der Stecker-Test: 28 s statt 5 s, Job-Limit 5 Minuten).
        env:
          CJ_PAUSE_MS: '0'
        # 26.10.2026: Diese 21 Tests lagen im Repo, liefen aber in KEINEM Workflow (gefunden mit: jeden *_test.mjs gegen .github/workflows greppen).
        run: |
          node automation/lib/kategorien_test.mjs
          node automation/lib/mengenrabatt_test.mjs
          node automation/lib/tassen_regel_test.mjs
          node automation/lib/fakten_block_test.mjs
          node automation/lib/text_prosa_test.mjs
          node automation/lib/bewertung_rang_test.mjs
          node automation/lib/option_umbenennen_test.mjs
          node automation/lib/cj_varianten_test.mjs
          node automation/lib/cj_token_test.mjs
          node automation/lib/uebersetzen_test.mjs
          node automation/lib/url_status_test.mjs
          node automation/lib/gmc_ausschluss_test.mjs
          node automation/lib/gmc_feed_item_test.mjs
          # Google-Schaufenster (Merchant-Center-Quote, 150 000 Artikel je Bereich): Regel und Ablauf mit Attrappen-Shop; ohne Netz
          node automation/lib/gmc_schaufenster_test.mjs
          node automation/gmc_schaufenster_lauf_test.mjs
          node automation/lib/sourcing_kandidaten_test.mjs
          node automation/lib/top_kandidaten_test.mjs
          node automation/auswahl_kandidaten_test.mjs
          node automation/optionen_reparieren_test.mjs
          node automation/lieferzeit_fortura_test.mjs
          node automation/optionen_uebersetzen_test.mjs
          node automation/lib/regel_auswerten_test.mjs
          node automation/lib/kategorien_verengt_test.mjs
          node automation/lib/mode_taxonomie_test.mjs
          node automation/lib/mode_menue_test.mjs
          # Schmuck-Taxonomie (Bereichsdatei schmuck-uhren.json): Adapter gegen das Orakel des Messwerkzeugs, Menue-Umbau, Gruppen-Sammlungen; ohne Netz
          node automation/lib/bereich_taxonomie_test.mjs
          node automation/lib/schmuck_menue_test.mjs
          # Rucksack-Taxonomie (Bereichsdatei rucksaecke.json): Menue-Umbau «Taschen & Rucksaecke», Gruppen-Sammlungen; ohne Netz
          node automation/lib/rucksaecke_menue_test.mjs
          # Doppelte Seitentitel bei Sammlungen (Damen/Herren-Paare, Rucksack-Chips): Plan und Lauf mit Attrappe; ohne Netz
          node automation/lib/seo_dubletten_test.mjs
          node automation/lib/stecker_cj_test.mjs
          # Grind 2.0 (Pipeline, Fracht, Preis, Dubletten, Google-Kategorie, Plan, Schema): 27.10.2026 (Gegenlesung) lief KEIN Test davon in einem Workflow.
          # Der Test grind2_test.mjs prueft, dass jede Grind-Testdatei hier steht. Daten unter /tmp fehlen im frischen Checkout: die Tests melden «uebersprungen» statt zu scheitern.
          node automation/lib/cj_fracht_test.mjs
          node automation/lib/grind_preis_test.mjs
          node automation/lib/grind_dubletten_test.mjs
          node automation/lib/grind_google_test.mjs
          node automation/lib/grind_plan_test.mjs
          node automation/lib/grind_schema_test.mjs
          node automation/grind2_test.mjs
          node automation/lib/banner_fotos_test.mjs
          node automation/lib/unterfilter_plan_test.mjs
          node automation/cj_varianten_nachziehen_stecker_test.mjs
          node automation/cj_varianten_nachziehen_sku_test.mjs
          node automation/lib/sku_nachziehen_test.mjs
          node automation/lib/material_test.mjs
          node automation/lib/kundenstimmen_test.mjs
          node automation/auswahl_scan_test.mjs
          node automation/cj_variantenbilder_test.mjs
          node automation/farbwahl_scan_test.mjs
          node automation/menu_eintrag_einfuegen_test.mjs
          node automation/stecker_bereinigen_test.mjs
          node automation/lib/videos_zeile_test.mjs
          node automation/lib/varianten_sicherheit_test.mjs
          node automation/auswahl_durchlauf_test.mjs
          node automation/cj_varianten_nachziehen_lauf_test.mjs
          node automation/lib/auswahl_abgleich_test.mjs
          node tools/versandregel_test.mjs
          # «Selbst gestalten»: Material + Modelle, Preisregel, Platzierung der Druckdatei im Printful-Auftrag (27.10.2026). Daten: dropship/pod-auswahl/*.json (kein /tmp nötig).
          node automation/lib/pod_preise_test.mjs
          node automation/lib/printful_platzierung_test.mjs
          node automation/lib/pod_auswahl_plan_test.mjs
          node automation/lib/pod_auswahl_daten_test.mjs
          node automation/lib/pod_auswahl_gql_test.mjs
          node automation/lib/pod_auswahl_schreiben_test.mjs
          node automation/pod_auswahl_test.mjs
          node automation/printful_sync_test.mjs
          # Editor-Hintergründe ohne eingebranntes «Dein Design» (28.10.2026): Baustein lesen/umschreiben, Übersteuerungstabelle pod/editor-hintergruende.json, Sicherung dropship/pod-editor-sicherung-2810
          node automation/lib/pod_editor_bg_test.mjs
      - name: Mutationsprobe «Selbst gestalten» (221 absichtliche Fehler, alle müssen rot werden)
        run: node automation/pod_auswahl_mutation.mjs
      - name: CJ failures and publication regressions (mock APIs only)
        run: |
          node automation/lib/cj_response_test.mjs
          node automation/lib/cj_fetch_test.mjs
          node automation/lib/judgeme_antwort_test.mjs
          node automation/lib/bewertung_sichtbarkeit_test.mjs
          node automation/review_safety_test.mjs
          node automation/metricool_checkpoint_test.mjs
          node automation/meta_checkpoint_test.mjs
          node automation/cj_import_checkpoint_test.mjs
      - name: Shopify host, queue input and publication guards (mock APIs only)
        run: |
          node --test automation/lib/shopify_host_test.mjs automation/social_queue_test.mjs automation/publish_guard_test.mjs dropship/cj_enrich_test.mjs
      - name: Content preflight (offline evidence only)
        run: python3 -B -m unittest discover -s automation -p 'test_content_preflight.py' -v
