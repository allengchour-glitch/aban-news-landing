name: Merchant-Beschreibung lesen (Pullover-Pilot, nur lesen)

# Welche Beschreibung trägt Google heute für die Damenpullover? Misst den Pilot vom 09./10.11.2026
# (dropship/merchant-beschreibung-0911/README.md). Liest nur: Merchant API (Dienstkonto) und Shopify.
# Gibt keine Konto-Nummer und kein Feed-Label aus; schreibt keine Datei als Artefakt.
on:
  workflow_dispatch:
  push:
    branches: [claude/pullover-pilot-messen-1611]
    paths: ['.github/workflows/merchant-beschreibung.yml', 'dropship/merchant-beschreibung-0911/google_lesen.py']

permissions:
  contents: read

jobs:
  lesen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            automation/merchant_bildprobleme.py
            dropship/merchant-beschreibung-0911/
            dropship/ranking-0911/apply_fristen.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth requests
      - name: Selbsttest (ohne Netz)
        run: python3 dropship/merchant-beschreibung-0911/google_lesen.py --selbsttest
      - name: Beschreibung bei Google lesen
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python3 dropship/merchant-beschreibung-0911/google_lesen.py
