name: LuxeStyle Meisterwerk-Werbung (DE + EN)

# Rendert die Premium-Werbung (9:16, HOOK-FIRST, ~20-25s) aus Veo-Clips (echte Bewegung, falls vorhanden)
# + Ken-Burns-Stills + animierter Typo/Logo + ElevenLabs-Voiceover (Fallback Google-TTS) + geduckter Musik.
# DE & EN. Output: reels/luxestyle-werbung-meisterwerk-{de,en}.mp4 (+ -clean). Nur manuell.

on:
  workflow_dispatch:
    inputs:
      stills:
        description: 'Anzahl Still-Produkte aus good_products.csv'
        type: string
        default: '6'
      veo_max:
        description: 'Max. vorhandene Veo-Clips einbauen'
        type: string
        default: '8'

permissions:
  contents: write

concurrency:
  group: masterpiece-ad
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg + Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Manifest + Voiceover + Render (DE & EN)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          NSTILL: ${{ github.event.inputs.stills || '6' }}
          VEOMAX: ${{ github.event.inputs.veo_max || '8' }}
        run: |
          set -e
          D=/tmp/mp; IMG=$D/img; mkdir -p "$IMG"; : > "$D/manifest.txt"
          vc=0
          for f in reels/veo-hero-*.mp4; do
            [ -e "$f" ] || continue
            printf 'veo|%s|\n' "$f" >> "$D/manifest.txt"; vc=$((vc+1))
            [ "$vc" -ge "$VEOMAX" ] && break
          done
          echo "Veo-Clips eingebaut: $vc"
          k=0
          tail -n +2 automation/good_products.csv | head -n "$NSTILL" > "$D/rows.csv" || true
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            url=$(printf '%s' "$line" | cut -d, -f2); label=$(printf '%s' "$line" | cut -d, -f3)
            k=$((k+1))
            if curl -sL --fail "$url" -o "$IMG/$k.jpg"; then
              printf 'still|%s|%s\n' "$IMG/$k.jpg" "$label" >> "$D/manifest.txt"
            fi
          done < "$D/rows.csv"
          echo "=== Manifest ==="; cat "$D/manifest.txt"
          HOOK_DE="Designer-Look. Fairer Preis."
          HOOK_EN="Designer looks. Fair prices."
          DE="Das ist LuxeStyle. Premium-Mode aus der Schweiz, Designer-Looks zu fairen Preisen. Kleider, Taschen und Accessoires fuer deinen Sommer. Oder gestalte dein eigenes Teil, dein Design, on-demand gedruckt. Gratis Versand ab fuenfundsechzig Franken. Zehn Prozent mit dem Code Welcome zehn. Jetzt shoppen auf LuxeStyle punkt c h."
          EN="This is LuxeStyle. Premium Swiss fashion, designer looks at fair prices. Dresses, bags and accessories for your summer. Or design your own piece, your design, printed on demand. Free shipping over sixty-five francs. Ten percent off with the code Welcome ten. Shop now at LuxeStyle dot c h."
          bash dropship/ads/tts_eleven.sh de "$D/voice_de.wav" "$DE"
          bash dropship/ads/tts_eleven.sh en "$D/voice_en.wav" "$EN"
          mkdir -p reels
          bash dropship/ads/render_masterpiece.sh reels/luxestyle-werbung-meisterwerk-de.mp4 "$D/voice_de.wav" automation/reel_music.m4a "$D/manifest.txt" de "$HOOK_DE"
          bash dropship/ads/render_masterpiece.sh reels/luxestyle-werbung-meisterwerk-en.mp4 "$D/voice_en.wav" automation/reel_music.m4a "$D/manifest.txt" en "$HOOK_EN"
          ls -la reels/luxestyle-werbung-meisterwerk-*.mp4
      - name: Commit
        run: |
          git config user.name  "meisterwerk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reels/luxestyle-werbung-meisterwerk-*.mp4
          git commit -m "Meisterwerk-Werbung LuxeStyle DE+EN (hook-first, Veo+Stills+ElevenLabs) [skip ci]" || { echo "nichts"; exit 0; }
          for i in 1 2 3 4 5; do
            if git push; then echo gepusht; break; fi
            git pull --rebase --autostash origin main || true; sleep 3
          done
