name: CJ Autopilot (täglicher Produkt-Sourcing-Lauf)

# Füllt die Produkt-Pipeline autonom: sourct CJ-Produkte, verifiziert Bilder, legt sie als
# DRAFT (Tag 'autopilot-needs-copy') im Shop an. Finale deutsche Copy + Live-Schaltung +
# Publizieren übernimmt eine Claude-Session (siehe dropship/AUTONOMER-MODUS.md).
#
# Voraussetzung: Repository-Secrets setzen (Settings → Secrets and variables → Actions):
#   CJ_EMAIL, CJ_API_KEY, SHOPIFY_SHOP (z.B. luxestyle.myshopify.com), SHOPIFY_ADMIN_TOKEN
# Ohne Secrets ist der Lauf ein sauberer No-Op (es passiert nichts).

on:
  schedule:
    - cron: '0 6 * * *'   # täglich 06:00 UTC
  workflow_dispatch:
    inputs:
      max:
        description: 'Wie viele Drafts anlegen'
        required: false
        default: '2'

permissions:
  contents: read

jobs:
  autopilot:
    name: CJ → Shopify Draft-Sourcing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run autopilot
        env:
          CJ_EMAIL: ${{ secrets.CJ_EMAIL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          AUTOPILOT_MAX: ${{ github.event.inputs.max || '2' }}
        run: node dropship/cj_autopilot.mjs
