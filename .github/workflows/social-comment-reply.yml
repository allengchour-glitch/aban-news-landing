name: Social Comment Auto-Reply (IG + FB)

# Antwortet 3×/Tag automatisch auf echte Kommentare (Komplimente + Kundenfragen) der letzten
# IG/FB-Posts — herzlich + markengerecht, Spam wird übersprungen, nie doppelt (State-Datei).
# No-op ohne Meta-Tokens. DRY_RUN per Dispatch-Input.

on:
  schedule:
    - cron: '20 7,13,18 * * *'   # 3×/Tag (versetzt zur Moderation)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur testen (nicht posten)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-comment-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (sparse — Script + State)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            automation/social-comment-reply.mjs
            social
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Antworten
        env:
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node automation/social-comment-reply.mjs

      - name: State committen
        run: |
          if [ -n "$(git status --porcelain social/replied-comments.json)" ]; then
            git config user.name  "comment-reply-bot"
            git config user.email "actions@users.noreply.github.com"
            git add social/replied-comments.json
            git commit -m "comment-reply: State aktualisiert [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "Nichts beantwortet — kein State-Update."
          fi
