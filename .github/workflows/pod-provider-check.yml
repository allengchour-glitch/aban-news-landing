name: POD-Anbieter-Check (Printify/Gelato)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pod-provider-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verbindung testen
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          GELATO_API_KEY: ${{ secrets.GELATO_API_KEY }}
        run: node automation/pod_provider_check.mjs
