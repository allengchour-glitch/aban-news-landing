name: Veo Hero-Clip

# Generiert mit Veo einen cineastischen 9:16-Hero-Clip aus einem Produktbild (good_products.csv).
# NUR manuell (Veo kostet pro Sekunde Video). No-op ohne GEMINI_API_KEY.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Produkt-name aus good_products.csv (leer = rotierend)'
        type: string
        default: ''
      model:
        description: 'Veo-Modell'
        type: choice
        default: 'veo-3.0-fast-generate-001'
        options:
          - 'veo-3.0-fast-generate-001'
          - 'veo-3.0-generate-001'
          - 'veo-2.0-generate-001'
      dry_run:
        description: 'Nur testen (kein Render, keine Kosten)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veo-hero-clip
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Veo hero clip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VEO_MODEL: ${{ inputs.model }}
          VEO_ONLY: ${{ inputs.only }}
          MAX_CLIPS: '1'
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node automation/veo-hero-clip.mjs

      - name: Commit clip if created
        run: |
          if [ -n "$(git status --porcelain reels/ 2>/dev/null)" ]; then
            git config user.name "luxestyle-veo-bot"
            git config user.email "bot@users.noreply.github.com"
            git add reels/
            git commit -m "chore(veo): Hero-Clip generiert [skip ci]" || echo "nichts zu committen"
            git push || echo "push skipped"
          else
            echo "Kein neuer Clip."
          fi
