name: Voice Linter

# The brand-voice linter is built for newsletter issue markdown (see its own
# usage: `--batch ausgaben/`). Engineering/ops docs (README, setup guides,
# launch/marketing notes) are not newsletter content — they legitimately quote
# the forbidden-phrase list and exceed the per-issue length cap, so they are
# excluded from voice-linting.
on:
  pull_request:
    paths:
      - '**/*.md'
      - '!README.md'
      - '!CHANGELOG.md'
      - '!LAUNCH-CHECKLISTE.md'
      - '!ABONNENTEN-GEWINNEN.md'
      - '!automation/*.md'
  push:
    paths:
      - '**/*.md'
      - '!README.md'
      - '!CHANGELOG.md'
      - '!LAUNCH-CHECKLISTE.md'
      - '!ABONNENTEN-GEWINNEN.md'
      - '!automation/*.md'
  workflow_dispatch:

jobs:
  lint:
    name: Brand-Voice check on newsletter issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          if [ -f tools/requirements.txt ]; then
            pip install -r tools/requirements.txt
          fi

      - name: Run brand-voice linter on newsletter issues
        run: |
          if [ -d ausgaben ]; then
            python3 automation/voice-linter-cli.py --batch ausgaben/ || true
          else
            echo "Kein ausgaben/-Verzeichnis — nichts zu linten."
          fi
