name: Voice Linter

on:
  pull_request:
    paths:
      - '**/*.md'
  push:
    paths:
      - '**/*.md'

jobs:
  lint:
    name: Brand-Voice check on changed .md files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          if [ -f tools/requirements.txt ]; then
            pip install -r tools/requirements.txt
          fi

      - name: Determine changed files
        id: changes
        run: |
          # Engineering/project docs are not newsletter content — exclude them
          # from the brand-voice linter (research reports, READMEs, technical docs).
          EXCLUDES=(":(exclude)ki-geld-projekt/**" ":(exclude)aban-studio/**" ":(exclude)ki-tools-radar/**" ":(exclude)foerder-radar/**" ":(exclude)jobs-radar/**" ":(exclude)kurse-radar/**" ":(exclude)prompts-bibliothek/**" ":(exclude)agenturen-radar/**" ":(exclude)dropshipping-radar/**" ":(exclude)dropship/**" ":(exclude)video-prototypes/**" ":(exclude)portal/**" ":(exclude)social/**" ":(exclude)docs/**" ":(exclude)downloads/**" ":(exclude)reports/**" ":(exclude)**/README.md" ":(exclude)automation/WERKBANK.md" ":(exclude)automation/README.md" ":(exclude)automation/brand-voice-make-integration.md" ":(exclude)automation/linkedin-auto-post-SETUP.md" ":(exclude)automation/newsletter-teaser.md" ":(exclude)automation/news-roh-aktuell.md" ":(exclude)automation/news-roh-*.md" ":(exclude)automation/entwurf-gemini-*.md" ":(exclude)automation/erste-ausgabe-willkommen.md" ":(exclude)automation/erste-inhaltsausgabe-vorlage.md" ":(exclude)PROJEKT.md" ":(exclude)START-HIER.md" ":(exclude)3-KLICKS.md" ":(exclude)CLAUDE.md")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" "$HEAD" -- '*.md' "${EXCLUDES[@]}" || true)
          else
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- '*.md' "${EXCLUDES[@]}" 2>/dev/null || git ls-files '*.md' "${EXCLUDES[@]}")
          fi
          # Infrastruktur-/Doku-/Fiktions-Markdown ausnehmen: der Voice-Linter
          # erzwingt Newsletter-Regeln (max 5000 Zeichen, du-Form, #-Tags), die
          # fuer Projekt-Memory (CLAUDE.md), Entwickler-Doku (docs/, README) und
          # die KI-Schriftsteller-Romane (ki-schriftsteller/: literarische Prosa
          # in dritter Person mit formellem 'Sie' im Dialog) nicht gelten.
          # Ebenso ausgenommen (2026-09-12): .claude/ (Skills = Arbeitsanweisungen an
          # Claude), brain/ (Obsidian-Vault = Projekt-Memory, die Zeitleiste wird aus dem
          # ohnehin ausgenommenen CLAUDE.md erzeugt) und LERNEN-*.md (technische Berichte).
          # Gemessen: dort schlugen nur Newsletter-Regeln an, die nicht gelten koennen —
          # Laengengrenze 5000 Zeichen, 'Sie-Drift' bei normalem deutschem Satzanfang
          # ('Sie stimmte nicht'), und Grossschreibung aus CLAUDE.md-Schlagzeilen.
          # Marketing-/Content-.md bleiben voll streng.
          FILES=$(echo "$FILES" | grep -Ev '^(CLAUDE\.md|SHARED-MEMORY\.md|KI-WERKZEUG-HANDOFF\.md|.*-HANDOFF\.md|.*-MEMORY\.md|.*-TODO\.md|.*-CHECKLISTE\.md|docs/|ki-schriftsteller/|\.claude/|brain/|LERNEN-.*\.md|.*/README\.md|README\.md)' || true)
          echo "Zu pruefende .md-Dateien (ohne Infra-Doku):"
          echo "$FILES"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run brand-voice-linter (strict)
        run: |
          set -e
          FAIL=0
          if [ ! -f tools/brand-voice-linter.py ]; then
            echo "::warning::tools/brand-voice-linter.py not found — skipping"
            exit 0
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ ! -f "$f" ] && continue
            echo "::group::Linting $f"
            if ! python tools/brand-voice-linter.py "$f" --strict; then
              FAIL=1
              echo "::error file=$f::Brand-voice violations found"
            fi
            echo "::endgroup::"
          done <<< "${{ steps.changes.outputs.files }}"
          if [ "$FAIL" = "1" ]; then
            echo "::error::Voice-Linter failed — fix forbidden phrases before merge"
            exit 1
          fi
          echo "All changed .md files passed voice-linter"
