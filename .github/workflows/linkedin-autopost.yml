name: LinkedIn Autopost

# Postet werktags den naechsten faelligen Eintrag aus social/linkedin_queue.json.
# No-op-sicher: ohne die Secrets passiert nichts (Exit 0, kein Commit).
# Cron laeuft nur vom Default-Branch (main).

on:
  schedule:
    - cron: '0 8 * * 1-5'   # Mo–Fr 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Post next queued item
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_POST_TARGET: ${{ vars.LINKEDIN_POST_TARGET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          VERTEX_IMAGE_MODEL: ${{ vars.VERTEX_IMAGE_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ABAN_IMAGE_SOURCE: ${{ vars.ABAN_IMAGE_SOURCE }}
          ABAN_DISABLE_IMAGE_GEN: ${{ vars.ABAN_DISABLE_IMAGE_GEN }}
        run: |
          pip install --quiet pillow google-auth requests || true
          python3 automation/linkedin_post.py

      - name: Persist queue status (falls gepostet)
        run: |
          if ! git diff --quiet -- social/linkedin_queue.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add social/linkedin_queue.json
            git commit -m "LinkedIn-Autopost: Queue-Status aktualisiert [skip ci]"
            # Race-sicher: andere Bots pushen staendig auf main → vor dem Push
            # rebasen und bei Ablehnung mehrfach erneut versuchen. WICHTIG, damit
            # der "posted"-Status sicher landet und kein Eintrag doppelt gepostet wird.
            for i in 1 2 3 4 5; do
              if git push; then echo "Push ok (Versuch $i)"; exit 0; fi
              echo "Push abgelehnt — rebase + retry ($i/5)"
              git pull --rebase --autostash origin main || true
              sleep 3
            done
            echo "::error::Queue-Status konnte nach 5 Versuchen nicht gepusht werden."
            exit 1
          else
            echo "Queue unveraendert — kein Commit."
          fi
