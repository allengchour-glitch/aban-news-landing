name: Browser-Agent (Browserbase)

# Führt eine eingeloggte Browser-Aktion über Browserbase aus (z. B. IG/TikTok-Post löschen),
# die die offiziellen APIs nicht können. Nutzt den EINGELOGGTEN Context (BROWSERBASE_CONTEXT_ID).
# Claude triggert das per Dispatch; der API-Key bleibt Secret. Screenshots = Artefakte.
# Voraussetzung: Secrets BROWSERBASE_API_KEY, BROWSERBASE_PROJECT_ID, BROWSERBASE_CONTEXT_ID
# + der Context wurde einmal eingeloggt (siehe tools/browser/BROWSERBASE-SETUP.md).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Aktion'
        type: choice
        default: 'check'
        options: [context-create, login-start, login-release, check, ig-delete, tiktok-delete, tiktok-upload]
      arg:
        description: 'URL (check/login-start/*-delete/upload-Video) ODER Session-ID (login-release) — bei context-create leer'
        type: string
        required: false
        default: ''
      arg2:
        description: 'Caption (nur tiktok-upload)'
        type: string
        required: false
        default: ''
      confirm:
        description: 'Wirklich ausführen? (löschen/posten — sonst Dry-Run mit Screenshot)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: browser-action
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (nur das Tool)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: tools/browser
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: playwright-core installieren
        run: npm i playwright-core --no-save

      - name: Aktion ausführen
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
        env:
          ARG2: ${{ github.event.inputs.arg2 }}
        run: |
          cd tools/browser
          FLAG=""; [ "${{ github.event.inputs.confirm }}" = "true" ] && FLAG="--confirm"
          if [ -n "$ARG2" ]; then
            node agent_cloud.mjs "${{ github.event.inputs.action }}" "${{ github.event.inputs.arg }}" "$ARG2" $FLAG
          else
            node agent_cloud.mjs "${{ github.event.inputs.action }}" "${{ github.event.inputs.arg }}" $FLAG
          fi

      - name: Screenshots als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tools/browser/*.png
          if-no-files-found: ignore
          retention-days: 7
