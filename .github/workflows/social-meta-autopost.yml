name: Social Meta Auto-Post (IG + FB + Threads)

# Postet den nächsten fälligen Bild-Post aus social/posts_image.csv direkt per Meta-Graph-API
# an Instagram + Facebook-Page + Threads. KEIN Drittanbieter. JPG-Pflicht, Throttle eingebaut.
#
# Tokens NUR aus GitHub-Secrets (Settings → Secrets and variables → Actions):
#   THREADS_ACCESS_TOKEN  + THREADS_USER_ID        → Threads  (DER eine Schritt für Dauerbetrieb)
#   IG_USER_ID            + IG_ACCESS_TOKEN (oder META_ACCESS_TOKEN)        → Instagram Business
#   FB_PAGE_ID            + FB_PAGE_ACCESS_TOKEN (oder META_ACCESS_TOKEN)   → Facebook-Seite (1049840534888592)
# Ohne Secrets = sauberer No-Op (nichts passiert).

on:
  schedule:
    # 2×/Tag, gestaffelt: 08:00 & 17:00 UTC (≈ 10:00 / 19:00 CH)
    - cron: '0 8 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur testen (nichts posten)'
        type: boolean
        default: false

permissions:
  contents: write          # um den 'posted'-Status zurückzuschreiben

concurrency:
  group: social-meta-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Post next image (Meta Graph API)
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          MAX_PER_RUN: '8'
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node automation/social-autopost-meta.mjs

      - name: Commit posted-status if changed
        run: |
          if ! git diff --quiet -- social/posts_image.csv; then
            git config user.name "luxestyle-autopost-bot"
            git config user.email "bot@users.noreply.github.com"
            git add social/posts_image.csv
            git commit -m "chore(social): mark image post as sent [skip ci]"
            git push
          else
            echo "Kein neuer Post gesendet (nichts zu committen)."
          fi
