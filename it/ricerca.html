<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--amber:#d97706;--amber-dk:#b45309;--cream:#fef3c7;--ink:#1f2937;--ink2:#374151;--muted:#6b7280;--line:#e6e1d6;--bg:#fffdf9;--card:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;color:var(--ink);background:var(--bg);min-height:100vh}
a{color:var(--amber-dk);text-decoration:none}
.top{max-width:760px;margin:0 auto;padding:14px 18px;display:flex;gap:10px;align-items:center;font-size:.85rem}
.top .brand{font-weight:900;color:var(--amber-dk);font-size:20px}
.top .lnk{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.top .lnk a{color:var(--ink2);font-weight:700;border:1px solid var(--line);border-radius:18px;padding:6px 11px}
.hero{max-width:680px;margin:0 auto;padding:6vh 18px 18px;text-align:center}
/* margin-top:0 ist noetig, seit .logo eine Hauptueberschrift ist: der Browser gibt
   h1 rund 0,67em Aussenabstand oben mit, was den Kopf der Seite verschoben haette. */
.logo{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:900;letter-spacing:-.02em;margin:0 0 4px}
.logo .a{color:var(--amber-dk)}.logo .n{color:var(--ink)}
.tag{color:var(--muted);font-size:.95rem;margin-bottom:22px}
.box{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:6px 8px 6px 18px;box-shadow:0 10px 30px rgba(31,41,55,.10);transition:box-shadow .15s,border-color .15s}
.box:focus-within{border-color:var(--amber);box-shadow:0 12px 34px rgba(217,119,6,.18)}
.box span.ic{font-size:19px;color:var(--muted)}
.box input{flex:1;border:0;outline:0;background:transparent;font-size:1.05rem;padding:12px 0;color:var(--ink);font-family:inherit;min-width:0}
.box button{background:var(--amber-dk);color:#fff;border:0;border-radius:22px;padding:11px 20px;font-weight:800;cursor:pointer;font-family:inherit}
.box button:hover{background:#a04708}
.hint{margin-top:12px;font-size:.82rem;color:var(--muted)}
.hint a{font-weight:700}
.results{max-width:680px;margin:20px auto 60px;padding:0 18px}
.cnt{font-size:.82rem;color:var(--muted);margin:8px 2px 12px}
.res{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;transition:box-shadow .12s,transform .12s,border-color .12s}
.res:hover{box-shadow:0 8px 22px rgba(31,41,55,.10);transform:translateY(-1px);border-color:#e3d4b6}
.res .u{font-size:.74rem;color:#15803d;word-break:break-all}
.res .t{font-size:1.05rem;font-weight:700;color:#1a3aa0;margin:1px 0 3px}
.res .d{font-size:.9rem;color:var(--ink2)}
.empty{text-align:center;color:var(--muted);padding:24px 0}
/* Kategorie-Filter: bei 1396 Seiten liefert ein Wort wie „KI" hunderte Treffer —
   die Chips grenzen auf eine Rubrik ein, die Zahl zeigt die Treffer darin. */
.chips{display:flex;flex-wrap:wrap;gap:7px;max-width:680px;margin:0 auto 4px;padding:0 18px}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  border-radius:999px;padding:5px 12px;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:#e3d4b6}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#fff}
.chip .n{opacity:.65;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  background:var(--cream);color:var(--amber-dk);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
mark{background:#fef3c7;color:inherit;padding:0 1px;border-radius:2px}
footer{max-width:680px;margin:0 auto;padding:18px;font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="/it/">aban</a>
  <span class="lnk"><a href="/it/">Home</a><a href="/it/branchen.html">L'IA per settore</a><a href="/suchmaschine.html">DE</a><a href="/en/search.html">EN</a><a href="/fr/recherche.html">FR</a></span>
</div>

<div class="hero">
  <!-- Die Suchseiten hatten GAR KEINE Ueberschrift: die sichtbare Zeile war ein
       gestyltes div. Fuer Screenreader und Suchmaschinen hiess das: Seite ohne
       Hauptueberschrift. Als Ueberschrift 1. Ordnung aendert sich optisch nichts
       (die Klasse traegt das Aussehen), semantisch alles. Gilt ueber
       build_suche_sprachen.py auch fuer en/search, fr/recherche und it/ricerca.
       Kein Tag-Name in Klammern in diesem Kommentar: einfache Pruefskripte zaehlen
       sonst die Erwaehnung als zweite Ueberschrift mit — meine eigene tat es. -->
  <h1 class="logo"><span class="a">aban</span><span class="n">-Ricerca</span></h1>
  <p class="tag">Cerca in tutte le guide IA, gli strumenti e le spiegazioni di abannews.com.</p>
  <form class="box" id="f" role="search" onsubmit="return false">
    <span class="ic">🔎</span>
    <input id="q" type="search" autocomplete="off" autofocus placeholder="Cosa cerchi? p. es. GDPR, computer, prompt …" aria-label="Termine di ricerca">
    <button id="go" type="submit">Cerca</button>
  </form>
</div>

<div class="chips" id="chips" hidden></div>
<div class="results"><div class="cnt" id="cnt" hidden></div><div id="list"></div></div>

<footer>aban news · cerca in <span id="total">…</span> pagine · <a href="/it/">Home</a> · <a href="/impressum.html">Note legali</a></footer>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var IDX=[],ready=false;
  var qi=$("#q"),list=$("#list"),cnt=$("#cnt");
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function hi(text,terms){var out=esc(text);terms.forEach(function(t){if(t.length<2)return;
    out=out.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>")});return out}
  /* Kategorie-Kuerzel aus dem Index (build_search_index.py) -> Anzeigename */
  var KAT={ki:"Guida IA",kauf:"Guida all'acquisto",vgl:"Confronto",markt:"Mercato",rechner:"Calcolatore",tool:"Strumento",thema:"Tema",spiel:"Gioco",dossier:"Dossier",hype:"Hype watch"};
  var KATFOLGE=["ki","kauf","vgl","rechner","markt","tool","thema","spiel","dossier","hype"];
  var filter="";
  /* Der Slug traegt bei diesen Seiten die Bedeutung ("3d-drucker-kaufen-schweiz").
     Er wird aus der URL gelesen statt in den Index geschrieben — kostet keine Bytes. */
  function slug(u){return (u||"").replace(/\.html$/,"").replace(/[\/-]/g," ").toLowerCase()}
  /* 🇨🇭 UMLAUTE. 1231 der 1396 Seiten haben Umlaute im Titel oder Text — wer auf einer
     Tastatur ohne sie tippt (oder es einfach weglaesst), fand sie vorher nicht.
     Jeder Text wird in ZWEI Schreibweisen abgelegt, getrennt durch \u0000, damit ein
     Suchwort nie ueber die Grenze hinweg trifft:
       fold  „über" -> „ueber"  (deckt „über" und „ueber" ab)
       plain „über" -> „uber"   (deckt „uber" ab)
     Die Suchbegriffe werden gleich behandelt; ein Treffer in einer der beiden reicht. */
  function fold(s){return String(s||"").toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")}
  function plain(s){return String(s||"").toLowerCase()
    .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")}
  function beide(s){return fold(s)+"\u0000"+plain(s)}
  /* SYNONYME. GEMESSEN: auf /fr/ liefert „intelligence" 0 Treffer, obwohl 374 der
     380 Seiten genau davon handeln — sie schreiben durchgehend „IA". Dasselbe gilt
     für „künstliche Intelligenz" gegen „KI" und „artificial intelligence" gegen „AI".
     Wer den ausgeschriebenen Begriff tippt, landete in einer Sackgasse. */
  var SYN={"intelligenza":["ia"],"artificiale":["ia"],"ki":["ia"],"ai":["ia"]};
  /* Einmal beim Laden vorrechnen statt bei jedem Tastendruck ueber 1396 Eintraege. */
  function vorbereiten(idx){idx.forEach(function(it){
    it._t=beide(it.t);it._d=beide(it.d);it._s=beide(slug(it.u))});return idx}
  function drin(h,w){for(var i=0;i<w.length;i++)if(h.indexOf(w[i])>=0)return true;return false}
  function score(it,terms){var s=0;
    terms.forEach(function(w){
      if(drin(it._t,w))s+=5;
      if(drin(it._d,w))s+=1;
      if(drin(it._s,w))s+=2;
      if(it._t.indexOf(w[0])===0)s+=3});
    return s}
  function chipsBauen(alle,q,terms){
    var box=$("#chips");if(!box)return;
    if(!alle.length){box.hidden=true;box.innerHTML="";return}
    var z={};alle.forEach(function(x){var k=x.it.k||"";if(k)z[k]=(z[k]||0)+1});
    var teile=['<button class="chip" data-k="" aria-pressed="'+(filter?"false":"true")+'">Tutto <span class="n">'+alle.length+'</span></button>'];
    KATFOLGE.forEach(function(k){if(!z[k])return;
      teile.push('<button class="chip" data-k="'+k+'" aria-pressed="'+(filter===k?"true":"false")+'">'+KAT[k]+' <span class="n">'+z[k]+'</span></button>')});
    box.hidden=teile.length<2;box.innerHTML=teile.join("");
    Array.prototype.forEach.call(box.querySelectorAll(".chip"),function(b){
      b.addEventListener("click",function(){filter=b.dataset.k;render(qi.value)})});
  }
  function render(q){
    q=q.trim();
    var terms=q.toLowerCase().split(/\s+/).filter(Boolean).map(function(w){
      var v=[w].concat(SYN[w]||SYN[fold(w)]||[]), aus=[];
      v.forEach(function(x){aus.push(fold(x));if(plain(x)!==fold(x))aus.push(plain(x))});
      return aus});
    var roh=q.toLowerCase().split(/\s+/).filter(Boolean);   /* fuers Hervorheben */
    if(!q){list.innerHTML="";cnt.hidden=true;var cb=$("#chips");if(cb){cb.hidden=true;cb.innerHTML=""}return}
    if(!ready){cnt.hidden=false;cnt.textContent="Caricamento indice …";return}
    var alle=IDX.map(function(it){return {it:it,s:score(it,terms)}}).filter(function(x){return x.s>0})
      .sort(function(a,b){return b.s-a.s});
    /* Ein Filter, der auf 0 Treffer zeigt, ist eine Sackgasse: dann automatisch zurueck auf „Alle". */
    if(filter&&!alle.some(function(x){return x.it.k===filter}))filter="";
    chipsBauen(alle,q,terms);
    var hits=(filter?alle.filter(function(x){return x.it.k===filter}):alle).slice(0,40);
    cnt.hidden=false;
    /* Die ECHTE Trefferzahl, nicht die Laenge der gekappten Liste — sonst stand
       „40+ Treffer" neben einem Chip, der 279 meldet. */
    var ges=filter?alle.filter(function(x){return x.it.k===filter}).length:alle.length;
    cnt.textContent=ges?(ges+" risultati per «"+q+"»"+(filter?" in "+KAT[filter]:"")
      +(ges>hits.length?" · i migliori "+hits.length:"")):"";
    if(!hits.length){list.innerHTML='<div class="empty">Nessun risultato per «'+esc(q)+'».</div>';return}
    list.innerHTML=hits.map(function(x){var it=x.it;
      return '<a class="res" href="'+esc(it.u)+'"><div class="u">abannews.com'+esc(it.u)+'</div><div class="t">'+hi(it.t,roh)+(it.k&&KAT[it.k]?'<span class="badge">'+KAT[it.k]+'</span>':'')+'</div>'+(it.d?'<div class="d">'+hi(it.d,roh)+'</div>':'')+'</a>'}).join("")
  }
  var t;qi.addEventListener("input",function(){clearTimeout(t);t=setTimeout(function(){render(qi.value);writeUrl()},120)});
  $("#f").addEventListener("submit",function(){render(qi.value);writeUrl()});
  function writeUrl(){var q=qi.value.trim();try{history.replaceState(null,"",q?("?q="+encodeURIComponent(q)):location.pathname)}catch(e){}}
  fetch("/data/site-index-it.json").then(function(r){return r.json()}).then(function(d){IDX=vorbereiten(d||[]);ready=true;
    var tot=$("#total");if(tot)tot.textContent=IDX.length;
    var uq=new URLSearchParams(location.search).get("q");if(uq){qi.value=uq}render(qi.value)})
    .catch(function(){cnt.hidden=false;cnt.textContent="Index nicht erreichbar."});
})();
</script>
</body>
</html>
