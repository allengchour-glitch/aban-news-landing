# Fly.io config for the Aban Studio orchestrator (FastAPI worker).
# EU region for DSGVO data residency.
app = "aban-studio-orchestrator"
primary_region = "fra"            # Frankfurt, EU

[build]
  dockerfile = "../apps/orchestrator/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false      # always-on worker polls the job queue
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
