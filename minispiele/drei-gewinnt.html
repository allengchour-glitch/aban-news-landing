<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="aban-nav" content="off">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Drei gewinnt</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Trebuchet MS',sans-serif;
    background:linear-gradient(160deg,#bce6ff 0%,#eaf7ff 100%);
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    color:#274b63;
    padding:12px;
    user-select:none;
    overflow-x:hidden;
  }
  .back{
    position:fixed;top:12px;left:12px;z-index:10;
    background:#fff;border:none;border-radius:16px;
    padding:10px 16px;font-size:16px;font-weight:700;color:#3a6ea5;
    box-shadow:0 4px 10px rgba(58,110,165,.22);cursor:pointer;min-height:46px;
  }
  .back:active{transform:scale(.95)}
  h1{
    margin-top:58px;font-size:30px;font-weight:900;color:#2f6db3;
    text-shadow:0 2px 0 #fff;letter-spacing:.5px;
  }
  .sub{font-size:15px;color:#5a7d99;margin:4px 0 12px;font-weight:600}
  .status{
    background:#fff;border-radius:20px;padding:12px 20px;
    font-size:20px;font-weight:800;
    box-shadow:0 6px 16px rgba(58,110,165,.18);
    margin-bottom:14px;text-align:center;min-width:230px;
    transition:background .25s;
  }
  .status .turnx{color:#ff5a7a}
  .status .turno{color:#3aa0ff}
  .board{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    width:min(88vw,360px);aspect-ratio:1/1;
    background:#8ecbff;border-radius:24px;padding:10px;
    box-shadow:0 10px 24px rgba(58,110,165,.3);
  }
  .cell{
    background:#fbfdff;border:none;border-radius:16px;
    font-size:min(15vw,60px);font-weight:900;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:#274b63;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.05);
    transition:transform .1s,background .2s;
    min-height:46px;
  }
  .cell:active{transform:scale(.94)}
  .cell.x{color:#ff5a7a}
  .cell.o{color:#3aa0ff}
  .cell.win{background:#fff4b8;box-shadow:0 0 0 4px #ffd83d inset;animation:pop .5s}
  .cell.pop{animation:pop .3s}
  @keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .score{
    display:flex;gap:14px;margin:16px 0 6px;
  }
  .scard{
    background:#fff;border-radius:18px;padding:10px 18px;text-align:center;
    box-shadow:0 5px 14px rgba(58,110,165,.16);min-width:88px;
  }
  .scard .who{font-size:15px;font-weight:800}
  .scard.px .who{color:#ff5a7a}
  .scard.po .who{color:#3aa0ff}
  .scard .val{font-size:26px;font-weight:900;color:#274b63}
  .scard.active{outline:3px solid #ffd83d;transform:translateY(-3px)}
  .btn{
    margin-top:16px;background:#ff5a7a;color:#fff;border:none;
    border-radius:20px;padding:14px 30px;font-size:18px;font-weight:800;
    cursor:pointer;box-shadow:0 6px 14px rgba(255,90,122,.4);min-height:46px;
  }
  .btn:active{transform:scale(.95)}
  .btn.blue{background:#3aa0ff;box-shadow:0 6px 14px rgba(58,160,255,.4)}
  /* End overlay */
  .overlay{
    position:fixed;inset:0;z-index:20;
    background:rgba(190,230,255,.85);backdrop-filter:blur(3px);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;text-align:center;
  }
  .overlay.show{display:flex;animation:fade .3s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay .big{font-size:54px;margin-bottom:6px}
  .overlay .res{font-size:34px;font-weight:900;color:#2f6db3;text-shadow:0 2px 0 #fff}
  .overlay .rsub{font-size:17px;color:#5a7d99;margin-top:8px;font-weight:600}
</style>
</head>
<body>
  <button class="back" onclick="if(window.parent!==window){parent.postMessage('mini-back','*')}else{history.back()}">← Zurück</button>
  <h1>⭕ Drei gewinnt ❌</h1>
  <div class="sub">Zu zweit an einem Gerät · abwechselnd tippen</div>

  <div class="status" id="status"></div>

  <div class="board" id="board"></div>

  <div class="score">
    <div class="scard px" id="cardX"><div class="who">❌ Spieler 1</div><div class="val" id="scoreX">0</div></div>
    <div class="scard po" id="cardO"><div class="who">⭕ Spieler 2</div><div class="val" id="scoreO">0</div></div>
  </div>

  <button class="btn blue" id="resetBtn">🧹 Brett leeren</button>

  <div class="overlay" id="overlay">
    <div class="big" id="ovBig">🎉</div>
    <div class="res" id="ovRes"></div>
    <div class="rsub" id="ovSub"></div>
    <button class="btn" id="againBtn">🔁 Nochmal</button>
  </div>

<script>
(function(){
  "use strict";
  var board=document.getElementById('board');
  var statusEl=document.getElementById('status');
  var overlay=document.getElementById('overlay');
  var ovRes=document.getElementById('ovRes');
  var ovSub=document.getElementById('ovSub');
  var ovBig=document.getElementById('ovBig');
  var cardX=document.getElementById('cardX');
  var cardO=document.getElementById('cardO');
  var scoreXEl=document.getElementById('scoreX');
  var scoreOEl=document.getElementById('scoreO');

  var cells=[];         // DOM buttons
  var grid=[];          // 'X' | 'O' | ''
  var current='X';      // whose turn
  var over=false;
  var scoreX=0, scoreO=0;

  var LINES=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  function buildBoard(){
    board.innerHTML='';
    cells=[];
    grid=new Array(9).fill('');
    for(var i=0;i<9;i++){
      (function(idx){
        var b=document.createElement('button');
        b.className='cell';
        b.setAttribute('aria-label','Feld '+(idx+1));
        b.addEventListener('click',function(){play(idx);});
        board.appendChild(b);
        cells.push(b);
      })(i);
    }
  }

  function symbol(p){return p==='X'?'❌':'⭕';}

  function updateStatus(){
    var cls=current==='X'?'turnx':'turno';
    statusEl.innerHTML='<span class="'+cls+'">'+symbol(current)+' Spieler '+(current==='X'?'1':'2')+'</span> ist dran';
    cardX.classList.toggle('active',current==='X');
    cardO.classList.toggle('active',current==='O');
  }

  function play(idx){
    if(over || grid[idx]!=='') return;
    grid[idx]=current;
    var c=cells[idx];
    c.textContent=symbol(current);
    c.classList.add(current==='X'?'x':'o','pop');
    var win=checkWin(current);
    if(win){
      finish(current,win);
      return;
    }
    if(grid.every(function(v){return v!=='';})){
      finish(null,null); // draw
      return;
    }
    current=current==='X'?'O':'X';
    updateStatus();
  }

  function checkWin(p){
    for(var i=0;i<LINES.length;i++){
      var l=LINES[i];
      if(grid[l[0]]===p && grid[l[1]]===p && grid[l[2]]===p) return l;
    }
    return null;
  }

  function finish(winner,line){
    over=true;
    cardX.classList.remove('active');
    cardO.classList.remove('active');
    if(winner){
      if(line){line.forEach(function(i){cells[i].classList.add('win');});}
      if(winner==='X'){scoreX++;scoreXEl.textContent=scoreX;}
      else{scoreO++;scoreOEl.textContent=scoreO;}
      statusEl.innerHTML='<span class="'+(winner==='X'?'turnx':'turno')+'">'+symbol(winner)+' Spieler '+(winner==='X'?'1':'2')+' gewinnt!</span>';
      setTimeout(function(){
        ovBig.textContent='🎉';
        ovRes.textContent=symbol(winner)+' Spieler '+(winner==='X'?'1':'2')+' gewinnt!';
        ovSub.textContent='Stand: '+scoreX+' : '+scoreO;
        overlay.classList.add('show');
      },700);
    }else{
      statusEl.innerHTML='🤝 Unentschieden!';
      setTimeout(function(){
        ovBig.textContent='🤝';
        ovRes.textContent='Unentschieden!';
        ovSub.textContent='Keiner gewinnt diese Runde · Stand: '+scoreX+' : '+scoreO;
        overlay.classList.add('show');
      },500);
    }
  }

  function newRound(starter){
    overlay.classList.remove('show');
    buildBoard();
    over=false;
    current=starter||'X';
    updateStatus();
  }

  document.getElementById('resetBtn').addEventListener('click',function(){
    newRound(current); // clear board, keep current starter
  });
  document.getElementById('againBtn').addEventListener('click',function(){
    // loser (or alternate) starts next; here just alternate starter for fairness
    newRound(current==='X'?'O':'X');
  });

  // init
  buildBoard();
  updateStatus();
})();
</script>
</body>
</html>
