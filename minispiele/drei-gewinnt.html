<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Trebuchet MS',sans-serif;
    background:linear-gradient(160deg,#bce6ff,#dff2ff,#eaf7ff);
    background-attachment:fixed;
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    color:#274b63;
    padding:12px;
    user-select:none;
    overflow-x:hidden;
  }
  .back{
    position:fixed;top:12px;left:12px;z-index:10;
    background:#fffdf6;border:none;border-radius:14px;
    padding:10px 16px;font-size:16px;font-weight:700;color:#3a7dd8;
    box-shadow:0 4px 14px rgba(40,90,150,.15);cursor:pointer;min-height:46px;
    transition:transform .1s,box-shadow .15s;
  }
  .back:active{transform:scale(.95);box-shadow:0 2px 8px rgba(40,90,150,.15)}
  h1{
    margin-top:58px;font-size:30px;font-weight:900;color:#2f6db3;
    text-shadow:0 2px 0 rgba(255,255,255,.9);letter-spacing:.5px;
  }
  .sub{font-size:15px;color:#5a7d99;margin:4px 0 12px;font-weight:600}
  .status{
    background:#fffdf6;border-radius:14px;padding:12px 20px;
    font-size:20px;font-weight:800;
    box-shadow:0 4px 14px rgba(40,90,150,.15);
    border:1px solid rgba(255,255,255,.8);
    margin-bottom:14px;text-align:center;min-width:230px;
    transition:background .25s;
  }
  .status .turnx{color:#e8574a}
  .status .turno{color:#3a7dd8}
  .board{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    width:min(88vw,360px);aspect-ratio:1/1;
    background:#a7d8ff;
    border-radius:14px;padding:10px;
    box-shadow:0 10px 26px rgba(40,90,150,.28),inset 0 1px 0 rgba(255,255,255,.55);
  }
  .cell{
    background:linear-gradient(175deg,#ffffff,#fffdf6 60%,#f4f0e2);
    border:none;border-radius:14px;
    font-size:min(15vw,60px);font-weight:900;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:#274b63;
    box-shadow:0 4px 10px rgba(40,90,150,.14),inset 0 -3px 0 rgba(40,90,150,.06);
    transition:transform .1s,background .2s;
    min-height:46px;
  }
  .cell:active{transform:scale(.94)}
  .cell.x{color:#e8574a;text-shadow:0 3px 6px rgba(232,87,74,.28)}
  .cell.o{color:#3a7dd8;text-shadow:0 3px 6px rgba(58,125,216,.28)}
  .cell.win{background:#fff7d0;box-shadow:0 0 0 4px #ffcf3a inset,0 4px 14px rgba(255,140,42,.35);animation:pop .5s}
  .cell.pop{animation:pop .3s}
  @keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .score{
    display:flex;gap:14px;margin:16px 0 6px;
  }
  .scard{
    background:#fffdf6;border-radius:14px;padding:10px 18px;text-align:center;
    box-shadow:0 4px 14px rgba(40,90,150,.15);min-width:88px;
    border:1px solid rgba(255,255,255,.8);
    transition:transform .15s,outline-color .15s;
  }
  .scard .who{font-size:15px;font-weight:800}
  .scard.px .who{color:#e8574a}
  .scard.po .who{color:#3a7dd8}
  .scard .val{font-size:26px;font-weight:900;color:#274b63}
  .scard.active{outline:3px solid #ffcf3a;transform:translateY(-3px);box-shadow:0 8px 18px rgba(255,140,42,.25)}
  .btn{
    margin-top:16px;background:#f0685c;color:#fff;border:none;
    border-radius:14px;padding:14px 30px;font-size:18px;font-weight:800;
    cursor:pointer;box-shadow:0 6px 16px rgba(232,87,74,.35),inset 0 1px 0 rgba(255,255,255,.35);min-height:46px;
  }
  .btn:active{transform:scale(.95)}
  .btn.blue{background:#4c8ce2;box-shadow:0 6px 16px rgba(58,125,216,.35),inset 0 1px 0 rgba(255,255,255,.35)}
  /* End overlay */
  .overlay{
    position:fixed;inset:0;z-index:20;
    background:rgba(223,242,255,.88);backdrop-filter:blur(4px);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;text-align:center;
  }
  .overlay.show{display:flex;animation:fade .3s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay .big{font-size:54px;margin-bottom:6px}
  .overlay .res{font-size:34px;font-weight:900;color:#2f6db3;text-shadow:0 2px 0 rgba(255,255,255,.9)}
  .overlay .rsub{font-size:17px;color:#5a7d99;margin-top:8px;font-weight:600}
  /* Konfetti */
  .confetti{
    position:fixed;top:-16px;z-index:30;border-radius:8px;pointer-events:none;
    animation:cfall linear forwards;
  }
  @keyframes cfall{to{transform:translateY(112vh) rotate(720deg)}}
</style>
</head>
<body>
  <button class="back" onclick="if(window.parent!==window){parent.postMessage('mini-back','*')}else{history.back()}">← Zurück</button>
  <h1>⭕ Drei gewinnt ❌</h1>
  <div class="sub">Zu zweit an einem Gerät · abwechselnd tippen</div>

  <div class="status" id="status"></div>

  <div class="board" id="board"></div>

  <div class="score">
    <div class="scard px" id="cardX"><div class="who">❌ Spieler 1</div><div class="val" id="scoreX">0</div></div>
    <div class="scard po" id="cardO"><div class="who">⭕ Spieler 2</div><div class="val" id="scoreO">0</div></div>
  </div>

  <button class="btn blue" id="resetBtn">🧹 Brett leeren</button>

  <div class="overlay" id="overlay">
    <div class="big" id="ovBig">🎉</div>
    <div class="res" id="ovRes"></div>
    <div class="rsub" id="ovSub"></div>
    <button class="btn" id="againBtn">🔁 Nochmal</button>
  </div>

<script>
(function(){
  "use strict";
  var board=document.getElementById('board');
  var statusEl=document.getElementById('status');
  var overlay=document.getElementById('overlay');
  var ovRes=document.getElementById('ovRes');
  var ovSub=document.getElementById('ovSub');
  var ovBig=document.getElementById('ovBig');
  var cardX=document.getElementById('cardX');
  var cardO=document.getElementById('cardO');
  var scoreXEl=document.getElementById('scoreX');
  var scoreOEl=document.getElementById('scoreO');

  var cells=[];         // DOM buttons
  var grid=[];          // 'X' | 'O' | ''
  var current='X';      // whose turn
  var over=false;
  var scoreX=0, scoreO=0;

  var LINES=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  function buildBoard(){
    board.innerHTML='';
    cells=[];
    grid=new Array(9).fill('');
    for(var i=0;i<9;i++){
      (function(idx){
        var b=document.createElement('button');
        b.className='cell';
        b.setAttribute('aria-label','Feld '+(idx+1));
        b.addEventListener('click',function(){play(idx);});
        board.appendChild(b);
        cells.push(b);
      })(i);
    }
  }

  function symbol(p){return p==='X'?'❌':'⭕';}

  function updateStatus(){
    var cls=current==='X'?'turnx':'turno';
    statusEl.innerHTML='<span class="'+cls+'">'+symbol(current)+' Spieler '+(current==='X'?'1':'2')+'</span> ist dran';
    cardX.classList.toggle('active',current==='X');
    cardO.classList.toggle('active',current==='O');
  }

  function play(idx){
    if(over || grid[idx]!=='') return;
    grid[idx]=current;
    var c=cells[idx];
    c.textContent=symbol(current);
    c.classList.add(current==='X'?'x':'o','pop');
    var win=checkWin(current);
    if(win){
      finish(current,win);
      return;
    }
    if(grid.every(function(v){return v!=='';})){
      finish(null,null); // draw
      return;
    }
    current=current==='X'?'O':'X';
    updateStatus();
  }

  function confetti(){
    var colors=['#ffcf3a','#ff8c2a','#e8574a','#3a7dd8','#7ed957','#fffdf6'];
    for(var i=0;i<60;i++){
      var s=document.createElement('div');
      s.className='confetti';
      s.style.left=(Math.random()*100)+'vw';
      s.style.width=(6+Math.random()*6)+'px';
      s.style.height=(8+Math.random()*8)+'px';
      s.style.background=colors[i%colors.length];
      s.style.animationDuration=(1.6+Math.random()*1.6)+'s';
      s.style.animationDelay=(Math.random()*0.5)+'s';
      document.body.appendChild(s);
      (function(el){setTimeout(function(){if(el.parentNode){el.parentNode.removeChild(el);}},4200);})(s);
    }
  }

  function checkWin(p){
    for(var i=0;i<LINES.length;i++){
      var l=LINES[i];
      if(grid[l[0]]===p && grid[l[1]]===p && grid[l[2]]===p) return l;
    }
    return null;
  }

  function finish(winner,line){
    over=true;
    cardX.classList.remove('active');
    cardO.classList.remove('active');
    if(winner){
      if(line){line.forEach(function(i){cells[i].classList.add('win');});}
      if(winner==='X'){scoreX++;scoreXEl.textContent=scoreX;}
      else{scoreO++;scoreOEl.textContent=scoreO;}
      statusEl.innerHTML='<span class="'+(winner==='X'?'turnx':'turno')+'">'+symbol(winner)+' Spieler '+(winner==='X'?'1':'2')+' gewinnt!</span>';
      confetti();
      setTimeout(function(){
        ovBig.textContent='🎉';
        ovRes.textContent=symbol(winner)+' Spieler '+(winner==='X'?'1':'2')+' gewinnt!';
        ovSub.textContent='Stand: '+scoreX+' : '+scoreO;
        overlay.classList.add('show');
      },700);
    }else{
      statusEl.innerHTML='🤝 Unentschieden!';
      setTimeout(function(){
        ovBig.textContent='🤝';
        ovRes.textContent='Unentschieden!';
        ovSub.textContent='Keiner gewinnt diese Runde · Stand: '+scoreX+' : '+scoreO;
        overlay.classList.add('show');
      },500);
    }
  }

  function newRound(starter){
    overlay.classList.remove('show');
    buildBoard();
    over=false;
    current=starter||'X';
    updateStatus();
  }

  document.getElementById('resetBtn').addEventListener('click',function(){
    newRound(current); // clear board, keep current starter
  });
  document.getElementById('againBtn').addEventListener('click',function(){
    // loser (or alternate) starts next; here just alternate starter for fairness
    newRound(current==='X'?'O':'X');
  });

  // init
  buildBoard();
  updateStatus();
})();
</script>
