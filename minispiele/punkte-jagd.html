<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="aban-nav" content="off">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<link rel="canonical" href="https://abannews.com/minispiele/punkte-jagd.html">

<meta property="og:title" content="Punkte-Jagd 🌟">

<meta name="twitter:card" content="summary_large_image">
<meta property="og:description" content="Punkte-Jagd: erscheinende Ziele schneller antippen als der Gegner.">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Baloo 2", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #bce6ff 0%, #dff2ff 55%, #eaf7ff 100%);
    color: #2a3d55;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  .backbtn {
    position: fixed; top: 10px; left: 10px; z-index: 50;
    min-height: 46px; padding: 8px 16px;
    background: #fffdf6; color: #2a3d55; border: none; border-radius: 16px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 14px rgba(40,90,150,.15);
  }
  .backbtn:active { transform: scale(.95); }

  /* Playfield: two half-screens stacked (top rotated for face-to-face play) */
  .field { position: relative; flex: 1; overflow: hidden; }
  .top    { background: linear-gradient(180deg, #ffe3ea, #ffd2de); }
  .bottom { background: linear-gradient(180deg, #dcedff, #c6e1fb); }

  .half-info {
    position: absolute; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-weight: 800; font-size: 20px; pointer-events: none;
    padding: 6px 10px;
  }
  .top .half-info { top: 6px; transform: rotate(180deg); }
  .bottom .half-info { bottom: 6px; }

  .p1c { color: #e8574a; }
  .p2c { color: #3a7dd8; }

  .star {
    position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px;
    display: flex; align-items: center; justify-content: center;
    font-size: 54px; cursor: pointer; z-index: 3;
    transition: transform .06s ease-out;
    filter: drop-shadow(0 0 12px rgba(255,207,58,.85)) drop-shadow(0 4px 6px rgba(0,0,0,.18));
    animation: twinkle 1.4s ease-in-out infinite alternate;
  }
  .star.pop { animation: pop .28s ease-out, twinkle 1.4s ease-in-out .28s infinite alternate; }
  @keyframes pop { 0%{transform:scale(.2) rotate(-40deg);opacity:0} 60%{transform:scale(1.15) rotate(8deg);opacity:1} 100%{transform:scale(1) rotate(0)} }
  @keyframes twinkle {
    from { filter: drop-shadow(0 0 8px rgba(255,207,58,.6)) drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
    to   { filter: drop-shadow(0 0 16px rgba(255,207,58,1)) drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
  }
  .spark {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: #ffcf3a; box-shadow: 0 0 8px rgba(255,207,58,.95);
    pointer-events: none; z-index: 7;
    animation: spark .55s ease-out forwards;
  }
  @keyframes spark {
    from { transform: translate(0,0) scale(1); opacity: 1; }
    to   { transform: translate(var(--dx), var(--dy)) scale(.15); opacity: 0; }
  }

  .float {
    position: absolute; font-weight: 900; font-size: 28px; z-index: 8;
    pointer-events: none; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,.25);
    animation: floatUp .7s ease-out forwards;
  }
  @keyframes floatUp { from{transform:translateY(0);opacity:1} to{transform:translateY(-50px);opacity:0} }

  /* Timer bar in the middle */
  .timerbar {
    height: 54px; background: #fffdf6; display: flex; align-items: center;
    justify-content: center; gap: 14px; z-index: 20;
    box-shadow: 0 0 14px rgba(40,90,150,.28);
  }
  .clock { font-size: 26px; font-weight: 900; color: #2a3d55; min-width: 92px; text-align: center; }
  .mini { font-size: 17px; font-weight: 800; }

  /* Overlays */
  .overlay {
    position: absolute; inset: 0; z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 18px; padding: 24px;
    background: rgba(255,255,255,.72); backdrop-filter: blur(3px);
  }
  .card {
    background: #fffdf6; border-radius: 20px; padding: 28px 24px;
    box-shadow: 0 12px 34px rgba(40,90,150,.28);
    max-width: 340px; width: 100%;
  }
  h1 { font-size: 34px; color: #2a3d55; margin-bottom: 6px; }
  .sub { font-size: 17px; color: #5a6b82; line-height: 1.45; margin-bottom: 8px; }
  .bigbtn {
    min-height: 56px; width: 100%; margin-top: 14px;
    background: linear-gradient(180deg,#ffcf3a,#ff8c2a); color: #7a3d00;
    border: none; border-radius: 20px; font-size: 22px; font-weight: 900;
    cursor: pointer; box-shadow: 0 5px 0 #d97a1e, 0 8px 18px rgba(40,90,150,.18);
  }
  .bigbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d97a1e; }
  .result-big { font-size: 40px; font-weight: 900; margin: 4px 0; }
  .scorerow { display: flex; justify-content: center; gap: 22px; font-size: 22px; font-weight: 800; margin: 8px 0; }
  .hidden { display: none !important; }
  .go-label { font-size: 15px; color:#8090a5; font-weight:700; }
</style>
</head>
<body>
<button class="backbtn" onclick="if(window.parent!==window){parent.postMessage('mini-back','*')}else{history.back()}">← Zurück</button>

<div id="app">
  <div class="field top" id="fieldTop">
    <div class="half-info"><span class="p1c">🔴 Spieler 1</span> · <span id="s1" class="p1c">0</span></div>
  </div>

  <div class="timerbar">
    <span class="mini p1c" id="ts1">0</span>
    <span class="clock" id="clock">30</span>
    <span class="mini p2c" id="ts2">0</span>
  </div>

  <div class="field bottom" id="fieldBottom">
    <div class="half-info"><span class="p2c">🔵 Spieler 2</span> · <span id="s2" class="p2c">0</span></div>
  </div>

  <!-- Start overlay -->
  <div class="overlay" id="startOv">
    <div class="card">
      <h1>🌟 Punkte-Jagd</h1>
      <p class="sub">Zwei Spieler, ein Gerät!<br>Auf jeder Hälfte springt ein Stern umher.<br><b>Tippe ihn schnell an</b> – schon kommt der nächste.</p>
      <p class="sub">Wer in <b>30 Sekunden</b> mehr Sterne fängt, gewinnt!</p>
      <p class="go-label">🔴 oben &nbsp;•&nbsp; 🔵 unten</p>
      <div style="margin-top:10px;font-size:11px;opacity:.6"><a href="/impressum.html" style="color:inherit">Impressum</a> · <a href="/datenschutz.html" style="color:inherit">Datenschutz</a></div>
      <button class="bigbtn" id="startBtn">Los geht's!</button>
    </div>
  </div>

  <!-- End overlay -->
  <div class="overlay hidden" id="endOv">
    <div class="card">
      <div class="result-big" id="resultEmoji">🏆</div>
      <h1 id="resultTitle">Ergebnis</h1>
      <div class="scorerow"><span class="p1c">🔴 <span id="es1">0</span></span><span class="p2c">🔵 <span id="es2">0</span></span></div>
      <p class="sub" id="resultSub"></p>
      <button class="bigbtn" id="againBtn">🔁 Nochmal</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var STARS = ["⭐","🌟","✨","💫"];
  var GAME_SECONDS = 30;

  var fieldTop = document.getElementById("fieldTop");
  var fieldBottom = document.getElementById("fieldBottom");
  var s1El = document.getElementById("s1"), s2El = document.getElementById("s2");
  var ts1El = document.getElementById("ts1"), ts2El = document.getElementById("ts2");
  var clockEl = document.getElementById("clock");
  var startOv = document.getElementById("startOv");
  var endOv = document.getElementById("endOv");

  var state = {
    running: false,
    score: [0,0],
    timeLeft: GAME_SECONDS,
    stars: [null,null],   // current star element per half
    rafId: 0,
    endAt: 0,
    lastTick: -1
  };

  var fields = [fieldTop, fieldBottom];

  function rand(min,max){ return Math.random()*(max-min)+min; }

  function placeStar(player){
    var field = fields[player];
    // remove old
    if(state.stars[player] && state.stars[player].parentNode){
      state.stars[player].parentNode.removeChild(state.stars[player]);
    }
    var el = document.createElement("div");
    el.className = "star pop";
    el.textContent = STARS[Math.floor(Math.random()*STARS.length)];
    var w = field.clientWidth, h = field.clientHeight;
    var m = 42; // margin so star stays fully inside
    var x = rand(m, Math.max(m+1, w-m));
    var y = rand(m+30, Math.max(m+31, h-m)); // avoid the info label zone a bit
    el.style.left = x + "px";
    el.style.top = y + "px";

    function grab(ev){
      ev.preventDefault();
      ev.stopPropagation();
      if(!state.running) return;
      hit(player, x, y);
    }
    el.addEventListener("touchstart", grab, {passive:false});
    el.addEventListener("mousedown", grab);

    field.appendChild(el);
    state.stars[player] = el;
  }

  function hit(player, x, y){
    state.score[player]++;
    updateScores();
    showFloat(player, x, y);
    showSparks(player, x, y);
    placeStar(player);
  }

  function showSparks(player, x, y){
    /* kleine leuchtende Fang-Partikel, fliegen sternförmig auseinander */
    var field = fields[player];
    for(var i=0;i<7;i++){
      var sp = document.createElement("div");
      sp.className = "spark";
      var ang = (Math.PI*2/7)*i + rand(-0.3,0.3);
      var dist = rand(34,66);
      sp.style.left = (x-4) + "px";
      sp.style.top = (y-4) + "px";
      sp.style.setProperty("--dx", Math.round(Math.cos(ang)*dist) + "px");
      sp.style.setProperty("--dy", Math.round(Math.sin(ang)*dist) + "px");
      field.appendChild(sp);
      (function(node){
        setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 600);
      })(sp);
    }
  }

  function showFloat(player, x, y){
    var field = fields[player];
    var f = document.createElement("div");
    f.className = "float";
    f.textContent = "+1";
    f.style.left = (x-12) + "px";
    f.style.top = (y-20) + "px";
    field.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 720);
  }

  function updateScores(){
    s1El.textContent = state.score[0];
    s2El.textContent = state.score[1];
    ts1El.textContent = state.score[0];
    ts2El.textContent = state.score[1];
  }

  function loop(now){
    if(!state.running) return;
    var remainMs = state.endAt - now;
    if(remainMs <= 0){
      state.timeLeft = 0;
      clockEl.textContent = "0";
      endGame();
      return;
    }
    var secs = Math.ceil(remainMs/1000);
    if(secs !== state.lastTick){
      state.lastTick = secs;
      clockEl.textContent = secs;
      if(secs <= 5){ clockEl.style.color = "#e03131"; }
    }
    state.rafId = requestAnimationFrame(loop);
  }

  function startGame(){
    state.running = true;
    state.score = [0,0];
    state.lastTick = -1;
    clockEl.style.color = "#2a3d55";
    updateScores();
    startOv.classList.add("hidden");
    endOv.classList.add("hidden");
    // clear stray stars/floats
    document.querySelectorAll(".star,.float,.spark").forEach(function(n){ n.remove(); });
    state.stars = [null,null];
    placeStar(0);
    placeStar(1);
    state.endAt = performance.now() + GAME_SECONDS*1000;
    cancelAnimationFrame(state.rafId);
    state.rafId = requestAnimationFrame(loop);
  }

  function endGame(){
    state.running = false;
    cancelAnimationFrame(state.rafId);
    // remove active stars
    state.stars.forEach(function(el){ if(el && el.parentNode) el.parentNode.removeChild(el); });
    state.stars = [null,null];

    var a = state.score[0], b = state.score[1];
    document.getElementById("es1").textContent = a;
    document.getElementById("es2").textContent = b;
    var emoji = document.getElementById("resultEmoji");
    var title = document.getElementById("resultTitle");
    var sub = document.getElementById("resultSub");

    if(a === b){
      emoji.textContent = "🤝";
      title.textContent = "Unentschieden!";
      sub.textContent = "Gleichstand mit je " + a + " Sternen. Super gespielt, beide!";
    } else if(a > b){
      emoji.textContent = "🏆";
      title.innerHTML = '<span class="p1c">🔴 Spieler 1 gewinnt!</span>';
      sub.textContent = "Mit " + a + " gegen " + b + " Sternen. Toll gefangen!";
    } else {
      emoji.textContent = "🏆";
      title.innerHTML = '<span class="p2c">🔵 Spieler 2 gewinnt!</span>';
      sub.textContent = "Mit " + b + " gegen " + a + " Sternen. Toll gefangen!";
    }
    endOv.classList.remove("hidden");
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("againBtn").addEventListener("click", startGame);

  // Safety: pause loop if tab hidden, resume by recomputing endAt offset
  document.addEventListener("visibilitychange", function(){
    if(document.hidden && state.running){
      state._pausedRemain = state.endAt - performance.now();
      cancelAnimationFrame(state.rafId);
    } else if(!document.hidden && state.running && state._pausedRemain != null){
      state.endAt = performance.now() + state._pausedRemain;
      state._pausedRemain = null;
      state.rafId = requestAnimationFrame(loop);
    }
  });
})();
</script>
</body>
</html>
