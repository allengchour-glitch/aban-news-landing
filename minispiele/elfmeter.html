<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #bce6ff 0%, #dff2ff 55%, #eaf7ff 100%);
    color: #1c3d5a;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
    touch-action: manipulation;
  }
  .back {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    background: #fffdf6; border: none; border-radius: 14px;
    padding: 10px 16px; font-size: 16px; font-weight: bold; color: #1c3d5a;
    box-shadow: 0 4px 14px rgba(40,90,150,.15); cursor: pointer;
  }
  .back:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(40,90,150,.15); }
  .wrap { width: 100%; max-width: 460px; padding: 58px 12px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 27px; text-align: center; letter-spacing: .5px; text-shadow: 0 2px 0 rgba(255,255,255,.7); }
  h1 small { display:block; font-size: 14px; font-weight: normal; opacity:.75; margin-top:3px;}

  .scoreboard {
    display: flex; gap: 10px; width: 100%; justify-content: center;
  }
  .pcard {
    flex: 1; background: #fffdf6; border-radius: 14px; padding: 10px 8px; text-align: center;
    box-shadow: 0 4px 14px rgba(40,90,150,.15); border: 3px solid transparent; transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  .pcard.p1 { color: #e8574a; }
  .pcard.p2 { color: #3a7dd8; }
  .pcard.active { border-color: currentColor; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(40,90,150,.22); }
  .pcard .name { font-size: 15px; font-weight: bold; }
  .pcard .score { font-size: 32px; font-weight: 900; line-height: 1.1; }
  .pcard .shots { font-size: 17px; letter-spacing: 2px; min-height: 22px; }

  .turnbar {
    background: #fffdf6; border-radius: 14px; padding: 11px 14px; text-align: center;
    font-size: 17px; font-weight: bold; box-shadow: 0 4px 14px rgba(40,90,150,.15); width: 100%;
  }
  .turnbar b.r1 { color:#e8574a } .turnbar b.r2 { color:#3a7dd8 }

  canvas {
    width: 100%; max-width: 436px; aspect-ratio: 436 / 300; height: auto;
    border-radius: 14px;
    background: linear-gradient(#9fd9ff 0%, #bff0d0 45%, #6fbf62 100%);
    box-shadow: 0 10px 24px rgba(40,90,150,.20); display: block;
  }

  .controls { display: flex; gap: 10px; width: 100%; }
  .zbtn {
    flex: 1; border: none; border-radius: 14px; padding: 16px 4px; font-size: 24px;
    font-weight: bold; background: #fffdf6; color: #1c3d5a;
    box-shadow: 0 4px 14px rgba(40,90,150,.15);
    cursor: pointer; min-height: 58px;
  }
  .zbtn .lbl { display:block; font-size:12px; margin-top:2px; opacity:.7 }
  .zbtn:active { transform: translateY(3px); box-shadow: 0 2px 6px rgba(40,90,150,.15); }
  .zbtn.chosen { background: #ffcf3a; box-shadow: 0 4px 14px rgba(224,160,20,.35); }
  .zbtn:disabled { opacity: .5; }

  .hint { font-size: 14px; text-align:center; opacity:.8; min-height: 20px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(20,50,80,.78); z-index: 30;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .endcard {
    background: #fffdf6; border-radius: 14px; padding: 28px 24px; text-align: center;
    max-width: 360px; width: 100%; box-shadow: 0 14px 34px rgba(20,50,90,.35);
  }
  .endcard .trophy { font-size: 68px; }
  .endcard h2 { margin: 8px 0 4px; font-size: 26px; }
  .endcard .fin { font-size: 22px; font-weight: bold; margin: 8px 0 16px; }
  .again {
    border: none; border-radius: 14px; padding: 16px 22px; font-size: 20px; font-weight: bold;
    background: linear-gradient(180deg,#ffcf3a,#ff8c2a); color: #fff;
    text-shadow: 0 1px 2px rgba(120,60,0,.35);
    box-shadow: 0 5px 0 #d9821e, 0 8px 18px rgba(224,140,40,.35); cursor: pointer; min-height: 56px; width:100%;
  }
  .again:active { transform: translateY(3px); box-shadow: 0 2px 0 #d9821e; }
</style>

<body>
<button class="back" onclick="if(window.parent!==window){parent.postMessage('mini-back','*')}else{history.back()}">← Zurück</button>

<div class="wrap">
  <h1>⚽ Elfmeterschiessen<small>Je 5 Schüsse · mehr Tore gewinnt</small></h1>

  <div class="scoreboard">
    <div class="pcard p1" id="card1">
      <div class="name">🔴 Spieler 1</div>
      <div class="score" id="score1">0</div>
      <div class="shots" id="shots1"></div>
    </div>
    <div class="pcard p2" id="card2">
      <div class="name">🔵 Spieler 2</div>
      <div class="score" id="score2">0</div>
      <div class="shots" id="shots2"></div>
    </div>
  </div>

  <div class="turnbar" id="turnbar">Runde 1 · <b class="r1">Spieler 1</b> schiesst</div>

  <canvas id="cv"></canvas>

  <div class="hint" id="hint">Wähle deine Ecke: links, Mitte oder rechts.</div>

  <div class="controls">
    <button class="zbtn" data-z="0" id="z0">⬅️<span class="lbl">Links</span></button>
    <button class="zbtn" data-z="1" id="z1">⬆️<span class="lbl">Mitte</span></button>
    <button class="zbtn" data-z="2" id="z2">➡️<span class="lbl">Rechts</span></button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="endcard">
    <div class="trophy" id="trophy">🏆</div>
    <h2 id="endtitle">Ergebnis</h2>
    <div class="fin" id="endscore"></div>
    <button class="again" onclick="restart()">🔁 Nochmal</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  /* --- Scharfes DPR-Rendering: Backing-Store = CSS-Groesse x dpr (Cap 3) --- */
  let W = 436, H = 300; /* CSS-Pixel, bei resize aktualisiert */
  function setupCanvas(){
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = rect.width  || 436;
    H = rect.height || (W * 300 / 436);
    cv.width  = Math.max(1, Math.round(W * dpr));
    cv.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', function(){ setupCanvas(); render(); });

  /* Spielkoordinaten als Anteile der CSS-Groesse (skalieren sauber mit) */
  const ZONE_UX = [0.30, 0.50, 0.70]; /* links, mitte, rechts */
  const GOAL_UY = 0.31;               /* Ballruhelage im Tor */

  // Spielzustand
  let scores, shotLog, round, shooter, phase, chosenZone, keeperZone, anim, message;
  // phase: 'aim' (Schütze wählt), 'keeper' (Torwart wählt), 'shot' (Animation), 'over'
  const TOTAL = 5;

  function reset(){
    scores = [0,0];
    shotLog = [[],[]]; // Arrays aus '⚽'(Tor) oder '🧤'(gehalten)
    round = 1;
    shooter = 0;
    phase = 'aim';
    chosenZone = -1;
    keeperZone = -1;
    message = '';
    particles = [];
    stopAnim();
    updateUI();
    render();
  }

  function stopAnim(){ if(anim){ cancelAnimationFrame(anim); anim=null; } }

  function updateUI(){
    document.getElementById('score1').textContent = scores[0];
    document.getElementById('score2').textContent = scores[1];
    document.getElementById('shots1').textContent = renderShots(0);
    document.getElementById('shots2').textContent = renderShots(1);
    document.getElementById('card1').classList.toggle('active', shooter===0 && phase!=='over');
    document.getElementById('card2').classList.toggle('active', shooter===1 && phase!=='over');

    const tb = document.getElementById('turnbar');
    const hint = document.getElementById('hint');
    const keeper = 1 - shooter;
    const sName = shooter===0 ? '<b class="r1">🔴 Spieler 1</b>' : '<b class="r2">🔵 Spieler 2</b>';
    const kName = keeper===0 ? '<b class="r1">🔴 Spieler 1</b>' : '<b class="r2">🔵 Spieler 2</b>';

    if(phase==='aim'){
      tb.innerHTML = 'Runde '+round+' · '+sName+' schiesst';
      hint.textContent = 'Schütze: Wähle deine Ecke! (Torwart nicht spicken 🙈)';
    } else if(phase==='keeper'){
      tb.innerHTML = 'Runde '+round+' · '+kName+' hält';
      hint.textContent = 'Torwart: In welche Ecke springst du?';
    } else if(phase==='shot'){
      tb.innerHTML = message || 'Schuss!';
      hint.textContent = '';
    } else if(phase==='over'){
      tb.innerHTML = 'Spiel beendet';
      hint.textContent = '';
    }
    // Buttons
    const active = (phase==='aim' || phase==='keeper');
    for(let i=0;i<3;i++){
      const b = document.getElementById('z'+i);
      b.disabled = !active;
      b.classList.toggle('chosen', phase==='keeper' && chosenZone>=0 && false);
    }
  }

  function renderShots(p){
    let out = '';
    for(let i=0;i<TOTAL;i++){
      if(i < shotLog[p].length) out += shotLog[p][i];
      else out += '◦';
    }
    return out;
  }

  // ---- Zeichnen ----
  /* Positionen in Anteilen (ux/uy), Radius als Anteil von W */
  let ball = { ux: 0.5, uy: 0.867, ur: 0.030 };
  let keeper = { ux: 0.5, uy: GOAL_UY + 0.113 };
  let particles = []; /* Jubel-Konfetti */

  function render(){
    ctx.clearRect(0,0,W,H);
    drawField();
    drawGoal();
    drawKeeper(keeper.ux*W, keeper.uy*H);
    drawShooter();
    drawBall(ball.ux*W, ball.uy*H, ball.ur*W);
    drawParticles();
  }

  function drawField(){
    /* Himmel */
    const sky = ctx.createLinearGradient(0, 0, 0, H*0.42);
    sky.addColorStop(0, '#8ecff7');
    sky.addColorStop(1, '#d4efff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H*0.42);
    /* Rasen-Verlauf */
    const grass = ctx.createLinearGradient(0, H*0.28, 0, H);
    grass.addColorStop(0, '#93d47e');
    grass.addColorStop(0.5, '#79c468');
    grass.addColorStop(1, '#57ae4f');
    ctx.fillStyle = grass;
    ctx.fillRect(0, H*0.28, W, H*0.72);
    /* Maehstreifen mit Perspektive */
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    let y = H*0.30, hh = H*0.045, k = 0;
    while(y < H){
      if(k % 2 === 0) ctx.fillRect(0, y, W, hh);
      y += hh; hh *= 1.3; k++;
    }
    /* Strafraum */
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = Math.max(2, W*0.007);
    ctx.strokeRect(W*0.12, H*0.48, W*0.76, H*0.393);
    /* Elfmeterpunkt */
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(W*0.5, H*0.847, Math.max(2.5, W*0.008), 0, 7); ctx.fill();
  }

  function drawGoal(){
    const gx = W*0.16, gw = W*0.68, gy = H*0.10, gh = H*0.233;
    /* Schatten des Tors auf dem Rasen */
    ctx.fillStyle = 'rgba(30,80,40,0.13)';
    ctx.beginPath();
    ctx.ellipse(gx+gw/2, gy+gh+H*0.012, gw*0.54, H*0.018, 0, 0, 7);
    ctx.fill();
    /* Netz-Flaeche */
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillRect(gx, gy, gw, gh);
    /* Netz-Muster: Rauten (diagonale Linien) */
    ctx.save();
    ctx.beginPath(); ctx.rect(gx, gy, gw, gh); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    const step = Math.max(9, W*0.030);
    for(let x = gx - gh; x <= gx + gw; x += step){
      ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + gh, gy + gh); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + gh, gy); ctx.lineTo(x, gy + gh); ctx.stroke();
    }
    ctx.restore();
    /* Pfosten + Latte mit weicher Kontur */
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(90,120,140,0.5)';
    ctx.lineWidth = Math.max(6, W*0.020);
    ctx.beginPath();
    ctx.moveTo(gx, gy+gh); ctx.lineTo(gx, gy); ctx.lineTo(gx+gw, gy); ctx.lineTo(gx+gw, gy+gh);
    ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(4.5, W*0.015);
    ctx.beginPath();
    ctx.moveTo(gx, gy+gh); ctx.lineTo(gx, gy); ctx.lineTo(gx+gw, gy); ctx.lineTo(gx+gw, gy+gh);
    ctx.stroke();
  }

  function drawKeeper(x,y){
    /* Schatten unter dem Torwart */
    ctx.fillStyle = 'rgba(20,60,30,0.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + W*0.062, W*0.055, W*0.016, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#000'; /* volle Deckkraft fuer Farb-Emoji */
    ctx.font = Math.round(W*0.115) + 'px "Segoe UI Emoji","Noto Color Emoji",serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🧤', x, y);
  }

  function drawShooter(){
    /* Schuetze steht schraeg hinter dem Ball (nur Deko) */
    const x = W*0.345, y = H*0.905;
    ctx.fillStyle = 'rgba(20,60,30,0.16)';
    ctx.beginPath();
    ctx.ellipse(x, y + W*0.055, W*0.048, W*0.014, 0, 0, 7);
    ctx.fill();
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(-1, 1); /* Blick Richtung Ball */
    ctx.fillStyle = '#000'; /* volle Deckkraft fuer Farb-Emoji */
    ctx.font = Math.round(W*0.105) + 'px "Segoe UI Emoji","Noto Color Emoji",serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🏃', 0, 0);
    ctx.restore();
  }

  function pentagonPath(x, y, r, rot){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a = rot + i * Math.PI*2/5;
      const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  function drawBall(x,y,r){
    /* Ball-Schatten */
    ctx.fillStyle = 'rgba(20,60,30,0.22)';
    ctx.beginPath();
    ctx.ellipse(x, y + r*1.25, r*0.95, r*0.34, 0, 0, 7);
    ctx.fill();
    /* Kugel mit Schattierung */
    const g = ctx.createRadialGradient(x - r*0.38, y - r*0.42, r*0.12, x, y, r*1.05);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.65, '#f1f5f8');
    g.addColorStop(1, '#b9c6d1');
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(90,110,130,0.65)';
    ctx.lineWidth = Math.max(1, r*0.09);
    ctx.stroke();
    /* Panel-Flecken (im Kreis geclippt) */
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r*0.96, 0, 7); ctx.clip();
    ctx.fillStyle = '#2e3d4a';
    pentagonPath(x, y - r*0.05, r*0.34, -Math.PI/2); ctx.fill();
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + i * Math.PI*2/5 + Math.PI/5;
      pentagonPath(x + Math.cos(a)*r*0.85, y + Math.sin(a)*r*0.85, r*0.22, a); ctx.fill();
    }
    ctx.restore();
  }

  /* ---- Jubel-Konfetti ---- */
  const CONF_COLORS = ['#ffcf3a','#ff8c2a','#e8574a','#3a7dd8','#7ac96b','#ffffff'];
  function spawnConfetti(x, y){
    particles = [];
    for(let i=0;i<42;i++){
      const a = Math.random()*Math.PI*2;
      const sp = (0.4 + Math.random()*1.1) * W*0.012;
      particles.push({
        x: x + (Math.random()-0.5)*W*0.10,
        y: y + (Math.random()-0.5)*H*0.06,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp - W*0.008,
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.35,
        s: W*(0.010 + Math.random()*0.012),
        c: CONF_COLORS[i % CONF_COLORS.length],
        life: 46 + Math.random()*14
      });
    }
    let frames = 0;
    function cstep(){
      frames++;
      let alive = false;
      for(const p of particles){
        p.x += p.vx; p.y += p.vy;
        p.vy += W*0.0009;   /* Schwerkraft */
        p.vx *= 0.985;
        p.rot += p.vr;
        p.life--;
        if(p.life > 0) alive = true;
      }
      render();
      if(alive && frames < 70){
        anim = requestAnimationFrame(cstep);
      } else {
        anim = null;
        particles = [];
        render();
      }
    }
    stopAnim();
    anim = requestAnimationFrame(cstep);
  }
  function drawParticles(){
    for(const p of particles){
      if(p.life <= 0) continue;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life/22));
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s/2, -p.s/3, p.s, p.s*0.66);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ---- Ablauf ----
  function onZone(z){
    if(phase==='aim'){
      chosenZone = z;
      phase = 'keeper';
      updateUI();
    } else if(phase==='keeper'){
      keeperZone = z;
      phase = 'shot';
      updateUI();
      shoot();
    }
  }

  function shoot(){
    const targetUX = ZONE_UX[chosenZone];
    const keeperTargetUX = ZONE_UX[keeperZone];
    const saved = (chosenZone === keeperZone);

    // Startwerte
    ball.ux = 0.5; ball.uy = 0.867; ball.ur = 0.030;
    keeper.ux = 0.5; keeper.uy = GOAL_UY + 0.113;

    const startUX = ball.ux, startUY = ball.uy;
    const endUY = GOAL_UY + 0.02;
    // Wenn gehalten, prallt Ball leicht ab (Endpunkt beim Keeper)
    const endUX = targetUX;

    let t = 0;
    const dur = 46; // frames

    function step(){
      t++;
      const p = Math.min(t/dur, 1);
      const ease = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;

      // Keeper springt (leicht früher & schneller)
      const kp = Math.min(t/ (dur*0.72), 1);
      const ke = 1-Math.pow(1-kp,3);
      keeper.ux = 0.5 + (keeperTargetUX - 0.5)*ke;

      // Ball fliegt
      ball.ux = startUX + (endUX - startUX)*ease;
      ball.uy = startUY + (endUY - startUY)*ease;
      ball.ur = 0.030 - 0.0115*ease; // wird kleiner (weiter weg)

      render();

      if(p < 1){
        anim = requestAnimationFrame(step);
      } else {
        anim = null;
        finishShot(saved);
      }
    }
    stopAnim();
    anim = requestAnimationFrame(step);
  }

  function finishShot(saved){
    // Ergebnis buchen
    if(saved){
      shotLog[shooter].push('🧤');
      message = '🧤 Gehalten! Kein Tor.';
    } else {
      scores[shooter]++;
      shotLog[shooter].push('⚽');
      message = '⚽ TOOOR!';
      spawnConfetti(ball.ux*W, ball.uy*H); /* Jubel! */
    }
    phase = 'shot';
    updateUI();
    document.getElementById('turnbar').innerHTML = message + (saved?'':' 🎉');

    // kurze Pause, dann nächster
    setTimeout(nextTurn, 1100);
  }

  function nextTurn(){
    chosenZone = -1; keeperZone = -1;
    stopAnim();
    particles = [];
    // Ball & Keeper zurück
    ball.ux = 0.5; ball.uy = 0.867; ball.ur = 0.030;
    keeper.ux = 0.5; keeper.uy = GOAL_UY + 0.113;
    render();

    // Reihenfolge: S1 R1, S2 R1, S1 R2, ...
    if(shooter===0){
      shooter = 1;
    } else {
      shooter = 0;
      round++;
    }

    // Ende prüfen (beide haben ihre TOTAL Schüsse)
    if(shotLog[0].length >= TOTAL && shotLog[1].length >= TOTAL){
      endGame();
      return;
    }
    // Early-Ende (uneinholbar) — optional fair: erst nach abgeschlossenen Runden
    const remaining0 = TOTAL - shotLog[0].length;
    const remaining1 = TOTAL - shotLog[1].length;
    if(scores[0] > scores[1] + remaining1){ endGame(); return; }
    if(scores[1] > scores[0] + remaining0){ endGame(); return; }

    phase = 'aim';
    updateUI();
  }

  function endGame(){
    phase = 'over';
    stopAnim();
    updateUI();
    const ov = document.getElementById('overlay');
    const trophy = document.getElementById('trophy');
    const title = document.getElementById('endtitle');
    const es = document.getElementById('endscore');
    es.textContent = '🔴 '+scores[0]+' : '+scores[1]+' 🔵';
    if(scores[0] > scores[1]){
      trophy.textContent = '🏆'; title.innerHTML = '🔴 Spieler 1 gewinnt!';
    } else if(scores[1] > scores[0]){
      trophy.textContent = '🏆'; title.innerHTML = '🔵 Spieler 2 gewinnt!';
    } else {
      trophy.textContent = '🤝'; title.textContent = 'Unentschieden!';
      es.textContent = 'Gleichstand ' + scores[0]+' : '+scores[1];
    }
    ov.classList.add('show');
  }

  window.restart = function(){
    document.getElementById('overlay').classList.remove('show');
    reset();
  };

  // Events (Touch + Klick)
  for(let i=0;i<3;i++){
    const b = document.getElementById('z'+i);
    const handler = function(e){ e.preventDefault(); if(!b.disabled) onZone(i); };
    b.addEventListener('click', handler);
    b.addEventListener('touchstart', handler, {passive:false});
  }

  setupCanvas();
  reset();
})();
</script>
