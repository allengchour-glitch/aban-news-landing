<html lang="de">
<head>

<meta property="og:title" content="Memory 🃏">
<meta property="og:description" content="Memory-Duell: abwechselnd Paare aufdecken, wer mehr findet, gewinnt.">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    background: linear-gradient(160deg, #bce6ff, #dff2ff, #eaf7ff);
    background-attachment: fixed;
    color: #234;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 10px 24px;
    overflow-x: hidden;
    user-select: none;
  }
  .back {
    align-self: flex-start;
    background: #fffdf6;
    border: none;
    border-radius: 16px;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: 700;
    color: #3a7dd8;
    box-shadow: 0 4px 14px rgba(40,90,150,.15);
    cursor: pointer;
    min-height: 46px;
    transition: transform .1s, box-shadow .15s;
  }
  .back:active { transform: translateY(2px); box-shadow: 0 2px 8px rgba(40,90,150,.15); }
  h1 {
    font-size: 30px;
    margin: 8px 0 4px;
    color: #1c6ea4;
    text-shadow: 0 2px 0 rgba(255,255,255,.9);
  }
  .scores {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 440px;
    margin: 8px 0;
  }
  .pcard {
    flex: 1;
    background: #fffdf6;
    border-radius: 18px;
    padding: 10px 8px;
    text-align: center;
    box-shadow: 0 4px 14px rgba(40,90,150,.15);
    border: 3px solid transparent;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .pcard.active { transform: scale(1.05); box-shadow: 0 8px 18px rgba(40,90,150,.22); }
  .pcard.p1.active { border-color: #e8574a; }
  .pcard.p2.active { border-color: #3a7dd8; }
  .pname { font-size: 15px; font-weight: 800; }
  .p1 .pname { color: #e8574a; }
  .p2 .pname { color: #3a7dd8; }
  .pscore { font-size: 30px; font-weight: 900; line-height: 1; margin-top: 2px; }
  .turn {
    font-size: 17px;
    font-weight: 800;
    margin: 4px 0 10px;
    min-height: 24px;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 440px;
    aspect-ratio: 1 / 1;
  }
  .card {
    position: relative;
    border-radius: 16px;
    cursor: pointer;
    perspective: 600px;
    min-height: 46px;
  }
  .inner {
    position: absolute;
    inset: 0;
    transition: transform .4s;
    transform-style: preserve-3d;
  }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    box-shadow: 0 4px 14px rgba(40,90,150,.18);
  }
  .front {
    background: linear-gradient(150deg, #ffdd6e, #ffcf3a 55%, #ff8c2a);
    font-size: clamp(24px, 9vw, 40px);
    box-shadow: 0 4px 14px rgba(255,140,42,.3), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .front::after { content: "❓"; text-shadow: 0 2px 4px rgba(120,60,0,.25); }
  .back-face {
    background: linear-gradient(175deg, #ffffff, #fffdf6 60%, #f4f0e2);
    transform: rotateY(180deg);
    font-size: clamp(28px, 11vw, 48px);
  }
  .card.matched .back-face { background: linear-gradient(175deg, #e6ffe9, #d8ffe0); box-shadow: 0 0 0 3px #7ed957 inset, 0 4px 14px rgba(60,160,90,.25); }
  .card.matched { animation: pop .4s; }
  @keyframes pop { 50% { transform: scale(1.12); } }
  .confetti {
    position: fixed; top: -16px; z-index: 20; border-radius: 3px; pointer-events: none;
    animation: cfall linear forwards;
  }
  @keyframes cfall { to { transform: translateY(112vh) rotate(720deg); } }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(30,60,90,.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fffdf6;
    border-radius: 26px;
    padding: 26px 22px;
    text-align: center;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 16px 40px rgba(20,60,110,.35);
  }
  .modal .big { font-size: 54px; }
  .modal h2 { font-size: 26px; color: #1c6ea4; margin: 8px 0; }
  .modal p { font-size: 18px; margin-bottom: 16px; color: #456; }
  .btn {
    background: linear-gradient(180deg, #ffd75e, #ffcf3a 55%, #ff8c2a);
    color: #5a3600;
    border: none;
    border-radius: 18px;
    padding: 14px 22px;
    font-size: 19px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(255,140,42,.4), inset 0 1px 0 rgba(255,255,255,.5);
    min-height: 46px;
    width: 100%;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(255,140,42,.35); }
</style>
</head>
<body>
  <button class="back" onclick="if(window.parent!==window){parent.postMessage('mini-back','*')}else{history.back()}">← Zurück</button>
  <h1>🃏 Memory</h1>
  <div class="scores">
    <div class="pcard p1" id="pc1">
      <div class="pname">🔴 Spieler 1</div>
      <div class="pscore" id="s1">0</div>
    </div>
    <div class="pcard p2" id="pc2">
      <div class="pname">🔵 Spieler 2</div>
      <div class="pscore" id="s2">0</div>
    </div>
  </div>
  <div class="turn" id="turn">🔴 Spieler 1 ist dran</div>
  <div id="board"></div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="big" id="wemoji">🏆</div>
      <h2 id="wtitle">Gewinner!</h2>
      <p id="wtext"></p>
      <button class="btn" id="again">🔁 Nochmal</button>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var EMOJIS = ["🐶","🐱","🦊","🐼","🦁","🐸","🐙","🦄"];
  var board = document.getElementById("board");
  var turnEl = document.getElementById("turn");
  var s1El = document.getElementById("s1"), s2El = document.getElementById("s2");
  var pc1 = document.getElementById("pc1"), pc2 = document.getElementById("pc2");
  var overlay = document.getElementById("overlay");

  var cards = [];        // {el, emoji, matched}
  var first = null, second = null;
  var lock = false;
  var current = 1;       // 1 or 2
  var scores = {1:0, 2:0};
  var matchedCount = 0;

  function shuffle(a){
    for (var i = a.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function buildCard(emoji){
    var el = document.createElement("div");
    el.className = "card";
    el.innerHTML = '<div class="inner">'
      + '<div class="face front"></div>'
      + '<div class="face back-face">'+emoji+'</div>'
      + '</div>';
    var card = {el:el, emoji:emoji, matched:false};
    function activate(e){
      e.preventDefault();
      onPick(card);
    }
    el.addEventListener("click", activate);
    el.addEventListener("touchstart", activate, {passive:false});
    return card;
  }

  function newGame(){
    board.innerHTML = "";
    cards = [];
    first = second = null;
    lock = false;
    current = 1;
    scores = {1:0, 2:0};
    matchedCount = 0;
    updateScores();
    updateTurn();
    overlay.classList.remove("show");
    var deck = shuffle(EMOJIS.concat(EMOJIS));
    for (var i=0;i<deck.length;i++){
      var c = buildCard(deck[i]);
      cards.push(c);
      board.appendChild(c.el);
    }
  }

  function onPick(card){
    if (lock) return;
    if (card.matched) return;
    if (card === first) return;
    card.el.classList.add("flipped");
    if (!first){ first = card; return; }
    second = card;
    lock = true;
    if (first.emoji === second.emoji){
      setTimeout(matchFound, 450);
    } else {
      setTimeout(noMatch, 900);
    }
  }

  function matchFound(){
    first.matched = second.matched = true;
    first.el.classList.add("matched");
    second.el.classList.add("matched");
    scores[current]++;
    matchedCount++;
    updateScores();
    first = second = null;
    lock = false;
    if (matchedCount === EMOJIS.length){
      setTimeout(endGame, 500);
    } else {
      // gleicher Spieler darf nochmal (Extra-Zug bei Treffer)
      updateTurn(true);
    }
  }

  function noMatch(){
    first.el.classList.remove("flipped");
    second.el.classList.remove("flipped");
    first = second = null;
    lock = false;
    current = current === 1 ? 2 : 1;
    updateTurn();
  }

  function updateScores(){
    s1El.textContent = scores[1];
    s2El.textContent = scores[2];
  }

  function updateTurn(bonus){
    pc1.classList.toggle("active", current===1);
    pc2.classList.toggle("active", current===2);
    var who = current===1 ? "🔴 Spieler 1" : "🔵 Spieler 2";
    turnEl.textContent = bonus ? (who + " — Paar! Nochmal 🎉") : (who + " ist dran");
  }

  function confetti(){
    var colors = ["#ffcf3a","#ff8c2a","#e8574a","#3a7dd8","#7ed957","#fffdf6"];
    for (var i=0;i<60;i++){
      var s = document.createElement("div");
      s.className = "confetti";
      s.style.left = (Math.random()*100) + "vw";
      s.style.width = (6+Math.random()*6) + "px";
      s.style.height = (8+Math.random()*8) + "px";
      s.style.background = colors[i % colors.length];
      s.style.animationDuration = (1.6+Math.random()*1.6) + "s";
      s.style.animationDelay = (Math.random()*0.5) + "s";
      document.body.appendChild(s);
      (function(el){ setTimeout(function(){ if(el.parentNode){ el.parentNode.removeChild(el); } }, 4200); })(s);
    }
  }

  function endGame(){
    var em = document.getElementById("wemoji");
    var ti = document.getElementById("wtitle");
    var tx = document.getElementById("wtext");
    if (scores[1] === scores[2]){
      em.textContent = "🤝";
      ti.textContent = "Unentschieden!";
      tx.textContent = "Beide " + scores[1] + " Paare. Super gespielt!";
    } else {
      var winner = scores[1] > scores[2] ? 1 : 2;
      em.textContent = "🏆";
      ti.textContent = (winner===1 ? "🔴 Spieler 1" : "🔵 Spieler 2") + " gewinnt!";
      tx.textContent = scores[1] + " : " + scores[2] + " Paare";
      confetti();
    }
    overlay.classList.add("show");
  }

  document.getElementById("again").addEventListener("click", newGame);
  newGame();
})();
</script>
