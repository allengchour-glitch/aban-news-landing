<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tipp-Duell</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  html,body{height:100%;overflow:hidden;}
  body{background:linear-gradient(160deg,#bce6ff 0%,#eaf7ff 100%);}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  .backbtn{position:absolute;top:10px;left:10px;z-index:50;
    min-height:46px;padding:8px 16px;border:none;border-radius:18px;
    background:rgba(255,255,255,.85);color:#2b6cb0;font-size:16px;font-weight:bold;
    box-shadow:0 3px 8px rgba(0,0,0,.15);cursor:pointer;}
  .backbtn:active{transform:scale(.95);}

  /* Spielfelder */
  .arena{flex:1;display:flex;flex-direction:column;}
  .half{flex:1;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:filter .1s;}
  .half.top{background:linear-gradient(160deg,#ffd6e7,#ffb3d1);border-bottom:5px dashed #fff;}
  .half.bottom{background:linear-gradient(160deg,#c9f0d6,#8fe3ad);}
  .half.top .flip{transform:rotate(180deg);}
  .half.pulse{animation:pulse .15s;}
  @keyframes pulse{0%{filter:brightness(1.25)}100%{filter:brightness(1)}}

  .who{font-size:22px;font-weight:bold;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.25);margin-bottom:4px;}
  .count{font-size:64px;font-weight:900;color:#fff;text-shadow:0 3px 6px rgba(0,0,0,.3);line-height:1;}
  .tapicon{font-size:40px;margin-top:6px;opacity:.85;}
  .bar{width:70%;max-width:260px;height:16px;background:rgba(255,255,255,.5);border-radius:10px;margin-top:14px;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0%;background:#ff5e93;border-radius:10px;transition:width .12s;}
  .half.bottom .bar > i{background:#22a95a;}

  /* Mitte: Timer + Start */
  .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;
    display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  .timerbadge{background:#fff;border-radius:50%;width:88px;height:88px;display:flex;
    align-items:center;justify-content:center;font-size:38px;font-weight:900;color:#2b6cb0;
    box-shadow:0 6px 16px rgba(0,0,0,.25);}

  /* Overlay (Start / Ende) */
  .overlay{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(3px);}
  .overlay.hidden{display:none;}
  .card{background:#fff;border-radius:26px;padding:26px 22px;max-width:340px;width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.18);}
  .title{font-size:34px;font-weight:900;color:#2b6cb0;margin-bottom:6px;}
  .emoji{font-size:56px;margin-bottom:8px;}
  .sub{font-size:17px;color:#555;line-height:1.4;margin-bottom:18px;}
  .btn{min-height:56px;width:100%;border:none;border-radius:20px;font-size:22px;font-weight:bold;
    color:#fff;background:linear-gradient(90deg,#ff8ab5,#ff5e93);cursor:pointer;
    box-shadow:0 5px 14px rgba(255,94,147,.4);}
  .btn:active{transform:scale(.97);}
  .btn.green{background:linear-gradient(90deg,#57d98a,#22a95a);box-shadow:0 5px 14px rgba(34,169,90,.4);}
  .scores{display:flex;gap:14px;justify-content:center;margin:14px 0 18px;}
  .scorebox{flex:1;background:#f4f8ff;border-radius:16px;padding:10px;}
  .scorebox .lbl{font-size:14px;color:#888;}
  .scorebox .val{font-size:30px;font-weight:900;}
  .scorebox.p1 .val{color:#ff5e93;}
  .scorebox.p2 .val{color:#22a95a;}
</style>
</head>
<body>
<div id="app">
  <button class="backbtn" onclick="if(window.parent!==window){parent.postMessage('mini-back','*')}else{history.back()}">← Zurück</button>

  <div class="arena">
    <div class="half top" id="halfTop">
      <div class="flip" style="display:flex;flex-direction:column;align-items:center;">
        <div class="who">🌸 Spieler 1</div>
        <div class="count" id="cntTop">0</div>
        <div class="tapicon">👆 tippen!</div>
        <div class="bar"><i id="barTop"></i></div>
      </div>
    </div>
    <div class="half bottom" id="halfBottom">
      <div class="who">🌿 Spieler 2</div>
      <div class="count" id="cntBottom">0</div>
      <div class="tapicon">👆 tippen!</div>
      <div class="bar"><i id="barBottom"></i></div>
    </div>
  </div>

  <div class="center"><div class="timerbadge" id="timer">10</div></div>

  <!-- Start-Overlay -->
  <div class="overlay" id="startOverlay">
    <div class="card">
      <div class="emoji">👆⚡</div>
      <div class="title">Tipp-Duell</div>
      <div class="sub">Jeder tippt <b>10 Sekunden</b> lang so schnell wie möglich auf seine Hälfte.<br>Wer öfter tippt, gewinnt!</div>
      <button class="btn" id="startBtn">▶ Los geht's!</button>
    </div>
  </div>

  <!-- End-Overlay -->
  <div class="overlay hidden" id="endOverlay">
    <div class="card">
      <div class="emoji" id="endEmoji">🏆</div>
      <div class="title" id="endTitle">Sieger!</div>
      <div class="scores">
        <div class="scorebox p1"><div class="lbl">🌸 Spieler 1</div><div class="val" id="endP1">0</div></div>
        <div class="scorebox p2"><div class="lbl">🌿 Spieler 2</div><div class="val" id="endP2">0</div></div>
      </div>
      <button class="btn green" id="againBtn">🔁 Nochmal</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var DURATION = 10;
  var top=0, bottom=0, running=false, endTime=0, rafId=null;

  var elCntTop=document.getElementById('cntTop');
  var elCntBottom=document.getElementById('cntBottom');
  var elBarTop=document.getElementById('barTop');
  var elBarBottom=document.getElementById('barBottom');
  var elTimer=document.getElementById('timer');
  var halfTop=document.getElementById('halfTop');
  var halfBottom=document.getElementById('halfBottom');
  var startOverlay=document.getElementById('startOverlay');
  var endOverlay=document.getElementById('endOverlay');

  function updateBars(){
    var max=Math.max(top,bottom,1);
    elBarTop.style.width=(top/max*100)+'%';
    elBarBottom.style.width=(bottom/max*100)+'%';
  }

  function pulse(el){
    el.classList.remove('pulse');
    // force reflow to restart animation
    void el.offsetWidth;
    el.classList.add('pulse');
  }

  function tap(which){
    if(!running) return;
    if(which==='top'){ top++; elCntTop.textContent=top; pulse(halfTop); }
    else { bottom++; elCntBottom.textContent=bottom; pulse(halfBottom); }
    updateBars();
  }

  // Ein Handler für Touch + Maus, doppeltes Zählen vermeiden
  function bindHalf(el, which){
    var touched=false;
    el.addEventListener('touchstart', function(e){
      touched=true; e.preventDefault();
      var n=e.changedTouches?e.changedTouches.length:1;
      for(var i=0;i<n;i++) tap(which);
    }, {passive:false});
    el.addEventListener('mousedown', function(e){
      if(touched){ touched=false; return; }
      e.preventDefault(); tap(which);
    });
  }
  bindHalf(halfTop,'top');
  bindHalf(halfBottom,'bottom');

  function loop(){
    if(!running) return;
    var remain=(endTime-Date.now())/1000;
    if(remain<=0){ elTimer.textContent='0'; finish(); return; }
    elTimer.textContent=Math.ceil(remain);
    rafId=requestAnimationFrame(loop);
  }

  function start(){
    top=0; bottom=0; running=true;
    elCntTop.textContent='0'; elCntBottom.textContent='0';
    updateBars();
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    endTime=Date.now()+DURATION*1000;
    elTimer.textContent=String(DURATION);
    if(rafId) cancelAnimationFrame(rafId);
    rafId=requestAnimationFrame(loop);
  }

  function finish(){
    running=false;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    var emoji=document.getElementById('endEmoji');
    var title=document.getElementById('endTitle');
    document.getElementById('endP1').textContent=top;
    document.getElementById('endP2').textContent=bottom;
    if(top>bottom){ emoji.textContent='🌸🏆'; title.textContent='Spieler 1 gewinnt!'; title.style.color='#ff5e93'; }
    else if(bottom>top){ emoji.textContent='🌿🏆'; title.textContent='Spieler 2 gewinnt!'; title.style.color='#22a95a'; }
    else { emoji.textContent='🤝'; title.textContent='Unentschieden!'; title.style.color='#2b6cb0'; }
    endOverlay.classList.remove('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
})();
</script>
</body>
</html>
