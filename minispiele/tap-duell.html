<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="aban-nav" content="off">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tipp-Duell</title>
<link rel="canonical" href="https://abannews.com/minispiele/tap-duell.html">
<meta name="description" content="Tap-Duell: 10 Sekunden, wer öfter tippt, gewinnt.">
<meta property="og:title" content="Tipp-Duell">
<meta property="og:description" content="Tap-Duell: 10 Sekunden, wer öfter tippt, gewinnt.">
<meta property="og:url" content="https://abannews.com/minispiele/tap-duell.html">
<meta property="og:type" content="website">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  html,body{height:100%;overflow:hidden;}
  body{background:linear-gradient(160deg,#bce6ff,#dff2ff,#eaf7ff);}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  .backbtn{position:absolute;top:10px;left:10px;z-index:50;
    min-height:46px;padding:8px 18px;border:none;border-radius:16px;
    background:#fffdf6;color:#2b6cb0;font-size:16px;font-weight:bold;
    box-shadow:0 4px 14px rgba(40,90,150,.18);cursor:pointer;}
  .backbtn:active{transform:scale(.95);}

  /* Spielfelder */
  .arena{flex:1;display:flex;flex-direction:column;padding:10px;gap:10px;}
  .half{flex:1;position:relative;display:flex;flex-direction:column;border-radius:20px;
    align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:filter .1s;
    box-shadow:0 4px 14px rgba(40,90,150,.15), inset 0 0 0 3px rgba(255,255,255,.45);}
  .half.top{background:
    radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),
    linear-gradient(200deg,#f8998b,#e8574a);}
  .half.bottom{background:
    radial-gradient(120% 90% at 50% 100%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),
    linear-gradient(160deg,#7fb3ea,#3a7dd8);}
  .half.top .flip{transform:rotate(180deg);}
  .half.pulse{animation:pulse .15s;}
  @keyframes pulse{0%{filter:brightness(1.25)}100%{filter:brightness(1)}}

  .who{font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.3);margin-bottom:4px;letter-spacing:.5px;}
  .count{font-size:76px;font-weight:900;color:#fff;text-shadow:0 4px 10px rgba(0,0,0,.32);line-height:1;}
  .tapicon{font-size:44px;margin-top:8px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.25);opacity:.95;}
  .bar{width:70%;max-width:260px;height:16px;background:rgba(255,255,255,.4);border-radius:10px;margin-top:14px;overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.15);}
  .bar > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffcf3a,#ff8c2a);border-radius:10px;transition:width .12s;}

  /* Mitte: Timer + Start */
  .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;
    display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  .timerbadge{background:#fffdf6;border-radius:50%;width:92px;height:92px;display:flex;
    align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#2b6cb0;
    border:5px solid #ffcf3a;box-shadow:0 8px 20px rgba(40,90,150,.3);}

  /* Overlay (Start / Ende) */
  .overlay{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;
    background:rgba(223,242,255,.88);backdrop-filter:blur(4px);}
  .overlay.hidden{display:none;}
  .card{background:#fffdf6;border-radius:24px;padding:28px 22px;max-width:340px;width:100%;
    box-shadow:0 14px 34px rgba(40,90,150,.22);}
  .title{font-size:34px;font-weight:900;color:#2b6cb0;margin-bottom:6px;}
  .emoji{font-size:60px;margin-bottom:8px;}
  .sub{font-size:17px;color:#5a7590;line-height:1.4;margin-bottom:18px;}
  .btn{min-height:56px;width:100%;border:none;border-radius:18px;font-size:22px;font-weight:bold;
    color:#fff;background:linear-gradient(180deg,#ffcf3a,#ff8c2a);cursor:pointer;
    text-shadow:0 1px 3px rgba(140,60,0,.35);
    box-shadow:0 6px 16px rgba(255,140,42,.45);}
  .btn:active{transform:scale(.97);}
  .btn.green{background:linear-gradient(180deg,#ffcf3a,#ff8c2a);box-shadow:0 6px 16px rgba(255,140,42,.45);}
  .scores{display:flex;gap:14px;justify-content:center;margin:14px 0 18px;}
  .scorebox{flex:1;background:#f2f7ff;border-radius:16px;padding:10px;box-shadow:0 4px 14px rgba(40,90,150,.12);}
  .scorebox .lbl{font-size:14px;color:#7a8ea3;font-weight:bold;}
  .scorebox .val{font-size:32px;font-weight:900;}
  .scorebox.p1 .val{color:#e8574a;}
  .scorebox.p2 .val{color:#3a7dd8;}
</style>
</head>
<body>
<div id="app">
  <button class="backbtn" onclick="if(window.parent!==window){parent.postMessage('mini-back','*')}else{history.back()}">← Zurück</button>

  <div class="arena">
    <div class="half top" id="halfTop">
      <div class="flip" style="display:flex;flex-direction:column;align-items:center;">
        <div class="who">🔴 Spieler 1</div>
        <div class="count" id="cntTop">0</div>
        <div class="tapicon">👆 tippen!</div>
        <div class="bar"><i id="barTop"></i></div>
      </div>
    </div>
    <div class="half bottom" id="halfBottom">
      <div class="who">🔵 Spieler 2</div>
      <div class="count" id="cntBottom">0</div>
      <div class="tapicon">👆 tippen!</div>
      <div class="bar"><i id="barBottom"></i></div>
    </div>
  </div>

  <div class="center"><div class="timerbadge" id="timer">10</div></div>

  <!-- Start-Overlay -->
  <div class="overlay" id="startOverlay">
    <div class="card">
      <div class="emoji">👆⚡</div>
      <div class="title">Tipp-Duell</div>
      <div class="sub">Jeder tippt <b>10 Sekunden</b> lang so schnell wie möglich auf seine Hälfte.<br>Wer öfter tippt, gewinnt!</div>
      <div style="margin-top:10px;font-size:11px;opacity:.6"><a href="/impressum.html" style="color:inherit">Impressum</a> · <a href="/datenschutz.html" style="color:inherit">Datenschutz</a></div>
      <button class="btn" id="startBtn">▶ Los geht's!</button>
    </div>
  </div>

  <!-- End-Overlay -->
  <div class="overlay hidden" id="endOverlay">
    <div class="card">
      <div class="emoji" id="endEmoji">🏆</div>
      <div class="title" id="endTitle">Sieger!</div>
      <div class="scores">
        <div class="scorebox p1"><div class="lbl">🔴 Spieler 1</div><div class="val" id="endP1">0</div></div>
        <div class="scorebox p2"><div class="lbl">🔵 Spieler 2</div><div class="val" id="endP2">0</div></div>
      </div>
      <button class="btn green" id="againBtn">🔁 Nochmal</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var DURATION = 10;
  var top=0, bottom=0, running=false, endTime=0, rafId=null;

  var elCntTop=document.getElementById('cntTop');
  var elCntBottom=document.getElementById('cntBottom');
  var elBarTop=document.getElementById('barTop');
  var elBarBottom=document.getElementById('barBottom');
  var elTimer=document.getElementById('timer');
  var halfTop=document.getElementById('halfTop');
  var halfBottom=document.getElementById('halfBottom');
  var startOverlay=document.getElementById('startOverlay');
  var endOverlay=document.getElementById('endOverlay');

  function updateBars(){
    var max=Math.max(top,bottom,1);
    elBarTop.style.width=(top/max*100)+'%';
    elBarBottom.style.width=(bottom/max*100)+'%';
  }

  function pulse(el){
    el.classList.remove('pulse');
    /* force reflow to restart animation */
    void el.offsetWidth;
    el.classList.add('pulse');
  }

  function tap(which){
    if(!running) return;
    if(which==='top'){ top++; elCntTop.textContent=top; pulse(halfTop); }
    else { bottom++; elCntBottom.textContent=bottom; pulse(halfBottom); }
    updateBars();
  }

  /* Ein Handler für Touch + Maus, doppeltes Zählen vermeiden */
  function bindHalf(el, which){
    var touched=false;
    el.addEventListener('touchstart', function(e){
      touched=true; e.preventDefault();
      var n=e.changedTouches?e.changedTouches.length:1;
      for(var i=0;i<n;i++) tap(which);
    }, {passive:false});
    el.addEventListener('mousedown', function(e){
      if(touched){ touched=false; return; }
      e.preventDefault(); tap(which);
    });
  }
  bindHalf(halfTop,'top');
  bindHalf(halfBottom,'bottom');

  function loop(){
    if(!running) return;
    var remain=(endTime-Date.now())/1000;
    if(remain<=0){ elTimer.textContent='0'; finish(); return; }
    elTimer.textContent=Math.ceil(remain);
    rafId=requestAnimationFrame(loop);
  }

  function start(){
    top=0; bottom=0; running=true;
    elCntTop.textContent='0'; elCntBottom.textContent='0';
    updateBars();
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    endTime=Date.now()+DURATION*1000;
    elTimer.textContent=String(DURATION);
    if(rafId) cancelAnimationFrame(rafId);
    rafId=requestAnimationFrame(loop);
  }

  function finish(){
    running=false;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    var emoji=document.getElementById('endEmoji');
    var title=document.getElementById('endTitle');
    document.getElementById('endP1').textContent=top;
    document.getElementById('endP2').textContent=bottom;
    if(top>bottom){ emoji.textContent='🔴🏆'; title.textContent='Spieler 1 gewinnt!'; title.style.color='#e8574a'; }
    else if(bottom>top){ emoji.textContent='🔵🏆'; title.textContent='Spieler 2 gewinnt!'; title.style.color='#3a7dd8'; }
    else { emoji.textContent='🤝'; title.textContent='Unentschieden!'; title.style.color='#2b6cb0'; }
    endOverlay.classList.remove('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
})();
</script>
</body>
</html>
